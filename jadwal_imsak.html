<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Imsakiyah Ramadhan - Kabupaten Pemalang</title>

<style>
body{
    margin:0;
    background:#0f2e28;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Segoe UI', sans-serif;
}

/* CONTAINER */
.container{
    width:390px;
    height:780px;
    background-image:url('ramadan_template_blank.png');
    background-size:cover;
    background-position:center;
    position:relative;
    color:#ffffff;
    overflow:hidden;
    animation: glow 4s infinite ease-in-out;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

/* Glow halus */
@keyframes glow{
    0%{ filter:brightness(1); }
    50%{ filter:brightness(1.08); }
    100%{ filter:brightness(1); }
}

/* Overlay gelap tipis */
.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.35) 0%,
        rgba(0,0,0,0.25) 50%,
        rgba(0,0,0,0.55) 100%
    );
}

/* CONTENT */
.content{
    position:relative;
    z-index:2;
    padding:120px 30px 0 30px;
}

/* HEADER */
h1{
    text-align:center;
    font-size:22px;
    margin-bottom:5px;
    text-shadow:0 0 15px rgba(255,215,0,0.8);
}

h2{
    text-align:center;
    font-size:14px;
    margin-bottom:3px;
}

h3{
    text-align:center;
    font-size:13px;
    margin-bottom:15px;
    letter-spacing:0.5px;
}

/* SELECT */
select{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
    margin-bottom:15px;
    text-align:center;
    text-align-last:center;
    font-size:14px;
    background:rgba(255,255,255,0.9);
}

/* DATE TEXT */
.dateText{
    text-align:center;
    font-size:12px;
    margin-bottom:15px;
    opacity:0.9;
}

/* TABLE */
.table{
    background:rgba(0,0,0,0.45);
    border-radius:18px;
    padding:18px;
    backdrop-filter:blur(8px);
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

.row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.15);
    font-size:14px;
}

.row:last-child{
    border-bottom:none;
}

/* FOOTER */
.footer{
    position:relative;
    z-index:2;
    text-align:center;
    font-size:11px;
    padding-bottom:20px;
    opacity:0.9;
    letter-spacing:0.5px;
}
</style>
</head>

<body>

<div class="container">
<div class="overlay"></div>

<div class="content">
    <h1>JADWAL IMSAKIYAH</h1>
    <h2>Ramadhan 1447 H</h2>
    <h3>Kabupaten Pemalang</h3>

    <select id="daySelect" onchange="updateSchedule()"></select>

    <div class="dateText" id="dateText"></div>

    <div class="table">
        <div class="row"><span>Imsak</span><span id="imsak"></span></div>
        <div class="row"><span>Subuh</span><span id="subuh"></span></div>
        <div class="row"><span>Dzuhur</span><span id="dzuhur"></span></div>
        <div class="row"><span>Ashar</span><span id="ashar"></span></div>
        <div class="row"><span>Maghrib</span><span id="maghrib"></span></div>
        <div class="row"><span>Isya</span><span id="isya"></span></div>
    </div>
</div>

<div class="footer">
© 2026 MB · All Rights Reserved Jadwal Ramadhan Pemalang
</div>

</div>

<script>

const select=document.getElementById("daySelect");

for(let i=1;i<=30;i++){
    let opt=document.createElement("option");
    opt.value=i;
    opt.text=i+" Ramadhan";
    select.appendChild(opt);
}

function updateSchedule(){
    const day=select.value;
    document.getElementById("dateText").innerText=data[day][0];
    document.getElementById("imsak").innerText=data[day][1];
    document.getElementById("subuh").innerText=data[day][2];
    document.getElementById("dzuhur").innerText=data[day][3];
    document.getElementById("ashar").innerText=data[day][4];
    document.getElementById("maghrib").innerText=data[day][5];
    document.getElementById("isya").innerText=data[day][6];
}

updateSchedule();
</script>

</body>
</html>
