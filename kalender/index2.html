<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kalender Pintar Final</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #cfe3f5;
  padding: 20px;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
}

button {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background: #1e3a8a;
  color: white;
  cursor: pointer;
  font-weight: 600;
}

select {
  padding: 6px;
  border-radius: 6px;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 20px;
}

/* WRAPPER */
.card-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 260px;
}

/* CARD */
.card {
  width: 100%;
  text-align: center;
}

/* SPIRAL (ARC STYLE) */
.spiral {
  display: flex;
  justify-content: center;
  gap: 5px;
  margin-bottom: -12px;
}

.ring {
  width: 18px;
  height: 18px;
  border: 3px solid #1f2937;
  border-radius: 50%;
  border-right-color: transparent;
  border-bottom-color: transparent;
  transform: rotate(20deg);
}

/* HEADER */
.header {
  color: white;
  font-weight: 700;
  padding: 10px;
  border-radius: 14px 14px 0 0;
  font-size: 18px;
}

/* BOX */
.box {
  display: flex;
  border-radius: 0 0 14px 14px;
  overflow: hidden;
  box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

/* LEFT */
.left {
  width: 65%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* DATE */
.date {
  font-size: 70px;
  font-weight: 800;
  color: #ff5722;
}

/* RIGHT */
.right {
  width: 35%;
  background: #e6f0ff;
  padding: 10px;
  position: relative;
}

.small-month {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 10px;
  font-weight: 700;
  color: #1e3a8a;
}

/* INFO */
.info {
  font-size: 10px;
  margin-top: 6px;
  text-align: left;
  font-weight: 600;
}

/* DESKRIPSI */
.desc {
  min-height: 40px;
  margin-top: 10px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
}

/* TEXTAREA */
textarea {
  width: 90%;
  margin-top: 8px;
  font-size: 12px;
  height: 42px;
  resize: none;
  border-radius: 12px;
  border: none;
  padding: 8px;
  outline: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  background: #ffffff;
  cursor: pointer;
}

textarea.locked {
  background: #eee;
  cursor: not-allowed;
}

/* POPUP */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
}

.popup-box {
  background: white;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

.popup-box input {
  padding: 8px;
  margin-top: 10px;
  width: 200px;
}
</style>
</head>

<body>

<div class="navbar">
  <button onclick="prevMonth()">⬅</button>
  <div id="title"></div>
  <button onclick="nextMonth()">➡</button>
  <select id="yearSelect" onchange="changeYear(this.value)"></select>
</div>

<div class="container" id="container"></div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <div>Masukkan Password</div>
    <input type="password" id="passInput">
    <br><br>
    <button onclick="checkPassword()">OK</button>
  </div>
</div>

<script>
const PASSWORD = "mb12345";
let activeTextarea = null;

const monthNames = [
  "Januari","Februari","Maret","April","Mei","Juni",
  "Juli","Agustus","September","Oktober","November","Desember"
];

const colors = [
  "#1e3a8a", "#a3d341", "#a3d341", "#4caf50",
  "#e879c6", "#8b5cf6", "#8b5cf6", "#f97316",
  "#06b6d4", "#fb923c", "#10b981", "#facc15"
];

let currentMonth = 2;
let currentYear = 2026;

/* DROPDOWN */
const yearSelect = document.getElementById("yearSelect");
for(let y=2020; y<=2035; y++){
  let opt = document.createElement("option");
  opt.value = y;
  opt.text = y;
  yearSelect.appendChild(opt);
}
yearSelect.value = currentYear;

/* RENDER */
function render() {
  document.getElementById("title").innerText =
    monthNames[currentMonth] + " " + currentYear;

  const container = document.getElementById("container");
  container.innerHTML = "";

  const totalDays = new Date(currentYear, currentMonth+1, 0).getDate();

  for(let d=1; d<=totalDays; d++) {

    let id = `${currentYear}-${currentMonth}-${d}`;
    let rawNote = localStorage.getItem("note-"+id+"_raw") || "";

    let wrapper = document.createElement("div");
    wrapper.className = "card-wrapper";

    wrapper.innerHTML = `
      <div class="card">
        <div class="spiral">
          ${'<div class="ring"></div>'.repeat(8)}
        </div>

        <div class="header" style="background:${colors[currentMonth]}">
          ${monthNames[currentMonth]}
        </div>

        <div class="box">
          <div class="left">
            <div class="date">${d}</div>
          </div>

          <div class="right">
            <div class="small-month">${monthNames[currentMonth].toUpperCase()}</div>

            <div class="info">📅 ${d} ${monthNames[currentMonth]} ${currentYear}</div>
            <div class="info">🌙 ${getHijriDate(currentYear,currentMonth,d)}</div>
            <div class="info">🗓️ ${getJavaneseDay(currentYear,currentMonth,d)}</div>
            <div class="info">☪️ ${getIslamicEvent(currentYear,currentMonth,d)}</div>
          </div>
        </div>
      </div>

      <textarea class="locked"
        onclick="requestAccess(this)"
        oninput="updateNotes('${id}', this.value)">${rawNote}</textarea>
    `;

    container.appendChild(wrapper);
  }
}

/* PASSWORD */
function requestAccess(el){
  activeTextarea = el;
  document.getElementById("popup").style.display = "flex";
}

function checkPassword(){
  let val = document.getElementById("passInput").value;
  if(val === PASSWORD){
    activeTextarea.classList.remove("locked");
    activeTextarea.removeAttribute("onclick");
    activeTextarea.focus();
    document.getElementById("popup").style.display = "none";
  } else {
    alert("Password salah!");
  }
}

/* SAVE */
function updateNotes(id, val) {
  localStorage.setItem("note-"+id+"_raw", val);
}

/* NAVIGASI */
function prevMonth() {
  currentMonth--;
  if(currentMonth < 0){
    currentMonth = 11;
    currentYear--;
    yearSelect.value = currentYear;
  }
  render();
}

function nextMonth() {
  currentMonth++;
  if(currentMonth > 11){
    currentMonth = 0;
    currentYear++;
    yearSelect.value = currentYear;
  }
  render();
}

function changeYear(y) {
  currentYear = parseInt(y);
  render();
}

/* HIJRI */
function getHijriDate(y,m,d){
  return new Intl.DateTimeFormat('id-TN-u-ca-islamic',{
    day:'numeric',month:'long',year:'numeric'
  }).format(new Date(y,m,d));
}

/* JAWA */
function getJavaneseDay(y,m,d){
  const days = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  const pasaran = ["Legi","Pahing","Pon","Wage","Kliwon"];

  let date = new Date(y,m,d);
  let base = new Date(2023,0,1);
  let diff = Math.floor((date-base)/86400000);

  return days[date.getDay()]+" "+pasaran[(diff%5+5)%5];
}

/* EVENT ISLAM */
function getIslamicEvent(y,m,d){
  let h = getHijriDate(y,m,d);

  if(h.includes("Ramadhan")) return "Puasa Ramadhan";
  if(h.startsWith("1") && h.includes("Syawal")) return "Idul Fitri";
  if(h.startsWith("10") && h.includes("Dzulhijjah")) return "Idul Adha";

  return "-";
}

render();
</script>

</body>
</html>
