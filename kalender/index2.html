<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kalender Cetak Profesional</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #cfe3f5;
  padding: 15px;
}

/* NAVBAR */
.navbar {
  text-align: center;
  margin-bottom: 20px;
}

/* HEADER HARI */
.day-header {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  margin-bottom: 10px;
  font-weight: 700;
  text-align: center;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 10px;
}

/* CARD */
.card {
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  overflow: hidden;
}

/* HEADER BULAN */
.header {
  background: #4caf50;
  color: white;
  text-align: center;
  padding: 6px;
  font-weight: 700;
}

/* BOX */
.box {
  display: flex;
  min-height: 80px;
}

/* LEFT */
.left {
  width: 45%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.date {
  font-size: 40px;
  font-weight: 800;
  color: #ff5722;
}

.day-name {
  font-size: 11px;
  font-weight: 700;
}

/* RIGHT */
.right {
  width: 55%;
  font-size: 10px;
  padding: 5px;
}

/* INFO */
.info {
  margin-bottom: 3px;
}

/* TEXTAREA */
.textarea-wrap {
  width: 100%;
  padding: 5px;
}

textarea {
  width: 100%;
  height: 40px;
  border-radius: 10px;
  border: none;
  padding: 5px;
  background: #eee;
}

/* TODAY */
.pulse {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% {transform: scale(1);}
  50% {transform: scale(1.2); color:red;}
  100% {transform: scale(1);}
}

/* HOLIDAY */
.holiday {
  color: red;
}

/* PRINT MODE */
@media print {
  body {
    background: white;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <h2 id="title"></h2>
</div>

<div class="day-header">
  <div>Minggu</div>
  <div>Senin</div>
  <div>Selasa</div>
  <div>Rabu</div>
  <div>Kamis</div>
  <div>Jumat</div>
  <div>Sabtu</div>
</div>

<div class="container" id="container"></div>

<script>
const monthNames=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const days=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

const events={
  "2026-2-3":"Hari Nyepi",
  "2026-3-31":"Idul Fitri",
  "2026-7-17":"Hari Kemerdekaan RI"
};

let currentMonth=2;
let currentYear=2026;

function render(){
  document.getElementById("title").innerText=monthNames[currentMonth]+" "+currentYear;
  const container=document.getElementById("container");
  container.innerHTML="";

  let firstDay=new Date(currentYear,currentMonth,1).getDay();
  let totalDays=new Date(currentYear,currentMonth+1,0).getDate();

  let today=new Date();

  // kosong sebelum tanggal 1
  for(let i=0;i<firstDay;i++){
    container.innerHTML+="<div></div>";
  }

  for(let d=1;d<=totalDays;d++){

    let id=`${currentYear}-${currentMonth}-${d}`;
    let dateObj=new Date(currentYear,currentMonth,d);
    let dayName=days[dateObj.getDay()];
    let event=events[id]||"-";

    let isToday=
      d===today.getDate() &&
      currentMonth===today.getMonth() &&
      currentYear===today.getFullYear();

    let isEvent=events[id];

    container.innerHTML+=`
    <div class="card">
      <div class="header">${monthNames[currentMonth]}</div>

      <div class="box">
        <div class="left">
          <div class="date ${isToday?'pulse':''} ${isEvent?'holiday':''}">${d}</div>
          <div class="day-name">${dayName}</div>
        </div>

        <div class="right">
          <div class="info">${d} ${monthNames[currentMonth]}</div>
          <div class="info">${getJavaneseDay(currentYear,currentMonth,d)}</div>
          <div class="info">${event}</div>
        </div>
      </div>

      <div class="textarea-wrap">
        <textarea></textarea>
      </div>
    </div>
    `;
  }
}

function getJavaneseDay(y,m,d){
  const pasaran=["Legi","Pahing","Pon","Wage","Kliwon"];
  let date=new Date(y,m,d);
  let base=new Date(2023,0,1);
  let diff=Math.floor((date-base)/86400000);
  return pasaran[(diff%5+5)%5];
}

render();
</script>

</body>
</html>
