<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kalender Pintar Rapi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #cfe3f5;
  padding: 20px;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
}

button {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background: #1e3a8a;
  color: white;
  cursor: pointer;
  font-weight: 600;
}

select {
  padding: 6px;
  border-radius: 6px;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 20px;
}

/* WRAPPER */
.card-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 260px;
}

/* CARD */
.card {
  width: 100%;
  text-align: center;
  position: relative;
}

/* SPIRAL (DITINGKATKAN) */
.spiral {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-bottom: -10px;
}

.ring {
  width: 14px;
  height: 10px;
  border: 2px solid #1f2937;
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  background: transparent;
}

/* HEADER */
.header {
  color: white;
  font-weight: 700;
  padding: 10px;
  border-radius: 14px 14px 0 0;
  font-size: 18px;
}

/* BOX */
.box {
  display: flex;
  border-radius: 0 0 14px 14px;
  overflow: hidden;
  box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

/* LEFT */
.left {
  width: 65%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* DATE */
.date {
  font-size: 70px;
  font-weight: 800;
  color: #ff5722;
}

/* RIGHT */
.right {
  width: 35%;
  background: #e6f0ff;
  padding: 10px;
  position: relative;
}

.small-month {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 10px;
  font-weight: 700;
  color: #1e3a8a;
}

/* BULLET */
.bullet {
  display: flex;
  align-items: center;
  margin-top: 10px;
}

.dot {
  width: 6px;
  height: 6px;
  background: #3b82f6;
  border-radius: 50%;
  margin-right: 6px;
}

.line {
  height: 2px;
  background: #3b82f6;
  flex: 1;
}

/* DESKRIPSI */
.desc {
  min-height: 40px;
  margin-top: 10px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
}

/* TEXTAREA (DITINGKATKAN MINIMALIS) */
textarea {
  width: 90%;
  margin-top: 8px;
  font-size: 12px;
  height: 42px;
  resize: none;
  border-radius: 12px;
  border: none;
  padding: 8px;
  outline: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  background: #ffffff;
  transition: 0.2s;
}

textarea:focus {
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
}

/* HIGHLIGHT */
.holiday .left {
  background: #ffe4e6;
}

.holiday .date {
  color: #dc2626;
}

.has-note .left {
  background: #fff9c4;
}
</style>
</head>

<body>

<div class="navbar">
  <button onclick="prevMonth()">⬅</button>
  <div id="title"></div>
  <button onclick="nextMonth()">➡</button>

  <select id="yearSelect" onchange="changeYear(this.value)"></select>
</div>

<div class="container" id="container"></div>

<script>
const monthNames = [
  "Januari","Februari","Maret","April","Mei","Juni",
  "Juli","Agustus","September","Oktober","November","Desember"
];

const colors = [
  "#1e3a8a", "#a3d341", "#a3d341", "#4caf50",
  "#e879c6", "#8b5cf6", "#8b5cf6", "#f97316",
  "#06b6d4", "#fb923c", "#10b981", "#facc15"
];

const holidays = {
  "2026-0-1": "Tahun Baru Masehi",
  "2026-2-3": "Hari Suci Nyepi",
  "2026-4-1": "Hari Buruh",
  "2026-7-17": "Hari Kemerdekaan",
  "2026-11-25": "Hari Natal"
};

let currentMonth = 2;
let currentYear = 2026;

const yearSelect = document.getElementById("yearSelect");
for(let y=2020; y<=2035; y++){
  let opt = document.createElement("option");
  opt.value = y;
  opt.text = y;
  yearSelect.appendChild(opt);
}
yearSelect.value = currentYear;

function render() {
  document.getElementById("title").innerText =
    monthNames[currentMonth] + " " + currentYear;

  const container = document.getElementById("container");
  container.innerHTML = "";

  const totalDays = new Date(currentYear, currentMonth+1, 0).getDate();

  for(let d=1; d<=totalDays; d++) {

    let id = `${currentYear}-${currentMonth}-${d}`;

    let desc = holidays[id] || "";
    let rawNote = localStorage.getItem("note-"+id+"_raw") || "";

    let isHoliday = holidays[id] ? true : false;
    let hasNote = rawNote !== "";

    let wrapper = document.createElement("div");
    wrapper.className = "card-wrapper";

    if(isHoliday) wrapper.classList.add("holiday");
    if(hasNote) wrapper.classList.add("has-note");

    wrapper.innerHTML = `
      <div class="card">
        <div class="spiral">
          ${'<div class="ring"></div>'.repeat(9)}
        </div>

        <div class="header" style="background:${colors[currentMonth]}">
          ${monthNames[currentMonth]}
        </div>

        <div class="box">
          <div class="left">
            <div class="date">${d}</div>
          </div>

          <div class="right" id="note-${id}">
            <div class="small-month">${monthNames[currentMonth].toUpperCase()}</div>

            ${
              rawNote
              ? rawNote.split("\n").map(() => `
                <div class="bullet">
                  <div class="dot"></div>
                  <div class="line"></div>
                </div>
              `).join("")
              :
              `
              <div class="bullet"><div class="dot"></div><div class="line"></div></div>
              <div class="bullet"><div class="dot"></div><div class="line"></div></div>
              `
            }
          </div>
        </div>
      </div>

      <div class="desc">${desc}</div>

      <textarea placeholder="Isi catatan"
        oninput="updateNotes('${id}', this.value)">${rawNote}</textarea>
    `;

    container.appendChild(wrapper);
  }
}

function updateNotes(id, val) {
  localStorage.setItem("note-"+id+"_raw", val);
}

function prevMonth() {
  currentMonth--;
  if(currentMonth < 0){
    currentMonth = 11;
    currentYear--;
    yearSelect.value = currentYear;
  }
  render();
}

function nextMonth() {
  currentMonth++;
  if(currentMonth > 11){
    currentMonth = 0;
    currentYear++;
    yearSelect.value = currentYear;
  }
  render();
}

function changeYear(y) {
  currentYear = parseInt(y);
  render();
}

render();
</script>

</body>
</html>
