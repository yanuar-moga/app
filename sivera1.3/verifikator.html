<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Verifikator SIVERA</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background: #f0f2f5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header-panel { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e3a8a; padding-bottom: 15px; margin-bottom: 20px; }
    h2 { color: #1e3a8a; }
    .user-info { font-weight: 600; color: #4b5563; background: #e5e7eb; padding: 6px 15px; border-radius: 20px; font-size: 13px;}
    .btn-logout { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; margin-left: 10px;}
    .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-center }
    .login-box h3 { margin-bottom: 20px; color: #1e3a8a;}
    input[type="password"], input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }
    .btn-primary { background: #1e3a8a; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600;}
    .table-container { width: 100%; overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;}
    th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; }
    th { background: #f3f4f6; color: #1e3a8a; font-weight: 600; }
    .btn-verify { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600;}
    .btn-verify:hover { background: #059669;}
  </style>
</head>
<body>

<div id="loginSection" class="login-box">
  <h3>🔒 Login Verifikator SIVERA</h3>
  <input type="password" id="verifierPin" placeholder="Masukkan PIN Verifikator Anda" maxlength="6">
  <button class="btn-primary" onclick="prosesLogin()">Masuk Sistem</button>
</div>

<div id="mainSection" class="container" style="display: none;">
  <div class="header-panel">
    <h2>📋 Meja Kerja Verifikasi Berkas</h2>
    <div>
      <span class="user-info" id="displayUser">Verifikator</span>
      <button class="btn-logout" onclick="prosesLogout()">Keluar</button>
    </div>
  </div>

  <p style="color:#666; margin-bottom:15px;">Daftar antrean calon pendaftar yang membutuhkan validasi dokumen fisik:</p>
  
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>No. Antrean</th>
          <th>NISN</th>
          <th>Nama Calon Siswa</th>
          <th>JK</th>
          <th>Aksi Verifikasi</th>
        </tr>
      </thead>
      <tbody id="antreanTableBody">
        <tr>
          <td colspan="5" style="text-align:center; color:#999;">Memuat data antrean dari server...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwqDaUhPAbV6FzrqgF9MHugZ15_EnIcbaQKTcHirE0q4Wb4pICOXFLvNWG2cEvi94kX/exec";
  
  // Mapping PIN Akun Verifikator
  const PIN_MAP = {
    "1111": "Verifikator 1",
    "2222": "Verifikator 2",
    "3333": "Verifikator 3",
    "4444": "Verifikator 4",
    "5555": "Verifikator 5"
  };

  // Cek Status Login Saat Reload (Persistensi Kerja)
  window.addEventListener('DOMContentLoaded', () => {
    const isLoggedIn = localStorage.getItem('sivera_logged_in');
    const userRole = localStorage.getItem('sivera_user_role');
    
    if (isLoggedIn === 'true' && userRole && userRole.startsWith('Verifikator')) {
      tampilkanHalamanUtama(userRole);
    }
  });

  function prosesLogin() {
    const pinInput = document.getElementById('verifierPin').value;
    if (PIN_MAP[pinInput]) {
      const namaPetugas = PIN_MAP[pinInput];
      localStorage.setItem('sivera_logged_in', 'true');
      localStorage.setItem('sivera_user_role', namaPetugas);
      tampilkanHalamanUtama(namaPetugas);
    } else {
      Swal.fire('Akses Ditolak', 'PIN Verifikator yang Anda masukkan salah!', 'error');
    }
  }

  function tampilkanHalamanUtama(role) {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('mainSection').style.display = 'block';
    document.getElementById('displayUser').innerText = `👤 ${role}`;
    loadDataAntrean();
  }

  function prosesLogout() {
    localStorage.clear();
    location.reload();
  }

  function loadDataAntrean() {
    fetch(`${API_URL}?action=getUnverifiedData`)
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('antreanTableBody');
        tbody.innerHTML = "";
        if(data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Tidak ada antrean tersisa yang perlu diverifikasi.</td></tr>`;
          return;
        }
        data.forEach(row => {
          tbody.innerHTML += `
            <tr>
              <td style="font-weight:bold; color:#1e3a8a;">${String(row.noAntrean).padStart(3,'0')}</td>
              <td>${row.nisn}</td>
              <td style="text-transform:uppercase; font-weight:600;">${row.nama}</td>
              <td>${row.jk}</td>
              <td><button class="btn-verify" onclick="eksekusiVerifikasi('${row.nisn}')">Setujui & Verif</button></td>
            </tr>`;
        });
      }).catch(() => {
        document.getElementById('antreanTableBody').innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Gagal terhubung ke database cloud.</td></tr>`;
      });
  }

  function eksekusiVerifikasi(nisnTarget) {
    const petugas = localStorage.getItem('sivera_user_role');
    Swal.fire({
      title: 'Verifikasi Berkas?',
      text: "Pastikan berkas fisik siswa sesuai dengan data entri digital.",
      icon: 'question',
      showCancelButton: true,
      confirmButtonColor: '#10b981',
      cancelButtonColor: '#d33',
      confirmButtonText: 'Ya, Valid!'
    }).then((result) => {
      if (result.isConfirmed) {
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "verifikasiSiswa", nisn: nisnTarget, verifikator: petugas })
        })
        .then(res => res.json())
        .then(res => {
          if(res.success) {
            Swal.fire('Berhasil!', 'Siswa berhasil diverifikasi oleh ' + petugas, 'success');
            loadDataAntrean();
          } else {
            Swal.fire('Gagal!', res.error, 'error');
          }
        });
      }
    });
  }
</script>
</body>
</html>
