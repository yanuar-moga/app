<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikator SIVERA | SMPN 1 Moga</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .animate-float { animation: floatAnim 3s ease-in-out infinite; }
    @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-800 font-sans min-h-screen flex flex-col">

  <header class="bg-blue-900 border-b-4 border-amber-400 p-4 shadow-lg sticky top-0 z-40">
    <div class="container mx-auto max-w-4xl flex justify-between items-center px-1">
      <div class="flex items-center gap-3">
        <div class="bg-white p-1 rounded-full shadow-md"><img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" class="w-10 h-10 object-contain"></div>
        <div>
          <h1 class="text-white font-black text-sm uppercase tracking-wider">Verifikator SIVERA</h1>
          <p class="text-amber-400 text-[10px] font-bold uppercase">Panel Petugas SMPN 1 Moga</p>
        </div>
      </div>
      <button onclick="prosesLogout()" class="bg-red-600 hover:bg-red-700 text-white text-[10px] font-black px-4 py-2 rounded-xl transition uppercase shadow-md"><i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar</button>
    </div>
  </header>

  <main class="container mx-auto max-w-4xl p-4 flex-grow">
    <div id="loginWrapper" class="bg-white p-8 rounded-3xl shadow-xl border border-zinc-200 max-w-sm mx-auto mt-20 animate-fade-in text-center">
      <div class="w-16 h-16 bg-blue-900 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg"><i class="fa-solid fa-lock text-amber-400 text-2xl"></i></div>
      <h2 class="text-blue-900 font-black text-lg uppercase">Login Petugas</h2>
      <p class="text-zinc-400 text-[11px] mb-6 font-bold uppercase">Masukkan PIN verifikasi Anda</p>
      <input type="password" id="verifierPin" placeholder="••••••" class="w-full bg-zinc-100 border-2 border-zinc-200 p-4 rounded-xl text-center font-mono font-black text-xl tracking-[0.5em] mb-4 focus:outline-none focus:border-blue-900">
      <button onclick="prosesLogin()" class="w-full bg-blue-900 hover:bg-blue-800 text-amber-400 font-black py-4 rounded-xl shadow-lg transition uppercase tracking-widest text-xs">Akses Sistem</button>
    </div>

    <div id="mainSection" class="hidden space-y-4 animate-fade-in">
      <div class="bg-white p-6 rounded-2xl shadow-md border border-zinc-200">
        <div class="flex items-center justify-between mb-6">
          <h3 class="font-black text-blue-900 uppercase tracking-widest text-xs border-l-4 border-amber-400 pl-3">Daftar Antrean Menunggu</h3>
          <span id="displayUser" class="text-[10px] font-bold bg-zinc-100 text-zinc-600 px-3 py-1 rounded-full uppercase"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead><tr class="text-zinc-400 border-b border-zinc-200"><th class="pb-3">NO</th><th class="pb-3">NISN</th><th class="pb-3">NAMA SISWA</th><th class="pb-3">AKSI</th></tr></thead>
            <tbody id="antreanTableBody" class="divide-y divide-zinc-100"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer onclick="bukaModalDeveloper()" class="text-center p-3.5 bg-zinc-200 hover:bg-zinc-300 text-zinc-600 text-[10px] font-black tracking-widest uppercase border-t border-zinc-300 cursor-pointer transition-colors duration-200">
    Aplikasi SIVERA V 1.3 <span class="text-blue-900 block mt-0.5 text-[8px] font-bold normal-case tracking-normal animate-pulse">(Klik untuk info developer)</span>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwqDaUhPAbV6FzrqgF9MHugZ15_EnIcbaQKTcHirE0q4Wb4pICOXFLvNWG2cEvi94kX/exec";

    function prosesLogin() {
      const pin = document.getElementById('verifierPin').value;
      Swal.fire({ title: 'Memvalidasi...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "loginValidation", pin, expectedRole: "verifier" }) })
      .then(res => res.json()).then(res => {
        Swal.close();
        if (res.success) {
          document.getElementById('loginWrapper').classList.add('hidden');
          document.getElementById('mainSection').classList.remove('hidden');
          document.getElementById('displayUser').innerText = `👤 ${res.username}`;
          loadDataAntrean();
        } else { Swal.fire('Gagal', res.error, 'error'); }
      });
    }

    function loadDataAntrean() {
      fetch(`${API_URL}?action=getUnverifiedData`)
      .then(res => res.json()).then(data => {
        const tbody = document.getElementById('antreanTableBody');
        tbody.innerHTML = "";
        data.forEach(row => {
          tbody.innerHTML += `
            <tr class="hover:bg-zinc-50 transition">
              <td class="py-4 font-black text-blue-900">${String(row.noAntrean).padStart(3,'0')}</td>
              <td class="py-4 font-mono text-zinc-600">${row.nisn}</td>
              <td class="py-4 font-bold text-zinc-800 uppercase">${row.nama}</td>
              <td class="py-4 flex gap-2">
                <button onclick="eksekusi('${row.nisn}', 'Terverifikasi')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-[9px] font-black uppercase shadow hover:bg-emerald-700">Valid</button>
                <button onclick="eksekusi('${row.nisn}', 'Tunda')" class="bg-amber-500 text-white px-3 py-1.5 rounded-lg text-[9px] font-black uppercase shadow hover:bg-amber-600">Tunda</button>
              </td>
            </tr>`;
        });
      });
    }

    function eksekusi(nisn, status) {
      Swal.fire({ title: 'Konfirmasi', input: status === 'Tunda' ? 'text' : null, inputPlaceholder: 'Alasan penundaan...', showCancelButton: true, confirmButtonColor: status === 'Tunda' ? '#f59e0b' : '#059669', confirmButtonText: 'Kirim' })
      .then(res => {
        if(res.isConfirmed) {
          fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "verifikasiSiswa", nisn, status, catatan: res.value }) })
          .then(() => { Swal.fire('Berhasil', 'Data diperbarui', 'success'); loadDataAntrean(); });
        }
      });
    }

    function prosesLogout() { localStorage.clear(); location.reload(); }
    function bukaModalDeveloper() { Swal.fire({ title: 'SIVERA V 1.3', html: '<p>Developer: Tim IT SMPN 1 Moga</p><p>Build: 12 Juni 2026</p>', confirmButtonColor: '#1e3a8a' }); }
  </script>
</body>
</html>
