<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikator SIVERA | SMPN 1 Moga</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .animate-float { animation: floatAnim 3s ease-in-out infinite; }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-800 font-sans min-h-screen flex flex-col justify-between select-none">

  <header class="bg-blue-900 border-b-4 border-amber-400 p-4 shadow-lg sticky top-0 z-40">
    <div class="container mx-auto max-w-2xl flex justify-between items-center px-1">
      <div class="flex items-center gap-3">
        <div class="bg-white p-1 rounded-full shadow-md">
          <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" alt="Logo" class="w-10 h-10 object-contain">
        </div>
        <div>
          <h1 class="text-white font-black text-sm uppercase tracking-wider">Verifikator SIVERA</h1>
          <p class="text-amber-400 text-[10px] font-bold uppercase">Panel Petugas SMPN 1 Moga</p>
        </div>
      </div>
      <button onclick="prosesLogout()" class="bg-red-600 hover:bg-red-700 text-white text-[10px] font-black px-4 py-2 rounded-xl transition uppercase shadow-md cursor-pointer flex items-center gap-1.5">
        <i class="fa-solid fa-right-from-bracket"></i> Keluar
      </button>
    </div>
  </header>

  <div id="developerModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-2xl max-w-xs w-full p-6 text-center shadow-2xl border-t-8 border-blue-900 transform scale-95 transition-all duration-300" id="devModalContent">
      <div class="relative w-20 h-20 mx-auto mb-4 group">
        <div class="absolute inset-0 bg-blue-900 rounded-full blur-md opacity-40 animate-ping"></div>
        <img src="https://yanuar-moga.github.io/assets/logo.jpg" alt="Logo Dev" class="relative w-20 h-20 rounded-full object-cover shadow-md border-2 border-amber-400 transform transition-all duration-700 group-hover:rotate-[360deg] group-hover:scale-110 ease-out animate-float">
      </div>
      <h3 class="text-sm font-black text-blue-900 uppercase tracking-wide">Sistem Verifikasi Antrean</h3>
      <p class="text-[11px] font-bold text-zinc-500 mt-0.5 tracking-wider uppercase">SIVERA V 1.3</p>
      <div class="my-4 bg-zinc-50 p-2.5 rounded-xl border border-zinc-200">
        <span class="block text-[10px] text-zinc-400 font-bold uppercase">Build Version</span>
        <span class="text-xs font-mono font-bold text-zinc-700">14 Juni 2026</span>
      </div>
      <button onclick="tutupModalDeveloper()" class="w-full bg-zinc-700 hover:bg-zinc-800 text-white font-black text-xs py-2.5 rounded-xl cursor-pointer transition uppercase tracking-wider shadow-md">Tutup Informasi</button>
    </div>
  </div>

  <main class="container mx-auto max-w-2xl p-4 flex-grow flex items-center justify-center">
    
    <div id="loginWrapper" class="bg-white p-6 rounded-2xl shadow-xl border border-zinc-200 max-w-sm w-full mx-auto animate-fade-in text-center space-y-4">
      <div class="w-14 h-14 bg-blue-900 rounded-full flex items-center justify-center mx-auto shadow-lg">
        <i class="fa-solid fa-lock text-amber-400 text-xl"></i>
      </div>
      <div>
        <h2 class="text-blue-900 font-black text-base uppercase tracking-wide">Login Petugas</h2>
        <p class="text-zinc-400 text-[10px] font-bold uppercase">Masukkan PIN verifikasi Anda</p>
      </div>
      <input type="password" id="verifierPin" placeholder="••••••" maxlength="6" class="w-full bg-zinc-50 border-2 border-zinc-200 p-3 rounded-xl text-center font-mono font-black text-xl tracking-[0.4em] focus:outline-none focus:border-blue-900 focus:bg-white transition-all">
      <button onclick="prosesLogin()" class="w-full bg-blue-900 hover:bg-blue-800 text-amber-400 font-black py-3.5 rounded-xl shadow-md transition uppercase tracking-widest text-xs cursor-pointer flex items-center justify-center gap-2">
        <i class="fa-solid fa-shield-hasp"></i> Akses Sistem
      </button>
    </div>

    <div id="mainSection" class="hidden w-full space-y-4 animate-fade-in self-start mt-2">
      <div class="bg-white p-5 rounded-2xl shadow-lg border border-zinc-200">
        
        <div class="mb-4">
          <label class="block text-[10px] font-black text-zinc-500 uppercase mb-1">Pilih Verifikator & Loket:</label>
          <select id="filterAntrean" onchange="loadDataAntrean()" class="w-full bg-zinc-100 border border-zinc-200 text-xs font-bold p-2.5 rounded-lg focus:outline-none focus:border-blue-900 uppercase">
            <option value="all">Semua (Default)</option>
            <option value="1">Verifikator 1 - Loket 1 (No 1-25)</option>
            <option value="2">Verifikator 2 - Loket 1 (No 26-50)</option>
            <option value="3">Verifikator 3 - Loket 2 (No 51-75)</option>
            <option value="4">Verifikator 4 - Loket 2 (No 76-100)</option>
            <option value="5">Verifikator 5 - Loket 3 (No 101-125)</option>
            <option value="6">Verifikator 6 - Loket 3 (No 126-150)</option>
          </select>
        </div>

        <div class="flex items-center justify-between mb-4 pb-3 border-b border-zinc-100">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
            <h3 class="font-black text-blue-900 uppercase tracking-wider text-xs">Daftar Antrean Menunggu</h3>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="loadDataAntrean(true)" title="Update Data" class="bg-blue-100 hover:bg-blue-200 text-blue-900 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase transition cursor-pointer flex items-center gap-2">
              <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i> Perbarui
            </button>
            <span id="displayUser" class="text-[9px] font-black bg-zinc-100 text-zinc-600 px-3 py-1.5 rounded-lg uppercase tracking-wider"></span>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left border-collapse">
            <thead>
              <tr class="text-zinc-400 border-b border-zinc-200 text-[10px] uppercase font-black tracking-wider">
                <th class="pb-3 text-center w-16">No</th>
                <th class="pb-3 w-28">NISN</th>
                <th class="pb-3">Nama Siswa</th>
                <th class="pb-3 text-center w-28">Aksi</th>
              </tr>
            </thead>
            <tbody id="antreanTableBody" class="divide-y divide-zinc-100">
            </tbody>
          </table>
          
          <div id="emptyState" class="hidden text-center py-8 space-y-2">
            <i class="fa-solid fa-circle-check text-emerald-500 text-3xl animate-bounce"></i>
            <p class="text-xs font-bold text-zinc-400 uppercase tracking-wide">Semua antrean telah selesai!</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer onclick="bukaModalDeveloper()" class="text-center p-3.5 bg-zinc-200 hover:bg-zinc-300 text-zinc-500 text-[10px] font-black tracking-widest uppercase border-t border-zinc-300 cursor-pointer transition-colors duration-200 shadow-inner">
    Aplikasi SIVERA V 1.3 - © 2026 Dev by MB
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxqvm_weKRsAkoospWstaQEoREEF_QybeZ62hohzGDdr6SlDpEc1zAvMBCnRM-gqad5/exec";

    window.onload = function() {
      const savedUser = localStorage.getItem('username');
      if (savedUser) {
        masukDashboard(savedUser);
      }
    };

    function prosesLogin() {
      const pin = document.getElementById('verifierPin').value;
      if(!pin) { Swal.fire('Error', 'PIN wajib diisi!', 'warning'); return; }

      Swal.fire({ title: 'Memvalidasi Petugas...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      fetch(API_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "loginValidation", pin, expectedRole: "verifier" }) 
      })
      .then(res => res.json())
      .then(res => {
        Swal.close();
        if (res.success) {
          localStorage.setItem('username', res.username);
          masukDashboard(res.username);
        } else { 
          Swal.fire('Gagal', res.error || 'Akses ditolak.', 'error'); 
        }
      }).catch(() => {
        Swal.fire('Error', 'Gagal terhubung ke server.', 'error');
      });
    }

    function masukDashboard(username) {
      document.getElementById('loginWrapper').classList.add('hidden');
      document.getElementById('mainSection').classList.remove('hidden');
      document.getElementById('displayUser').innerHTML = `<i class="fa-solid fa-user-shield"></i> ${username}`;
      loadDataAntrean(false);
    }

    function loadDataAntrean(isManualClick = false) {
      const refreshIcon = document.getElementById('refreshIcon');
      const filterVal = document.getElementById('filterAntrean').value;
      
      if(refreshIcon) refreshIcon.classList.add('fa-spin');
      
      fetch(`${API_URL}?action=getUnverifiedData`)
      .then(res => res.json())
      .then(data => {
        if(refreshIcon) refreshIcon.classList.remove('fa-spin');
        const tbody = document.getElementById('antreanTableBody');
        const emptyState = document.getElementById('emptyState');
        tbody.innerHTML = "";
        
        // Logika Filter
        let filteredData = data;
        if (filterVal !== "all") {
          const min = (parseInt(filterVal) - 1) * 25 + 1;
          const max = parseInt(filterVal) * 25;
          filteredData = data.filter(row => row.noAntrean >= min && row.noAntrean <= max);
        }
        
        if(!filteredData || filteredData.length === 0) {
          emptyState.classList.remove('hidden');
          return;
        }
        
        emptyState.classList.add('hidden');
        filteredData.forEach(row => {
          tbody.innerHTML += `
            <tr class="hover:bg-zinc-50 transition">
              <td class="py-3 text-center font-black text-blue-950 text-xs">${String(row.noAntrean).padStart(3,'0')}</td>
              <td class="py-3 font-mono font-bold text-zinc-500 tracking-wider">${row.nisn}</td>
              <td class="py-3 font-black text-zinc-800 uppercase tracking-wide">${row.nama}</td>
              <td class="py-3 flex gap-1.5 justify-center">
                <button onclick="eksekusi('${row.nisn}', 'Terverifikasi')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-lg text-[9px] font-black uppercase shadow-sm transition cursor-pointer flex items-center gap-1">
                  <i class="fa-solid fa-circle-check"></i> Valid
                </button>
                <button onclick="eksekusi('${row.nisn}', 'Tunda')" class="bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1.5 rounded-lg text-[9px] font-black uppercase shadow-sm transition cursor-pointer flex items-center gap-1">
                  <i class="fa-solid fa-hourglass-half"></i> Tunda
                </button>
              </td>
            </tr>`;
        });
      }).catch(() => {
        if(refreshIcon) refreshIcon.classList.remove('fa-spin');
        Swal.fire('Error', 'Gagal memuat data.', 'error');
      });
    }

    function eksekusi(nisn, status) {
        // Implementasi logika eksekusi Anda di sini
        Swal.fire('Info', `Proses ${status} untuk NISN ${nisn}`, 'info');
    }

    function prosesLogout() { localStorage.clear(); location.reload(); }
    function bukaModalDeveloper() { document.getElementById('developerModal').classList.remove('hidden'); setTimeout(() => { document.getElementById('developerModal').classList.remove('opacity-0'); document.getElementById('devModalContent').classList.remove('scale-95'); }, 10); }
    function tutupModalDeveloper() { document.getElementById('developerModal').classList.add('opacity-0'); document.getElementById('devModalContent').classList.add('scale-95'); setTimeout(() => { document.getElementById('developerModal').classList.add('hidden'); }, 300); }
  </script>
</body>
</html>
