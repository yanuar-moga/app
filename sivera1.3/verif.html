<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikator SIVERA | SMPN 1 Moga</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .animate-float { animation: floatAnim 3s ease-in-out infinite; }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-800 font-sans min-h-screen flex flex-col justify-between select-none">

  <header class="bg-blue-900 border-b-4 border-amber-400 p-4 shadow-lg sticky top-0 z-40">
    <div class="container mx-auto max-w-2xl flex justify-between items-center px-1">
      <div class="flex items-center gap-3">
        <div class="bg-white p-1 rounded-full shadow-md">
          <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" alt="Logo" class="w-10 h-10 object-contain">
        </div>
        <div>
          <h1 class="text-white font-black text-sm uppercase tracking-wider">Verifikator SIVERA</h1>
          <p class="text-amber-400 text-[10px] font-bold uppercase">Panel Petugas SMPN 1 Moga</p>
        </div>
      </div>
      <button onclick="prosesLogout()" class="bg-red-600 hover:bg-red-700 text-white text-[10px] font-black px-4 py-2 rounded-xl transition uppercase shadow-md cursor-pointer flex items-center gap-1.5">
        <i class="fa-solid fa-right-from-bracket"></i> Keluar
      </button>
    </div>
  </header>

  <main class="container mx-auto max-w-2xl p-4 flex-grow flex items-center justify-center">
    
    <div id="loginWrapper" class="bg-white p-6 rounded-2xl shadow-xl border border-zinc-200 max-w-sm w-full mx-auto animate-fade-in text-center space-y-4">
      <div class="w-14 h-14 bg-blue-900 rounded-full flex items-center justify-center mx-auto shadow-lg">
        <i class="fa-solid fa-lock text-amber-400 text-xl"></i>
      </div>
      <div>
        <h2 class="text-blue-900 font-black text-base uppercase tracking-wide">Login Petugas</h2>
        <p class="text-zinc-400 text-[10px] font-bold uppercase">Masukkan PIN verifikasi Anda</p>
      </div>
      <input type="password" id="verifierPin" placeholder="••••••" maxlength="6" class="w-full bg-zinc-50 border-2 border-zinc-200 p-3 rounded-xl text-center font-mono font-black text-xl tracking-[0.4em] focus:outline-none focus:border-blue-900 focus:bg-white transition-all">
      <button onclick="prosesLogin()" class="w-full bg-blue-900 hover:bg-blue-800 text-amber-400 font-black py-3.5 rounded-xl shadow-md transition uppercase tracking-widest text-xs cursor-pointer flex items-center justify-center gap-2">
        <i class="fa-solid fa-shield-hasp"></i> Akses Sistem
      </button>
    </div>

    <div id="mainSection" class="hidden w-full space-y-4 animate-fade-in self-start mt-2">
      <div class="bg-white p-5 rounded-2xl shadow-lg border border-zinc-200">
        
        <div class="bg-zinc-50 p-4 rounded-xl border border-zinc-200 mb-4 space-y-3">
          <div>
            <label class="block text-[9px] font-black text-zinc-500 uppercase mb-1">Pilih Cepat Verifikator:</label>
            <select id="presetFilter" onchange="terapkanPreset()" class="w-full bg-white border border-zinc-200 text-xs font-bold p-2.5 rounded-lg focus:outline-none focus:border-blue-900 uppercase">
              <option value="custom">-- Atur Manual --</option>
              <option value="1">Verifikator 1 (1-25)</option>
              <option value="2">Verifikator 2 (26-50)</option>
              <option value="3">Verifikator 3 (51-75)</option>
              <option value="4">Verifikator 4 (76-100)</option>
              <option value="5">Verifikator 5 (101-125)</option>
              <option value="6">Verifikator 6 (126-150)</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[9px] font-black text-zinc-500 uppercase mb-1">Mulai No:</label>
              <input type="number" id="filterMin" value="1" class="w-full bg-white border border-zinc-200 text-xs font-bold p-2.5 rounded-lg focus:outline-none focus:border-blue-900">
            </div>
            <div>
              <label class="block text-[9px] font-black text-zinc-500 uppercase mb-1">Sampai No:</label>
              <input type="number" id="filterMax" value="25" class="w-full bg-white border border-zinc-200 text-xs font-bold p-2.5 rounded-lg focus:outline-none focus:border-blue-900">
            </div>
          </div>
          <button onclick="loadDataAntrean()" class="w-full bg-blue-900 hover:bg-blue-800 text-amber-400 font-black py-2.5 rounded-lg text-xs uppercase shadow-md transition">
            <i class="fa-solid fa-filter"></i> Tampilkan Data
          </button>
        </div>

        <div class="flex items-center justify-between mb-4 pb-3 border-b border-zinc-100">
          <h3 class="font-black text-blue-900 uppercase tracking-wider text-xs flex items-center gap-2">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Daftar Antrean
          </h3>
          <button onclick="loadDataAntrean(true)" class="bg-blue-100 hover:bg-blue-200 text-blue-900 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase transition cursor-pointer">
            <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i> Perbarui
          </button>
        </div>

        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr class="text-zinc-400 border-b border-zinc-200 text-[10px] uppercase font-black">
              <th class="pb-3 text-center">No</th>
              <th class="pb-3">NISN / Nama</th>
              <th class="pb-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="antreanTableBody" class="divide-y divide-zinc-100"></tbody>
        </table>
        <div id="emptyState" class="hidden text-center py-8 text-xs font-bold text-zinc-400 uppercase">Tidak ada data.</div>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxqvm_weKRsAkoospWstaQEoREEF_QybeZ62hohzGDdr6SlDpEc1zAvMBCnRM-gqad5/exec";

    function terapkanPreset() {
      const preset = document.getElementById('presetFilter').value;
      if (preset !== "custom") {
        const val = parseInt(preset);
        document.getElementById('filterMin').value = (val - 1) * 25 + 1;
        document.getElementById('filterMax').value = val * 25;
      }
    }

    function loadDataAntrean() {
      const min = parseInt(document.getElementById('filterMin').value) || 1;
      const max = parseInt(document.getElementById('filterMax').value) || 1000;
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('fa-spin');
      
      fetch(`${API_URL}?action=getUnverifiedData`)
      .then(res => res.json())
      .then(data => {
        refreshIcon.classList.remove('fa-spin');
        const tbody = document.getElementById('antreanTableBody');
        tbody.innerHTML = "";
        const filtered = data.filter(row => row.noAntrean >= min && row.noAntrean <= max);
        
        filtered.forEach(row => {
          tbody.innerHTML += `
            <tr class="hover:bg-zinc-50">
              <td class="py-3 text-center font-black">${String(row.noAntrean).padStart(3,'0')}</td>
              <td class="py-3">
                <div class="font-mono font-bold text-zinc-500">${row.nisn}</div>
                <div class="font-bold text-zinc-800">${row.nama}</div>
              </td>
              <td class="py-3 text-center">
                <button onclick="eksekusi('${row.nisn}', 'Terverifikasi')" class="bg-emerald-600 text-white px-2 py-1 rounded text-[9px] font-black uppercase">Valid</button>
              </td>
            </tr>`;
        });
      });
    }

    function prosesLogin() { /* Fungsi Login Tetap Sama */ }
    function prosesLogout() { localStorage.clear(); location.reload(); }
    function eksekusi(nisn, status) { Swal.fire('Info', `Memproses ${nisn}`, 'info'); }
  </script>
</body>
</html>
