<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikator SIVERA | SMPN 1 Moga</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-100 text-zinc-800 font-sans min-h-screen">

  <main id="loginWrapper" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl border border-zinc-200 max-w-sm w-full text-center space-y-4">
      <h2 class="text-blue-900 font-black text-base uppercase">Login Petugas</h2>
      <input type="password" id="verifierPin" placeholder="PIN Anda" maxlength="6" class="w-full bg-zinc-50 border-2 border-zinc-200 p-3 rounded-xl text-center font-black text-xl">
      <button onclick="prosesLogin()" class="w-full bg-blue-900 text-amber-400 font-black py-3 rounded-xl uppercase">Akses Sistem</button>
    </div>
  </main>

  <div id="mainSection" class="hidden container mx-auto max-w-2xl p-4">
    <div class="bg-white p-4 rounded-xl border border-zinc-200 mb-4 space-y-3">
      <select id="presetFilter" onchange="terapkanPreset()" class="w-full bg-zinc-100 p-2 rounded-lg text-xs font-bold uppercase">
        <option value="custom">-- Atur Manual --</option>
        <option value="1">Verifikator 1 (1-25)</option>
        <option value="2">Verifikator 2 (26-50)</option>
      </select>
      <div class="grid grid-cols-2 gap-2">
        <input type="number" id="filterMin" value="1" class="bg-zinc-100 p-2 rounded text-xs">
        <input type="number" id="filterMax" value="25" class="bg-zinc-100 p-2 rounded text-xs">
      </div>
      <button onclick="loadDataAntrean()" class="w-full bg-blue-900 text-white py-2 rounded text-xs font-black uppercase">Tampilkan</button>
    </div>
    
    <button onclick="prosesLogout()" class="text-[10px] text-red-600 font-bold uppercase underline">Keluar dari Sistem</button>
    <div id="antreanTableBody"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxqvm_weKRsAkoospWstaQEoREEF_QybeZ62hohzGDdr6SlDpEc1zAvMBCnRM-gqad5/exec";

    // Cek Login Saat Halaman Dimuat
    window.onload = function() {
      if (localStorage.getItem('isLoggedIn') === 'true') {
        masukDashboard();
      }
    };

    function prosesLogin() {
      const pin = document.getElementById('verifierPin').value;
      Swal.fire({ title: 'Memvalidasi...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      fetch(API_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "loginValidation", pin, expectedRole: "verifier" }) 
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          localStorage.setItem('isLoggedIn', 'true');
          Swal.close();
          masukDashboard();
        } else {
          Swal.fire('Gagal', 'PIN Salah', 'error');
        }
      });
    }

    function masukDashboard() {
      document.getElementById('loginWrapper').classList.add('hidden');
      document.getElementById('mainSection').classList.remove('hidden');
    }

    function prosesLogout() {
      localStorage.removeItem('isLoggedIn');
      location.reload();
    }

    function terapkanPreset() {
      const preset = document.getElementById('presetFilter').value;
      if (preset !== "custom") {
        const val = parseInt(preset);
        document.getElementById('filterMin').value = (val - 1) * 25 + 1;
        document.getElementById('filterMax').value = val * 25;
      }
    }

    function loadDataAntrean() { /* Sama seperti sebelumnya */ }
  </script>
</body>
</html>
