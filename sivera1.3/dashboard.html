<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Statistik SIVERA</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; margin: 0; }
    header { background: #1e3a8a; color: white; padding: 1.5rem; display: flex; align-items: center; gap: 15px; border-bottom: 4px solid #d4af37; }
    header img { width: 60px; height: 60px; background: white; padding: 5px; border-radius: 50%; }
    .school-info h1 { font-size: 1.2rem; font-weight: 900; margin: 0; }
    .school-info a { color: #fbbf24; font-size: 0.7rem; font-weight: 700; text-decoration: none; }
    footer { background: #334155; color: #cbd5e1; text-align: center; padding: 15px; font-size: 0.7rem; font-weight: 600; margin-top: auto; cursor: pointer; }
    .content-wrapper { max-width: 1100px; margin: 20px auto; width: 95%; }
    
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-left: 5px solid #1e3a8a; text-align: center; }
    .stat-card h4 { margin: 0; font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
    .stat-card p { margin: 10px 0 0 0; font-size: 1.5rem; font-weight: 900; color: #1e3a8a; }

    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    .panel { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
    .panel h3 { color: #1e3a8a; font-size: 1rem; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: #64748b; font-size: 0.8rem; padding: 10px; border-bottom: 1px solid #e2e8f0; }
    td { padding: 12px 10px; font-size: 0.9rem; font-weight: 600; border-bottom: 1px solid #f1f5f9; }
    .btn-logout { background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .hidden { display: none; }
    
    /* Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    
    @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .animate-float { animation: floatAnim 3s ease-in-out infinite; }
  </style>
</head>
<body>

<header>
  <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" alt="Logo">
  <div class="school-info">
    <h1>SMP NEGERI 1 MOGA</h1>
    <a href="https://smpn1moga.sch.id" target="_blank">smpn1moga.sch.id</a>
  </div>
</header>

<div class="content-wrapper" id="mainSection" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2>Dashboard Real-time</h2>
    <button class="btn-logout" onclick="prosesLogout()">KELUAR</button>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><h4>Total Antrean</h4><p id="totalAntrean">0</p></div>
    <div class="stat-card"><h4>Sudah Verif</h4><p id="totalVerif" style="color:green;">0</p></div>
    <div class="stat-card"><h4>Belum Verif</h4><p id="totalBelum" style="color:#d97706;">0</p></div>
    <div class="stat-card"><h4>Tunda</h4><p id="totalTunda" style="color:#dc2626;">0</p></div>
  </div>

  <div class="main-grid">
    <div class="panel">
      <h3>Data Pendaftar Terbaru</h3>
      <table>
        <thead><tr><th>Nama</th><th>NISN</th><th>Status</th></tr></thead>
        <tbody id="tabelData"></tbody>
      </table>
    </div>
    <div class="panel">
      <h3>Statistik Gender</h3>
      <div style="height: 300px;"><canvas id="genderChart"></canvas></div>
    </div>
  </div>
</div>

<div id="loginWrapper" class="content-wrapper" style="text-align:center; padding-top:50px;">
    <div style="background:white; max-width:400px; margin:auto; padding:30px; border-radius:20px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">
        <h2 style="color:#1e3a8a;">LOGIN DASHBOARD</h2>
        <input type="password" id="dashPin" placeholder="Masukkan PIN" style="width:100%; padding:15px; margin:20px 0; border:2px solid #e2e8f0; border-radius:10px; text-align:center;">
        <button onclick="prosesLogin()" style="background:#1e3a8a; color:white; border:none; padding:15px; width:100%; border-radius:10px; font-weight:700; cursor:pointer;">MASUK</button>
    </div>
</div>

<footer onclick="bukaModalDeveloper()">Aplikasi SIVERA V 1.3</footer>

<div id="developerModal" class="hidden modal-overlay opacity-0 transition-opacity duration-300">
  <div class="bg-white rounded-3xl p-8 shadow-2xl text-center transform scale-95 transition-all duration-300" style="max-width:350px; width:90%; border-top: 10px solid #1e3a8a;" id="devModalContent">
      <img src="https://yanuar-moga.github.io/assets/logo.jpg" alt="Logo MB" style="width:100px; height:100px; margin: 0 auto 20px auto; border-radius: 50%; border: 3px solid #e2e8f0;" class="animate-float">
      
      <h3 style="color:#1e3a8a; font-weight:900; font-size:1.1rem; margin-bottom:5px;">SISTEM VERIFIKASI ANTREAN</h3>
      <p style="color:#64748b; font-weight:bold; font-size:0.85rem; margin-bottom:20px;">SIVERA V 1.3</p>
      
      <div style="background:#f8fafc; padding:15px; border-radius:15px; border:1px solid #e2e8f0; margin-bottom:20px;">
        <p style="color:#94a3b8; font-weight:bold; font-size:0.7rem; margin:0;">BUILD VERSION</p>
        <p style="color:#334155; font-weight:900; font-size:0.9rem; margin:5px 0 0 0;">12 Juni 2026</p>
      </div>
      
      <button onclick="tutupModalDeveloper()" style="width:100%; background:#334155; color:white; border:none; padding:15px; border-radius:12px; cursor:pointer; font-weight:800; font-size:0.8rem; letter-spacing:1px;">TUTUP INFORMASI</button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwqDaUhPAbV6FzrqgF9MHugZ15_EnIcbaQKTcHirE0q4Wb4pICOXFLvNWG2cEvi94kX/exec";
  let chartG;

  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('sivera_logged_in') === 'true') tampilkanDashboard();
  });

  function bukaModalDeveloper() {
    const m = document.getElementById('developerModal');
    const c = document.getElementById('devModalContent');
    m.classList.remove('hidden');
    setTimeout(() => {
      m.classList.remove('opacity-0');
      c.classList.remove('scale-95');
    }, 10);
  }

  function tutupModalDeveloper() {
    const m = document.getElementById('developerModal');
    const c = document.getElementById('devModalContent');
    m.classList.add('opacity-0');
    c.classList.add('scale-95');
    setTimeout(() => {
      m.classList.add('hidden');
    }, 300);
  }

  function prosesLogin() {
    const pin = document.getElementById('dashPin').value;
    Swal.showLoading();
    fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "loginValidation", pin: pin, expectedRole: "dashboard" }) })
    .then(res => res.json())
    .then(res => {
      Swal.close();
      if(res.success) {
        localStorage.setItem('sivera_logged_in', 'true');
        tampilkanDashboard();
      } else {
        Swal.fire('Error', res.error, 'error');
      }
    });
  }

  function prosesLogout() {
    localStorage.removeItem('sivera_logged_in');
    location.reload();
  }

  function tampilkanDashboard() {
    document.getElementById('loginWrapper').style.display = 'none';
    document.getElementById('mainSection').style.display = 'block';
    chartG = new Chart(document.getElementById('genderChart'), {
      type: 'doughnut',
      data: { labels: ['Laki-laki', 'Perempuan'], datasets: [{ data: [0, 0], backgroundColor: ['#3b82f6', '#ec4899'] }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
    muatData();
    setInterval(muatData, 30000);
  }

  function muatData() {
    fetch(`${API_URL}?action=getDashboardStats`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('totalAntrean').innerText = data.totalAntrean || 0;
        document.getElementById('totalVerif').innerText = data.totalVerif || 0;
        document.getElementById('totalBelum').innerText = data.totalBelum || 0;
        document.getElementById('totalTunda').innerText = data.totalTunda || 0;
        
        const tbody = document.getElementById('tabelData');
        tbody.innerHTML = (data.terbaru || []).map(row => 
          `<tr><td>${row.nama}</td><td>${row.nisn}</td><td>${row.status}</td></tr>`
        ).join('');
        
        chartG.data.datasets[0].data = [data.totalLaki, data.totalPerempuan];
        chartG.update();
      });
  }
</script>
</body>
</html>
