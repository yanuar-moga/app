<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Pengendali Utama SIVERA</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn { 
        from { opacity: 0; transform: translateY(12px); } 
        to { opacity: 1; transform: translateY(0); } 
    }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-800 font-sans min-h-screen flex flex-col justify-between select-none">

  <div id="loginWrapper" class="login-wrapper max-w-sm w-11/12 margin auto bg-white rounded-2xl shadow-2xl overflow-hidden border border-zinc-200 m-auto animate-fade-in">
    <div class="bg-blue-900 border-b-4 border-amber-400 p-6 text-center shadow-md">
      <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" alt="Logo" class="w-16 h-16 mx-auto object-contain bg-white p-1 rounded-full shadow-md mb-3">
      <h1 class="text-base font-black text-white tracking-wide uppercase">SMP Negeri 1 Moga</h1>
      <p class="text-[11px] text-amber-400 font-black tracking-wider uppercase mt-0.5">PANEL UTAMA ADMIN SIVERA</p>
    </div>
    <div class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-bold text-zinc-500 mb-1.5 uppercase tracking-wider text-center">Masukkan PIN Autentikasi</label>
        <input type="password" id="adminPin" placeholder="••••••" maxlength="6" class="w-full bg-zinc-50 border-2 border-zinc-200 p-3 text-xl rounded-xl focus:outline-none focus:border-blue-900 focus:bg-white text-center font-mono font-bold tracking-widest transition-all">
      </div>
      <button onclick="prosesLogin()" class="w-full bg-blue-900 hover:bg-blue-800 text-amber-400 p-3.5 rounded-xl font-black text-xs uppercase tracking-widest cursor-pointer transition shadow-md flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi
      </button>
    </div>
  </div>

  <div id="mainSection" class="container mx-auto p-4 flex-grow max-w-xl w-full hidden animate-fade-in">
    
    <div class="bg-blue-900 border-b-4 border-amber-400 p-4 rounded-xl shadow-md flex items-center justify-between mb-5">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-sliders text-amber-400 text-xl"></i>
        <div>
          <h2 class="text-sm font-black text-white tracking-wide uppercase">SIVERA CONTROL PANEL</h2>
          <p class="text-[9px] text-zinc-300 font-bold">Manajemen Pusat Data Antrean & Ticker</p>
        </div>
      </div>
      <button onclick="prosesLogout()" class="bg-red-600 hover:bg-red-700 text-white font-black text-[10px] px-3 py-2 rounded-lg cursor-pointer transition uppercase tracking-wider shadow flex items-center gap-1.5">
        <i class="fa-solid fa-power-off"></i> Keluar
      </button>
    </div>

    <div class="space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-lg border border-zinc-200">
        <div class="flex items-center gap-2 mb-4 pb-2 border-b border-zinc-100">
          <i class="fa-solid fa-calendar-days text-blue-900 text-sm"></i>
          <h3 class="text-xs font-black text-blue-900 uppercase tracking-wider">Konfigurasi Jadwal & Waktu</h3>
        </div>
        <form id="configForm" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10px] font-black text-zinc-500 mb-1 uppercase tracking-wider">Tanggal Mulai Verif</label>
              <input type="date" id="tanggalMulai" required class="w-full bg-zinc-50 border border-zinc-300 p-2.5 text-xs font-bold rounded-xl focus:outline-none focus:border-blue-900 focus:bg-white transition-all text-center">
            </div>
            <div>
              <label class="block text-[10px] font-black text-zinc-500 mb-1 uppercase tracking-wider">Jam Operasional Pelayanan</label>
              <input type="text" id="jamOperasional" required placeholder="Contoh: 08:00 - 12:00 WIB" class="w-full bg-zinc-50 border border-zinc-300 p-2.5 text-xs font-bold rounded-xl focus:outline-none focus:border-blue-900 focus:bg-white transition-all text-center">
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-amber-400 p-3 rounded-xl font-black text-xs uppercase tracking-wider cursor-pointer transition shadow-sm">
            Simpan Pengaturan Waktu
          </button>
        </form>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-lg border border-zinc-200">
        <div class="flex items-center gap-2 mb-4 pb-2 border-b border-zinc-100">
          <i class="fa-solid fa-bullhorn text-amber-500 text-sm"></i>
          <h3 class="text-xs font-black text-blue-900 uppercase tracking-wider">Kirim Pengumuman Kotak Atas</h3>
        </div>
        <form id="broadcastForm" class="space-y-3">
          <div>
            <label class="block text-[10px] font-black text-zinc-500 mb-1 uppercase tracking-wider">Isi Materi Pengumuman (Satu Box Utama)</label>
            <textarea id="broadcast" rows="2" placeholder="Tulis info penting pendaftaran disini..." class="w-full bg-zinc-50 border border-zinc-300 p-3 text-xs font-semibold rounded-xl focus:outline-none focus:border-blue-900 focus:bg-white transition-all leading-relaxed"></textarea>
          </div>
          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-blue-950 p-3 rounded-xl font-black text-xs uppercase tracking-wider cursor-pointer transition shadow-sm">
            Perbarui Pengumuman Box
          </button>
        </form>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-lg border border-zinc-200">
        <div class="flex items-center gap-2 mb-4 pb-2 border-b border-zinc-100">
          <i class="fa-solid fa-window-maximize text-emerald-600 text-sm"></i>
          <h3 class="text-xs font-black text-blue-900 uppercase tracking-wider">Pengaturan Teks Berjalan (Baris 7 Kolom B-H)</h3>
        </div>
        <form id="tickerForm" class="space-y-3">
          <div class="bg-zinc-50 p-3 rounded-xl border border-zinc-200 space-y-2.5">
            <div class="flex items-center gap-2"><span class="w-6 text-[10px] font-bold text-zinc-400 font-mono">B7:</span><input type="text" id="tk_b" placeholder="(Kosong)" class="w-full bg-white border border-zinc-300 p-2 text-xs font-medium rounded-lg focus:outline-none focus:border-blue-900"></div>
            <div class="flex items-center gap-2"><span class="w-6 text-[10px] font-bold text-zinc-400 font-mono">C7:</span><input type="text" id="tk_c" placeholder="(Kosong)" class="w-full bg-white border border-zinc-300 p-2 text-xs font-medium rounded-lg focus:outline-none focus:border-blue-900"></div>
            <div class="flex items-center gap-2"><span class="w-6 text-[10px] font-bold text-zinc-400 font-mono">D7:</span><input type="text" id="tk_d" placeholder="(Kosong)" class="w-full bg-white border border-zinc-300 p-2 text-xs font-medium rounded-lg focus:outline-none focus:border-blue-900"></div>
            <div class="flex items-center gap-2"><span class="w-6 text-[10px] font-bold text-zinc-400 font-mono">E7:</span><input type="text" id="tk_e" placeholder="(Kosong)" class="w-full bg-white border border-zinc-300 p-2 text-xs font-medium rounded-lg focus:outline-none focus:border-blue-900"></div>
            <div class="flex items-center gap-2"><span class="w-6 text-[10px] font-bold text-zinc-400 font-mono">F7:</span><input type="text" id="tk_f" placeholder="(Kosong)" class="w-full bg-white border border-zinc-300 p-2 text-xs font-medium rounded-lg focus:outline-none focus:border-blue-900"></div>
            <div class="flex items-center gap-2"><span class="w-6 text-[10px] font-bold text-zinc-400 font-mono">G7:</span><input type="text" id="tk_g" placeholder="(Kosong)" class="w-full bg-white border border-zinc-300 p-2 text-xs font-medium rounded-lg focus:outline-none focus:border-blue-900"></div>
            <div class="flex items-center gap-2"><span class="w-6 text-[10px] font-bold text-zinc-400 font-mono">H7:</span><input type="text" id="tk_h" placeholder="(Kosong)" class="w-full bg-white border border-zinc-300 p-2 text-xs font-medium rounded-lg focus:outline-none focus:border-blue-900"></div>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-xl font-black text-xs uppercase tracking-wider cursor-pointer transition shadow-sm">
            Sinkronkan Semua Ticker
          </button>
        </form>
      </div>
    </div>
  </div>

  <footer class="text-center p-3.5 bg-zinc-200 text-zinc-500 text-[10px] font-black tracking-widest uppercase border-t border-zinc-300 shadow-sm">
    APLIKASI SIVERA V 1.3 - © 2026 Dev by MB
  </footer>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwN5UAUGXse_vKksd2mzReV-k6I4RnXxkzbewUP09hlfYuBrd7Nui4ogiaSKYjHPAQL/exec";

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('sivera_logged_in') === 'true') {
        tampilkanHalamanAdmin();
      }
    });

    function prosesLogin() {
      const pin = document.getElementById('adminPin').value;
      if(!pin) { Swal.fire('Error', 'PIN tidak boleh kosong!', 'warning'); return; }
      
      Swal.fire({ title: 'Memvalidasi PIN...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      fetch(WEB_APP_URL, { 
          method: "POST", 
          body: JSON.stringify({ action: "loginValidation", pin: pin }) 
      })
      .then(res => res.json())
      .then(res => {
        Swal.close();
        if(res.success) {
          localStorage.setItem('sivera_logged_in', 'true');
          tampilkanHalamanAdmin();
        } else { 
          Swal.fire('Akses Ditolak', res.error || 'PIN yang dimasukkan salah.', 'error'); 
        }
      }).catch(() => {
        Swal.fire('Error', 'Terjadi kesalahan koneksi server.', 'error');
      });
    }

    function tampilkanHalamanAdmin() {
      document.getElementById('loginWrapper').classList.add('hidden');
      document.getElementById('mainSection').classList.remove('hidden');
      loadData();
    }

    function loadData() {
      Swal.fire({ title: 'Mengambil Data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      fetch(`${WEB_APP_URL}?action=getAdminConfig`)
        .then(res => res.json())
        .then(data => {
          Swal.close();
          document.getElementById('broadcast').value = data.broadcast || "";
          document.getElementById('jamOperasional').value = data.jamOperasional || "";
          if(data.tanggalMulai) document.getElementById('tanggalMulai').value = data.tanggalMulai.split('T')[0];
          
          // Memuat data dari array kolom B7-H7 jika tersedia
          if(data.rawTickers && data.rawTickers.length >= 7) {
            document.getElementById('tk_b').value = data.rawTickers[0] || "";
            document.getElementById('tk_c').value = data.rawTickers[1] || "";
            document.getElementById('tk_d').value = data.rawTickers[2] || "";
            document.getElementById('tk_e').value = data.rawTickers[3] || "";
            document.getElementById('tk_f').value = data.rawTickers[4] || "";
            document.getElementById('tk_g').value = data.rawTickers[5] || "";
            document.getElementById('tk_h').value = data.rawTickers[6] || "";
          }
        }).catch(() => {
          Swal.fire('Gagal', 'Gagal memuat konfigurasi dari Google Sheets.', 'error');
        });
    }

    document.getElementById('configForm').addEventListener('submit', function(e) {
      e.preventDefault();
      Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      const payload = { 
          action: "updateAdminConfig", 
          subAction: "timeConfig",
          tanggalMulai: document.getElementById('tanggalMulai').value, 
          jamOperasional: document.getElementById('jamOperasional').value 
      };
      
      fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(res => {
          if(res.success) Swal.fire('Berhasil', 'Konfigurasi waktu berhasil disimpan', 'success');
          else Swal.fire('Gagal', res.error || 'Gagal menyimpan', 'error');
      });
    });

    document.getElementById('broadcastForm').addEventListener('submit', function(e) {
      e.preventDefault();
      Swal.fire({ title: 'Mengirim...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      const payload = { 
          action: "updateAdminConfig", 
          subAction: "broadcastConfig",
          broadcast: document.getElementById('broadcast').value 
      };
      
      fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(res => {
          if(res.success) Swal.fire('Berhasil', 'Pengumuman box diperbarui', 'success');
          else Swal.fire('Gagal', res.error || 'Gagal menyimpan', 'error');
      });
    });

    document.getElementById('tickerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      Swal.fire({ title: 'Menyinkronkan Ticker...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      const tickerArray = [
        document.getElementById('tk_b').value,
        document.getElementById('tk_c').value,
        document.getElementById('tk_d').value,
        document.getElementById('tk_e').value,
        document.getElementById('tk_f').value,
        document.getElementById('tk_g').value,
        document.getElementById('tk_h').value
      ];

      const payload = { 
          action: "updateAdminConfig", 
          subAction: "tickerConfig",
          tickers: tickerArray
      };
      
      fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(res => {
          if(res.success) Swal.fire('Berhasil', 'Seluruh baris teks berjalan telah sinkron!', 'success');
          else Swal.fire('Gagal', res.error || 'Gagal memperbarui ticker', 'error');
      });
    });

    function prosesLogout() { 
      localStorage.clear(); 
      location.reload(); 
    }
  </script>
</body>
</html>
