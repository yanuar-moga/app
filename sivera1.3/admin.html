<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Pengendali Utama SIVERA</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; color: #334155; }
    
    .login-wrapper { max-width: 400px; width: 90%; margin: auto; background: white; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #e2e8f0; }
    .login-header { background: #1e3a8a; color: white; padding: 30px; text-align: center; border-bottom: 6px solid #d4af37; }
    .login-box { padding: 30px; }
    input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; margin: 15px 0; text-align: center; font-weight: 600; }
    button { background: #1e3a8a; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.3s; }
    button:hover { background: #152a66; }

    .container { max-width: 900px; margin: 20px auto; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 90%; }
    .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #f1f5f9; }
    .section-box { border: 1px solid #e2e8f0; padding: 25px; border-radius: 16px; margin-bottom: 25px; background: #f8fafc; }
    h2 { color: #1e3a8a; font-weight: 900; }
    h3 { font-size: 14px; color: #1e3a8a; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
    label { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 5px; display: block; }
    .btn-logout { background: #dc2626; max-width: 100px; font-size: 12px; }
    
    footer { text-align: center; padding: 20px; font-size: 0.75rem; color: #94a3b8; font-weight: 600; margin-top: auto; border-top: 1px solid #e2e8f0; background: #f8fafc; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th { text-align: left; padding: 12px; background: #e2e8f0; color: #1e3a8a; }
    td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
    .btn-del { background: #ef4444; color: white; padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

<div id="loginWrapper" class="login-wrapper">
  <div class="login-header">
    <h1 style="font-size: 1.2rem;">SMP NEGERI 1 MOGA</h1>
    <p style="font-size: 0.7rem; color: #d4af37; margin-top:5px;">PANEL ADMIN SIVERA</p>
  </div>
  <div class="login-box">
    <input type="password" id="adminPin" placeholder="Masukkan PIN Utama" maxlength="6">
    <button onclick="prosesLogin()">LOGIN APLIKASI</button>
  </div>
</div>

<div id="mainSection" class="container" style="display: none;">
  <div class="header-panel">
    <h2>Control Panel</h2>
    <button class="btn-logout" onclick="prosesLogout()">KELUAR</button>
  </div>
  
  <div class="section-box">
    <h3>📅 Konfigurasi Sistem</h3>
    <form id="configForm">
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div><label>TANGGAL MULAI:</label><input type="date" id="tanggalMulai" required style="margin: 5px 0 15px 0;"></div>
        <div><label>JAM OPERASIONAL:</label><input type="text" id="jamOperasional" required style="margin: 5px 0 15px 0;"></div>
      </div>
      <button type="submit" style="background:#1e3a8a;">SIMPAN PENGATURAN WAKTU</button>
    </form>
  </div>

  <div class="section-box">
    <h3>📢 Broadcast Pengumuman</h3>
    <form id="broadcastForm">
      <label>ISI PENGUMUMAN:</label>
      <textarea id="broadcast" style="width:100%; padding:10px; border-radius:12px; border:2px solid #e2e8f0; margin-bottom:15px; font-size:14px;" rows="2"></textarea>
      <button type="submit" style="background:#f59e0b;">KIRIM BROADCAST SEKARANG</button>
    </form>
  </div>

  <div class="section-box">
    <h3>👥 Manajemen Verifikator</h3>
    <form id="userForm" onsubmit="tambahUser(event)">
      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom:15px;">
        <input type="text" id="newUsername" placeholder="Nama Petugas" required style="margin:0;">
        <input type="text" id="newPin" placeholder="PIN" required style="margin:0;">
        <select id="newRole" style="padding:10px; border-radius:12px; border:2px solid #e2e8f0;">
          <option value="verifier">Verifikator</option>
          <option value="dashboard">Dashboard</option>
        </select>
      </div>
      <button type="submit" style="background:#059669;">TAMBAH USER BARU</button>
    </form>
    <table>
      <thead><tr><th>Nama</th><th>PIN</th><th>Akses</th><th>Aksi</th></tr></thead>
      <tbody id="usersTableBody"></tbody>
    </table>
  </div>
</div>

<footer>APLIKASI SIVERA V 1.3 - © 2026 Dev by MB</footer>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwqDaUhPAbV6FzrqgF9MHugZ15_EnIcbaQKTcHirE0q4Wb4pICOXFLvNWG2cEvi94kX/exec";

  // Deteksi status login saat halaman di-load
  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('sivera_logged_in') === 'true') {
      tampilkanHalamanAdmin();
    }
  });

  function prosesLogin() {
    const pin = document.getElementById('adminPin').value;
    Swal.fire({ title: 'Memvalidasi...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    fetch(WEB_APP_URL, { method: "POST", mode: "cors", body: JSON.stringify({ action: "loginValidation", pin: pin, expectedRole: "admin" }) })
    .then(res => res.json())
    .then(res => {
      Swal.close();
      if(res.success) {
        localStorage.setItem('sivera_logged_in', 'true');
        tampilkanHalamanAdmin();
      } else { Swal.fire('Akses Ditolak', res.error, 'error'); }
    });
  }

  function tampilkanHalamanAdmin() {
    document.getElementById('loginWrapper').style.display = 'none';
    document.getElementById('mainSection').style.display = 'block';
    loadData();
  }

  function loadData() {
    fetch(`${WEB_APP_URL}?action=getAdminConfig`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('broadcast').value = data.broadcast || "";
        document.getElementById('jamOperasional').value = data.jamOperasional || "";
        if(data.tanggalMulai) document.getElementById('tanggalMulai').value = data.tanggalMulai.split('T')[0];
      });
    loadAllUsers();
  }

  function loadAllUsers() {
    fetch(`${WEB_APP_URL}?action=getAllUsers`)
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = data.map(u => `<tr><td>${u.username}</td><td>${u.pin}</td><td>${u.role}</td><td><button class="btn-del" onclick="hapusUser('${u.username}','${u.pin}')">Hapus</button></td></tr>`).join('');
      });
  }

  function tambahUser(e) {
    e.preventDefault();
    const payload = { action: "addUser", username: document.getElementById('newUsername').value, pin: document.getElementById('newPin').value, role: document.getElementById('newRole').value };
    fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) }).then(() => { Swal.fire('Berhasil', 'User ditambah', 'success'); loadAllUsers(); });
  }

  function hapusUser(u, p) {
    fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "deleteUser", username: u, pin: p }) }).then(() => { Swal.fire('Terhapus', '', 'info'); loadAllUsers(); });
  }

  document.getElementById('configForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const payload = { action: "updateAdminConfig", tanggalMulai: document.getElementById('tanggalMulai').value, jamOperasional: document.getElementById('jamOperasional').value };
    fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) }).then(() => Swal.fire('Berhasil', 'Konfigurasi waktu tersimpan', 'success'));
  });

  document.getElementById('broadcastForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const payload = { action: "updateAdminConfig", broadcast: document.getElementById('broadcast').value };
    fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) }).then(() => Swal.fire('Berhasil', 'Pengumuman diperbarui', 'success'));
  });

  function prosesLogout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
