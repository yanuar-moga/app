<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin SIVERA v1.3</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background: #f0f2f5; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #1e3a8a; margin-bottom: 20px; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; }
    input[type="text"], input[type="date"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    textarea { height: 100px; resize: vertical; }
    button { background: #1e3a8a; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.3s; width: 100%; }
    button:hover { background: #152a66; }
    .loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
    .spinner { border: 6px solid #f3f3f3; border-top: 6px solid #1e3a8a; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p style="margin-top: 15px; font-weight: 600; color: #1e3a8a;">Memproses ke Server Google...</p>
</div>

<div class="container">
  <h2>⚙️ Pengaturan Sistem Antrean (SIVERA v1.3)</h2>
  
  <form id="adminForm">
    <div class="form-group">
      <label for="tanggalMulai">Tanggal Mulai Verifikasi:</label>
      <input type="date" id="tanggalMulai" required>
      <small style="color: #666;">Sistem otomatis menjadwalkan 150 pendaftar per hari kerja sejak tanggal ini (Hari Minggu libur).</small>
    </div>

    <div class="form-group">
      <label for="jamOperasional">Jam Operasional Verifikasi:</label>
      <input type="text" id="jamOperasional" placeholder="Contoh: 08:00 - 12:00 WIB" required>
    </div>

    <div class="form-group">
      <label for="broadcast">Pesan Pengumuman (Broadcast Running Text):</label>
      <textarea id="broadcast" placeholder="Tulis pengumuman penting di sini..." required></textarea>
    </div>

    <button type="submit">Simpan Semua Perubahan</button>
  </form>
</div>

<script>
  // 🛑 MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA YANG BARU DI SINI
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwqDaUhPAbV6FzrqgF9MHugZ15_EnIcbaQKTcHirE0q4Wb4pICOXFLvNWG2cEvi94kX/exec";

  const loading = document.getElementById('loading');

  // 1. Ambil data konfigurasi saat ini saat halaman dimuat
  window.addEventListener('DOMContentLoaded', () => {
    if (WEB_APP_URL.includes("XXXXXXXXX")) {
      Swal.fire('Konfigurasi Belum Selesai', 'Silakan ganti WEB_APP_URL di dalam script terlebih dahulu!', 'warning');
      return;
    }
    
    loading.style.display = 'flex';
    fetch(`${WEB_APP_URL}?action=getAdminConfig`)
      .then(res => {
        if (!res.ok) throw new Error('Respon jaringan server bermasalah.');
        return res.json();
      })
      .then(data => {
        document.getElementById('broadcast').value = data.broadcast || "";
        document.getElementById('jamOperasional').value = data.jamOperasional || "08:00 - 12:00 WIB";
        
        if(data.tanggalMulai) {
          // Normalisasi string tanggal agar cocok dengan input type="date"
          document.getElementById('tanggalMulai').value = data.tanggalMulai.split('T')[0];
        }
        loading.style.display = 'none';
      })
      .catch(err => {
        loading.style.display = 'none';
        Swal.fire('Gagal Memuat Data', 'Tidak bisa mengambil konfigurasi awal. Pastikan akses deployment disetel ke "Anyone". <br><br>Detail: ' + err.toString(), 'error');
      });
  });

  // 2. Simpan Perubahan saat Form Di-submit
  document.getElementById('adminForm').addEventListener('submit', function(e) {
    e.preventDefault();
    loading.style.display = 'flex';

    const payload = {
      action: "updateAdminConfig",
      broadcast: document.getElementById('broadcast').value,
      tanggalMulai: document.getElementById('tanggalMulai').value,
      jamOperasional: document.getElementById('jamOperasional').value
    };

    // Menggunakan integrasi fetch standar yang kompatibel dengan CORS redirection Google Apps Script
    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    })
    .then(res => {
      if (!res.ok) throw new Error('Gagal mendapatkan respon sukses dari server.');
      return res.json();
    })
    .then(res => {
      loading.style.display = 'none';
      if(res.success) {
        Swal.fire('Berhasil!', res.message, 'success');
      } else {
        Swal.fire('Gagal Menyimpan!', res.error, 'error');
      }
    })
    .catch(err => {
      loading.style.display = 'none';
      
      // Mengingat kendala redirect GAS, jika data sukses masuk ke Sheets tapi browser membaca sebagai error cors fetch,
      // kita berikan opsi pengecekan langsung ke user.
      Swal.fire({
        title: 'Respons Terputus / Selesai?',
        html: 'Terjadi hambatan jalur data browser (CORS/Failed to fetch). <br><br><b>Silakan periksa lembar kerja Google Sheets Anda.</b> Jika data di tab <i>config</i> sudah berubah, abaikan pesan ini.',
        icon: 'info',
        confirmButtonText: 'Siap, Dipahami'
      });
    });
  });
</script>

</body>
</html>
