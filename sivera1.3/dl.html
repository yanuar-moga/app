<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Verifikasi Antrean - SIVERA V 1.3</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn { 
        from { opacity: 0; transform: translateY(12px); } 
        to { opacity: 1; transform: translateY(0); } 
    }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    
    .ticker-item {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ticker-item.active { opacity: 1; transform: translateY(0); }
    .ticker-item.exit { opacity: 0; transform: translateY(-20px); }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-800 font-sans min-h-screen flex flex-col justify-between select-none">

  <header class="bg-blue-900 border-b-4 border-amber-400 p-4 shadow-md">
    <div class="container mx-auto max-w-md flex items-center gap-3.5 px-1">
      <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" alt="Logo SMPN 1 Moga" class="w-14 h-14 object-contain shrink-0 bg-white p-1 rounded-full shadow-sm">
      <div class="leading-tight">
        <h1 class="text-sm font-black text-white tracking-wide uppercase">SMP Negeri 1 Moga</h1>
        <p class="text-[10px] text-zinc-200 font-bold">Jl. Simpang Tiga Banyumudal, Kec. Moga</p>
        <a href="https://smpn1moga.sch.id" target="_blank" class="text-[10px] text-amber-400 font-black hover:underline hover:text-amber-300">smpn1moga.sch.id</a>
      </div>
    </div>
  </header>

  <main class="container mx-auto p-4 flex-grow max-w-md flex flex-col justify-center">
    
    <div id="broadcastBox" class="hidden bg-amber-50 border-2 border-amber-400 p-4 rounded-xl mb-3 shadow-sm flex items-start gap-3 animate-fade-in">
      <img src="https://yanuar-moga.github.io/app/sivera1.3/assets/info.png" alt="Info" class="w-8 h-8 object-contain mt-0.5 shrink-0">
      <div>
        <h4 class="font-black text-xs text-blue-950 uppercase tracking-wider">Pengumuman:</h4>
        <p id="broadcastText" class="text-xs text-zinc-700 mt-0.5 leading-relaxed"></p>
      </div>
    </div>

    <div class="bg-blue-900 text-white px-4 rounded-xl mb-4 border border-blue-950 shadow-md relative h-12 animate-fade-in flex items-center justify-center overflow-hidden">
      <div id="tickerContainer" class="relative w-full h-full text-[11px] font-bold text-center tracking-wide">
        <div class="ticker-item active text-zinc-300 italic">Memuat informasi antrean...</div>
      </div>
    </div>

    <div id="customAlert" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-xs w-full p-5 text-center shadow-2xl border-t-8 border-blue-900 transform scale-95 transition-all">
        <div id="alertIcon" class="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 shadow-md"></div>
        <h3 id="alertTitle" class="text-sm font-black text-blue-900 uppercase"></h3>
        <p id="alertMessage" class="text-xs text-zinc-600 mt-2 mb-4 leading-relaxed"></p>
        <button onclick="closeAlert()" class="w-full bg-blue-900 hover:bg-blue-800 text-amber-400 font-black text-xs py-2.5 rounded-xl cursor-pointer transition uppercase tracking-wider shadow-md">OK, Mengerti</button>
      </div>
    </div>

    <div id="aboutModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
      <div class="bg-white rounded-2xl max-w-xs w-full p-6 text-center shadow-2xl border-b-8 border-amber-400">
        <img src="https://yanuar-moga.github.io/assets/logo.jpg" alt="Logo Sivera" class="w-20 h-20 object-cover mx-auto rounded-full p-1 border-2 border-blue-900 shadow-md mb-3">
        <h3 class="text-xs font-black text-zinc-400 tracking-widest uppercase">SISTEM VERIFIKASI ANTREAN</h3>
        <h2 class="text-xl font-black text-blue-950 my-0.5 tracking-wide">SIVERA V 1.3</h2>
        <span class="inline-block bg-zinc-100 text-zinc-600 font-bold text-[10px] px-2.5 py-0.5 rounded-full mb-4 border border-zinc-200">Build 14 Juni 2026</span>
        <div class="text-left bg-zinc-50 border border-zinc-200 rounded-xl p-3.5 space-y-2 text-xs mb-5 font-medium text-zinc-700">
          <div class="flex items-center gap-2"><i class="fa-solid fa-code text-blue-900 w-4"></i> <span>Develop by <strong>MB</strong></span></div>
          <div class="flex items-center gap-2"><i class="fa-solid fa-envelope text-blue-900 w-4"></i> <span>Contact: <a href="mailto:yanuar.b@gmail.com" class="text-blue-600 hover:underline">yanuar.b@gmail.com</a></span></div>
          <div class="flex items-center gap-2"><i class="fa-solid fa-link text-blue-900 w-4"></i> <span>App: <a href="https://lynk.id/mb_dprint" target="_blank" class="text-blue-600 font-bold hover:underline">lynk.id/mb_dprint</a></span></div>
        </div>
        <button onclick="closeAboutModal()" class="w-full bg-blue-900 hover:bg-blue-800 text-amber-400 font-black text-xs py-3 rounded-xl cursor-pointer transition uppercase tracking-wider shadow-md">Tutup</button>
      </div>
    </div>

    <div id="formSection" class="bg-white rounded-2xl p-5 shadow-xl border border-zinc-200 animate-fade-in">
      <div class="text-center mb-5">
        <h2 class="text-base font-black text-blue-900 uppercase tracking-wide">Formulir Loket Antrean</h2>
        <div class="h-1 w-12 bg-amber-400 mx-auto mt-1.5 rounded-full"></div>
      </div>
      <form id="formDaftar" onsubmit="submitForm(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-zinc-600 mb-1 uppercase tracking-wider">Nama Lengkap Calon Siswa</label>
          <input type="text" id="nama" required placeholder="Contoh: Budi Santoso" class="w-full bg-zinc-50 border border-zinc-300 p-3 text-sm rounded-xl focus:outline-none focus:border-blue-900 focus:bg-white transition-all font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-zinc-600 mb-1 uppercase tracking-wider">NISN (10 Digit)</label>
          <input type="number" id="nisn" required placeholder="Contoh: 0123456789" class="w-full bg-zinc-50 border border-zinc-300 p-3 text-sm rounded-xl focus:outline-none focus:border-blue-900 focus:bg-white transition-all font-mono font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-zinc-600 mb-2 uppercase tracking-wider">Jenis Kelamin</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center justify-center gap-2 border p-3 rounded-xl bg-zinc-50 hover:bg-zinc-100 cursor-pointer transition font-medium text-sm border-zinc-200">
              <input type="radio" name="jk" value="L" required class="w-4 h-4 text-blue-900 focus:ring-blue-900"> Laki-laki
            </label>
            <label class="flex items-center justify-center gap-2 border p-3 rounded-xl bg-zinc-50 hover:bg-zinc-100 cursor-pointer transition font-medium text-sm border-zinc-200">
              <input type="radio" name="jk" value="P" required class="w-4 h-4 text-blue-900 focus:ring-blue-900"> Perempuan
            </label>
          </div>
        </div>
        <div class="bg-zinc-50 p-3.5 rounded-xl border border-zinc-200">
          <label class="block text-xs font-bold text-blue-900 mb-1.5 uppercase tracking-wider"><i class="fa-solid fa-shield-halved text-amber-500 mr-1"></i> Verifikasi Keamanan</label>
          <div class="flex items-center gap-3">
            <div class="bg-blue-900 text-amber-400 px-3 py-2 rounded-xl text-sm font-black tracking-widest font-mono shadow-inner shrink-0" id="captchaQuestion">0 + 0 =</div>
            <input type="number" id="captchaAnswer" required placeholder="Hasil?" class="w-full bg-white border border-zinc-300 p-2.5 text-sm rounded-xl focus:outline-none focus:border-blue-900 font-mono font-bold text-center">
          </div>
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-blue-900 hover:bg-blue-800 text-amber-400 p-3.5 rounded-xl font-black text-xs uppercase tracking-widest cursor-pointer transition shadow-md flex items-center justify-center gap-2 mt-2">Ambil Nomor Antrean</button>
      </form>
      
      <div class="mt-8 pt-6 border-t border-zinc-200">
        <label class="block text-xs font-bold text-zinc-500 mb-2 uppercase text-center">Lupa download tiket? Cari di sini:</label>
        <div class="flex gap-2">
            <input type="number" id="searchNisn" placeholder="Masukkan NISN..." class="w-full bg-zinc-50 border border-zinc-300 p-3 text-sm rounded-xl focus:outline-none focus:border-blue-900 font-mono">
            <button onclick="cariTiket()" class="bg-zinc-700 hover:bg-zinc-800 text-white px-5 rounded-xl font-black text-xs uppercase tracking-wider shadow-md">CARI</button>
        </div>
      </div>
    </div>

    <div id="ticketSection" class="hidden space-y-4 animate-fade-in">
      <div id="ticketCard" class="hidden"></div> <div class="flex gap-3">
        <button onclick="downloadTiketGambar()" class="flex-1 bg-amber-400 hover:bg-amber-500 text-blue-950 p-3 rounded-xl font-black text-xs uppercase tracking-wider cursor-pointer text-center shadow-md transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-file-arrow-down"></i> Download Tiket</button>
        <button onclick="keluarKeIndex()" class="flex-1 bg-zinc-700 hover:bg-zinc-800 text-white p-3 rounded-xl font-black text-xs uppercase tracking-wider cursor-pointer text-center shadow-md transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
      </div>
    </div>
  </main>

  <footer onclick="openAboutModal()" class="text-center p-3.5 bg-zinc-200 hover:bg-zinc-300 active:bg-zinc-400 text-zinc-600 text-[10px] font-black tracking-widest uppercase border-t border-zinc-300 cursor-pointer transition shadow-sm">
    Aplikasi Sivera V 1.3
  </footer>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbxqvm_weKRsAkoospWstaQEoREEF_QybeZ62hohzGDdr6SlDpEc1zAvMBCnRM-gqad5/exec";
    var num1, num2, correctAnswer;
    var jamOperasionalGlobal = "08:00 - 12:00 WIB";
    var clientIP = "Unknown";
    var clientProvider = "Unknown";
    var clientLocation = "Unknown";

    function formatTanggalLengkap(inputData) {
      if (!inputData) return "-";
      var d = new Date(inputData);
      if (isNaN(d.getTime())) { return inputData; }
      var daftarHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      var daftarBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      return daftarHari[d.getDay()] + ", " + String(d.getDate()).padStart(2, '0') + " " + daftarBulan[d.getMonth()] + " " + d.getFullYear() + " " + String(d.getHours()).padStart(2, '0') + ":" + String(d.getMinutes()).padStart(2, '0') + ":" + String(d.getSeconds()).padStart(2, '0') + " WIB";
    }

    function formatHanyaTanggal(inputData) {
      if (!inputData) return "-";
      var d = new Date(inputData);
      if (isNaN(d.getTime())) {
        var teks = inputData.toString();
        if(teks.includes(" ")) {
          var part = teks.split(" ");
          if(part.length >= 4) return part[0] + " " + part[1] + " " + part[2] + " " + part[3];
        }
        return inputData; 
      }
      var daftarHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      var daftarBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      return daftarHari[d.getDay()] + ", " + String(d.getDate()).padStart(2, '0') + " " + daftarBulan[d.getMonth()] + " " + d.getFullYear();
    }

    function generateCaptcha() {
      num1 = Math.floor(Math.random() * 10) + 6; 
      num2 = Math.floor(Math.random() * 5) + 1;  
      correctAnswer = num1 + num2;
      document.getElementById('captchaQuestion').innerText = num1 + " + " + num2 + " =";
      document.getElementById('captchaAnswer').value = "";
    }

    function initMetadataTracker() {
      fetch('https://ipapi.co/json/').then(res => res.json()).then(data => {
        clientIP = data.ip || "Unknown";
        clientProvider = data.org || "Unknown";
      }).catch(() => {
        fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => { clientIP = data.ip; });
      });

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          clientLocation = position.coords.latitude + ", " + position.coords.longitude;
        }, function() { clientLocation = "GPS Dinonaktifkan"; });
      } else { clientLocation = "Tidak Didukung Browser"; }
    }

    function startTickerEngine(tickerArray) {
      if (!tickerArray || tickerArray.length === 0) return;
      var container = document.getElementById('tickerContainer');
      container.innerHTML = ""; 
      tickerArray.forEach((text, index) => {
        var el = document.createElement('div');
        el.className = "ticker-item";
        el.innerText = text;
        el.classList.add(index % 2 === 0 ? "text-zinc-100" : "text-amber-300");
        container.appendChild(el);
      });
      var items = container.querySelectorAll('.ticker-item');
      var currentIndex = 0;
      items[currentIndex].classList.add('active');
      setInterval(() => {
        var currentEl = items[currentIndex];
        currentEl.classList.remove('active');
        currentEl.classList.add('exit');
        setTimeout(() => { currentEl.classList.remove('exit'); }, 600);
        currentIndex = (currentIndex + 1) % items.length;
        items[currentIndex].classList.add('active');
      }, 4000);
    }

    window.onload = function() {
      generateCaptcha();
      initMetadataTracker();
      fetch(API_URL + "?action=getBroadcast").then(res => res.json()).then(data => {
        if (data.message && data.message.trim() !== "") {
          document.getElementById('broadcastText').innerText = data.message;
          document.getElementById('broadcastBox').classList.remove('hidden');
        }
      });
      fetch(API_URL + "?action=getConfig").then(res => res.json()).then(data => {
        if (data.jamOperasional) { jamOperasionalGlobal = data.jamOperasional; }
      });
      fetch(API_URL + "?action=getTickers").then(res => res.json()).then(data => {
        if (data.tickers && data.tickers.length > 0) {
          startTickerEngine(data.tickers);
        } else {
          document.getElementById('tickerContainer').innerHTML = `<div class="ticker-item active text-zinc-300">Selamat Datang di SIVERA v1.3</div>`;
        }
      });
    };

    function openAboutModal() { document.getElementById('aboutModal').classList.remove('hidden'); }
    function closeAboutModal() { document.getElementById('aboutModal').classList.add('hidden'); }

    function cariTiket() {
      var nisn = document.getElementById('searchNisn').value;
      if (!nisn) { showAlert("Error", "Masukkan NISN terlebih dahulu", "error"); return; }
      var searchButton = document.querySelector("button[onclick='cariTiket()']");
      searchButton.disabled = true; searchButton.innerText = "...";
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "cariTiket", nisn: nisn }) })
      .then(res => res.json())
      .then(res => {
        searchButton.disabled = false; searchButton.innerText = "CARI";
        if (res.success) {
          renderTicketData(res);
          document.getElementById('formSection').classList.add('hidden');
          document.getElementById('ticketSection').classList.remove('hidden');
        } else { showAlert("Gagal", res.error, "error"); }
      }).catch(() => { searchButton.disabled = false; searchButton.innerText = "CARI"; });
    }

    function renderTicketData(res) {
        // Simpan data di hidden elements untuk diakses fungsi download
        window.tempTicketData = res;
    }

    function showAlert(title, msg, type) {
      var box = document.getElementById('customAlert');
      var icon = document.getElementById('alertIcon');
      document.getElementById('alertTitle').innerText = title;
      document.getElementById('alertMessage').innerText = msg;
      icon.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 shadow-md " + (type === 'success' ? "bg-emerald-100 text-emerald-600" : "bg-red-100 text-red-600");
      icon.innerHTML = type === 'success' ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-xmark"></i>';
      box.classList.remove('hidden');
    }

    function closeAlert() { document.getElementById('customAlert').classList.add('hidden'); }

    function submitForm(event) {
      event.preventDefault();
      if (parseInt(document.getElementById('captchaAnswer').value) !== correctAnswer) {
        showAlert("Verifikasi Gagal!", "Hasil perhitungan matematika salah.", "error");
        generateCaptcha(); return;
      }
      var submitButton = document.getElementById('btnSubmit');
      submitButton.disabled = true; submitButton.innerText = "Memproses...";
      var jk = document.querySelector('input[name="jk"]:checked') ? document.querySelector('input[name="jk"]:checked').value : "-";
      var payload = { nama: document.getElementById('nama').value, nisn: document.getElementById('nisn').value, jk: jk, ip: clientIP, provider: clientProvider, lokasi: clientLocation };
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "daftar", data: payload }) })
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            renderTicketData(res);
            showAlert("Sukses!", "Nomor antrean berhasil diterbitkan.", "success");
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('ticketSection').classList.remove('hidden');
          } else {
            showAlert("Gagal!", res.error, "error");
            submitButton.disabled = false; submitButton.innerText = "Ambil Nomor Antrean";
            generateCaptcha();
          }
        }).catch(() => { submitButton.disabled = false; submitButton.innerText = "Ambil Nomor Antrean"; generateCaptcha(); });
    }

    async function downloadTiketGambar() {
      var data = window.tempTicketData;
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      canvas.width = 500; canvas.height = 740; 
      
      // 1. Background Utama (Navy) dengan Rounded Corner
      ctx.fillStyle = "#1e293b";
      var radius = 25;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(canvas.width - radius, 0);
      ctx.quadraticCurveTo(canvas.width, 0, canvas.width, radius);
      ctx.lineTo(canvas.width, canvas.height - radius);
      ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - radius, canvas.height);
      ctx.lineTo(radius, canvas.height);
      ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();

      // Logo & Header
      var logoImg = new Image();
      logoImg.crossOrigin = "anonymous";
      logoImg.src = "https://yanuar-moga.github.io/guruwali/assets/logo.png";
      await new Promise(resolve => logoImg.onload = resolve);
      ctx.globalAlpha = 0.05; 
      ctx.drawImage(logoImg, 100, 200, 300, 300);
      ctx.globalAlpha = 1.0;
      ctx.drawImage(logoImg, 40, 30, 45, 45);
      
      ctx.fillStyle = "#fbbf24"; ctx.font = "900 20px Arial"; ctx.textAlign = "left";
      ctx.fillText("BUKTI NOMOR ANTREAN", 100, 50);
      ctx.fillStyle = "#cbd5e1"; ctx.font = "13px Arial";
      ctx.fillText("Sivera V 1.3 • SMP Negeri 1 Moga", 100, 70);

      // 2. Box Nomor Antrean (Rounded)
      ctx.fillStyle = "#1e3a8a";
      var boxX = 40, boxY = 110, boxW = 420, boxH = 220, boxRadius = 15;
      ctx.beginPath();
      ctx.moveTo(boxX + boxRadius, boxY);
      ctx.lineTo(boxX + boxW - boxRadius, boxY);
      ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + boxRadius);
      ctx.lineTo(boxX + boxW, boxY + boxH - boxRadius);
      ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - boxRadius, boxY + boxH);
      ctx.lineTo(boxX + boxRadius, boxY + boxH);
      ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - boxRadius);
      ctx.lineTo(boxX, boxY + boxRadius);
      ctx.quadraticCurveTo(boxX, boxY, boxX + boxRadius, boxY);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#94a3b8"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
      ctx.fillText("NOMOR ANTREAN", canvas.width/2, 160);
      ctx.fillStyle = "#fbbf24"; ctx.font = "900 80px Arial";
      ctx.fillText(String(data.noAntrean).padStart(3, '0'), canvas.width/2, 250);
      
      ctx.fillStyle = "#f59e0b";
      ctx.beginPath(); ctx.roundRect(180, 275, 140, 40, 20); ctx.fill();
      ctx.fillStyle = "#000"; ctx.font = "900 16px Arial";
      ctx.fillText(data.loket.toUpperCase(), canvas.width/2, 303);

      // 3. Data Siswa dengan Garis Bawah
      var listData = [
        { label: "Nama Lengkap", val: data.nama },
        { label: "NISN", val: data.nisn },
        { label: "Jenis Kelamin", val: (data.jk === 'L' ? 'Laki-laki' : 'Perempuan') },
        { label: "Jadwal Verifikasi", val: formatHanyaTanggal(data.tanggalVerif) },
        { label: "Jam Pelayanan", val: data.jamConfig || jamOperasionalGlobal },
        { label: "Waktu Mendaftar", val: formatTanggalLengkap(data.tanggalDaftar) }
      ];
      
      var y = 380;
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1;

      for (var i = 0; i < listData.length; i++) {
        ctx.textAlign = "left"; ctx.fillStyle = "#94a3b8"; ctx.font = "14px Arial";
        ctx.fillText(listData[i].label, 40, y);
        ctx.textAlign = "right"; ctx.fillStyle = "#ffffff"; ctx.font = "bold 15px Arial";
        if (i === 3) ctx.fillStyle = "#fbbf24";
        ctx.fillText(listData[i].val, 460, y);
        
        y += 15;
        ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(460, y); ctx.stroke();
        y += 35;
      }

      ctx.fillStyle = "#fbbf24"; ctx.textAlign = "center"; ctx.font = "italic bold 12px Arial";
      ctx.fillText("*Simpan Gambar ini & Tunjukkan ke Petugas Saat Verifikasi Berkas", canvas.width/2, 700);

      var link = document.createElement('a');
      link.download = 'Tiket_Antrean_' + data.nisn + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function keluarKeIndex() {
      document.getElementById('ticketSection').classList.add('hidden');
      document.getElementById('formSection').classList.remove('hidden');
      document.getElementById('formDaftar').reset();
      generateCaptcha();
    }
  </script>
</body>
</html>
