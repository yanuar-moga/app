<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Statistik SIVERA</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-800 font-sans min-h-screen flex flex-col justify-between select-none">

  <header class="bg-blue-900 border-b-4 border-amber-400 p-4 shadow-lg sticky top-0 z-40">
    <div class="container mx-auto max-w-5xl flex justify-between items-center px-1">
      <div class="flex items-center gap-3">
        <div class="bg-white p-1 rounded-full shadow-md">
          <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" alt="Logo" class="w-12 h-12 object-contain">
        </div>
        <div>
          <h1 class="text-white font-black text-sm md:text-base uppercase tracking-wider m-0">SMP NEGERI 1 MOGA</h1>
          <a href="https://smpn1moga.sch.id" target="_blank" class="text-amber-400 text-[10px] font-bold uppercase hover:underline flex items-center gap-1">
            <i class="fa-solid fa-earth-asia"></i> smpn1moga.sch.id
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto max-w-5xl p-4 flex-grow flex items-center justify-center">
    <div id="loginWrapper" class="bg-white p-6 rounded-2xl shadow-xl border border-zinc-200 max-w-sm w-full mx-auto animate-fade-in text-center space-y-4">
      <div class="w-14 h-14 bg-blue-900 rounded-full flex items-center justify-center mx-auto shadow-lg">
        <i class="fa-solid fa-chart-pie text-amber-400 text-xl"></i>
      </div>
      <div>
        <h2 class="text-blue-900 font-black text-base uppercase tracking-wide">Login Dashboard</h2>
        <p class="text-zinc-400 text-[10px] font-bold uppercase">Masukkan PIN Akses Grafik Utama</p>
      </div>
      <input type="password" id="dashPin" placeholder="••••••" maxlength="6" class="w-full bg-zinc-50 border-2 border-zinc-200 p-3 rounded-xl text-center font-mono font-black text-xl tracking-[0.4em] focus:outline-none focus:border-blue-900 focus:bg-white transition-all">
      <button onclick="prosesLogin()" class="w-full bg-blue-900 hover:bg-blue-800 text-amber-400 font-black py-3.5 rounded-xl shadow-md transition uppercase tracking-widest text-xs cursor-pointer flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Buka Statistik
      </button>
    </div>

    <div id="mainSection" class="hidden w-full space-y-5 animate-fade-in self-start mt-2">
      <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow border border-zinc-200">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 bg-blue-600 rounded-full animate-pulse"></span>
          <h2 class="text-sm font-black text-blue-950 uppercase tracking-wider">Dashboard Real-time Monitoring</h2>
        </div>
        <button onclick="prosesLogout()" class="bg-red-600 hover:bg-red-700 text-white text-[10px] font-black px-3 py-2 rounded-xl transition uppercase shadow cursor-pointer flex items-center gap-1.5">
          <i class="fa-solid fa-power-off"></i> Keluar
        </button>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-900 flex flex-col justify-between">
          <span class="text-[9px] font-black text-zinc-400 uppercase tracking-wider">Total Antrean</span>
          <p id="totalAntrean" class="text-2xl font-black text-blue-900 mt-1">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow border-l-4 border-emerald-600 flex flex-col justify-between">
          <span class="text-[9px] font-black text-zinc-400 uppercase tracking-wider">Sudah Verif</span>
          <p id="totalVerif" class="text-2xl font-black text-emerald-600 mt-1">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow border-l-4 border-amber-500 flex flex-col justify-between">
          <span class="text-[9px] font-black text-zinc-400 uppercase tracking-wider">Belum Verif</span>
          <p id="totalBelum" class="text-2xl font-black text-amber-500 mt-1">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500 flex flex-col justify-between">
          <span class="text-[9px] font-black text-zinc-400 uppercase tracking-wider">Ditunda</span>
          <p id="totalTunda" class="text-2xl font-black text-red-500 mt-1">0</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
        <div class="bg-white p-4 rounded-xl shadow border border-zinc-200 md:col-span-3 flex flex-col">
           <table class="w-full text-[11px] text-left border-collapse">
              <thead><tr class="text-zinc-400 border-b border-zinc-200 font-black uppercase tracking-wider text-[10px]"><th class="pb-2">Nama Siswa</th><th class="pb-2 w-24">NISN</th><th class="pb-2 text-center w-24">Status</th></tr></thead>
              <tbody id="tabelData" class="divide-y divide-zinc-50 font-medium"></tbody>
           </table>
        </div>
        <div class="bg-white p-4 rounded-xl shadow border border-zinc-200 md:col-span-2 flex flex-col items-center">
          <h3 class="text-xs font-black text-blue-900 uppercase tracking-wider mb-3">Statistik Gender</h3>
          <div class="w-full h-52 relative"><canvas id="genderChart"></canvas></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Registrasi plugin datalabels agar angka muncul di grafik
    Chart.register(ChartDataLabels);

    const API_URL = "https://script.google.com/macros/s/AKfycbxqvm_weKRsAkoospWstaQEoREEF_QybeZ62hohzGDdr6SlDpEc1zAvMBCnRM-gqad5/exec";
    let chartG = null;
    let refreshInterval = null;

    // ... fungsi prosesLogin & prosesLogout tetap sama ...
    function prosesLogin() { /* ... */ }
    function prosesLogout() { if(refreshInterval) clearInterval(refreshInterval); localStorage.removeItem('sivera_logged_in'); location.reload(); }

    function tampilkanDashboard() {
      document.getElementById('loginWrapper').classList.add('hidden');
      document.getElementById('mainSection').classList.remove('hidden');
      if (chartG !== null) chartG.destroy();

      const ctx = document.getElementById('genderChart').getContext('2d');
      chartG = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: ['Laki-laki', 'Perempuan'], datasets: [{ data: [0, 0], backgroundColor: ['#2563eb', '#db2777'] }] },
        options: { 
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' },
            datalabels: { color: '#fff', font: { weight: 'bold', size: 14 }, formatter: (value) => value }
          }
        }
      });
      muatData();
      // Auto-reload setiap 15 menit (15 * 60 * 1000 = 900.000 ms)
      refreshInterval = setInterval(muatData, 900000);
    }

    function muatData() {
      fetch(`${API_URL}?action=getDashboardStats`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('totalAntrean').innerText = data.totalAntrean || 0;
          document.getElementById('totalVerif').innerText = data.totalVerif || 0;
          document.getElementById('totalBelum').innerText = data.totalBelum || 0;
          document.getElementById('totalTunda').innerText = data.totalTunda || 0;
          
          // Update Chart
          if(chartG) {
            chartG.data.datasets[0].data = [data.totalLaki || 0, data.totalPerempuan || 0];
            chartG.update();
          }
          // ... update tabel ...
        });
    }
  </script>
</body>
</html>
