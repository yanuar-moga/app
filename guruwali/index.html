<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>GURU WALI</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   ROOT
===================================================== */

:root{
  --blue:#0b44ee;
  --blue2:#0635c9;
  --blue3:#082fae;

  --blue-soft:#eaf0ff;
  --blue-pale:#f4f7ff;

  --lime:#ccff00;
  --lime-soft:#efffc2;

  --bg:#f4f6fb;

  --card:#fff;

  --text:#172033;
  --text-dark:#101828;

  --muted:#6b7280;

  --line:#e5e7eb;

  --danger:#ef4444;
  --danger-soft:#fee2e2;

  --success:#16a34a;
  --success-soft:#dcfce7;

  --warning:#f59e0b;
  --warning-soft:#fef3c7;

  --shadow-sm:
    0 4px 14px rgba(15,23,42,.06);

  --shadow:
    0 10px 30px rgba(15,23,42,.08);

  --shadow-lg:
    0 20px 50px rgba(15,23,42,.12);

  --radius:18px;
}


/* =====================================================
   GLOBAL
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:Poppins,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =====================================================
   LOGIN BACKGROUND
===================================================== */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(11,68,238,.18),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 80%,
      rgba(204,255,0,.08),
      transparent 30%
    ),
    #0d1117;
}


/* animated decorative lights */

#loginScreen:before,
#loginScreen:after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  filter:blur(2px);
}

#loginScreen:before{
  width:300px;
  height:300px;
  background:
    radial-gradient(
      circle,
      rgba(11,68,238,.20),
      transparent 70%
    );
  top:-130px;
  left:-100px;
  animation:orbMove 9s ease-in-out infinite;
}

#loginScreen:after{
  width:350px;
  height:350px;
  background:
    radial-gradient(
      circle,
      rgba(204,255,0,.09),
      transparent 70%
    );
  right:-150px;
  bottom:-150px;
  animation:orbMove2 11s ease-in-out infinite;
}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card{
  width:min(100%,380px);
  min-height:700px;

  background:var(--blue);

  border-radius:44px;

  overflow:hidden;

  box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.05);

  position:relative;

  animation:
    loginCardIn .8s cubic-bezier(.22,1,.36,1);

  z-index:2;
}


/* =====================================================
   LOGIN TOP
===================================================== */

.top{
  height:245px;

  background:#f3f3f7;

  display:flex;
  align-items:flex-start;
  justify-content:center;

  padding-top:48px;

  position:relative;
}

.top:after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:-1px;

  height:110px;

  background:var(--blue);

  clip-path:path(
    "M 0 35 C 150 110 320 -15 500 65 L 500 120 L 0 120 Z"
  );
}


/* =====================================================
   LOGIN LOGO
===================================================== */

.logo{
  width:110px;
  height:110px;

  border-radius:28px;

  object-fit:cover;

  box-shadow:
    0 12px 35px rgba(0,0,0,.18),
    0 0 0 5px rgba(255,255,255,.55);

  position:relative;
  z-index:2;

  animation:
    logoEntrance .9s cubic-bezier(.22,1,.36,1),
    logoFloat 4s ease-in-out 1s infinite;
}


/* =====================================================
   LOGIN BODY
===================================================== */

.login-body{
  padding:25px 28px 28px;
  color:#fff;

  position:relative;
}


/* =====================================================
   BRAND
===================================================== */

.brand{
  text-align:center;
  margin-bottom:25px;

  animation:
    brandIn .8s ease .25s both;
}

.brand h1{
  margin:0;

  font-size:25px;
  font-weight:800;

  letter-spacing:.3px;
}

.brand h1:after{
  content:"";

  display:block;

  width:45px;
  height:3px;

  border-radius:20px;

  background:var(--lime);

  margin:7px auto 0;

  animation:
    brandLine .7s ease .8s both;
}

.brand p{
  margin:7px 0 0;

  font-size:11px;

  opacity:.8;

  animation:
    subtitleIn .7s ease .45s both;
}


/* =====================================================
   ROLE SELECTOR
===================================================== */

.roles{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;

  background:#0738cf;

  padding:5px;

  border-radius:14px;

  margin-bottom:17px;

  animation:
    formIn .7s ease .4s both;
}

.role{
  border:0;

  border-radius:10px;

  padding:10px 5px;

  color:#b9c7ff;

  background:transparent;

  font-size:11px;

  font-weight:700;

  transition:
    background .25s ease,
    color .25s ease,
    transform .2s ease,
    box-shadow .25s ease;
}

.role:hover{
  transform:translateY(-1px);
  color:#fff;
}

.role:active{
  transform:scale(.97);
}

.role.active{
  background:#fff;

  color:var(--blue);

  box-shadow:
    0 5px 14px rgba(0,0,0,.10);
}


/* =====================================================
   LOGIN FIELD
===================================================== */

.field-label{
  display:block;

  font-size:11px;
  font-weight:700;

  margin:0 0 7px;

  animation:
    formIn .7s ease .5s both;
}

.input-wrap{
  position:relative;

  animation:
    formIn .7s ease .55s both;
}

.login-input{
  width:100%;
  height:54px;

  border:1px solid rgba(255,255,255,.10);

  background:#0a3cd4;

  color:white;

  border-radius:16px;

  padding:0 48px 0 16px;

  outline:0;

  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    background .25s ease,
    transform .2s ease;

  /*
   * Tidak menggunakan maxlength.
   * PIN boleh 3, 5, 6, 10 digit, dst.
   */
}

.login-input::placeholder{
  color:#b9c7ff;
}

.login-input:hover{
  background:#0b40df;
  border-color:rgba(255,255,255,.20);
}

.login-input:focus{
  border-color:rgba(255,255,255,.55);

  background:#0b40df;

  box-shadow:
    0 0 0 3px rgba(255,255,255,.10),
    0 10px 25px rgba(0,0,0,.08);

  transform:translateY(-1px);
}

.eye{
  position:absolute;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  border:0;

  background:transparent;

  color:rgba(255,255,255,.55);

  font-size:17px;

  transition:
    color .2s ease,
    transform .2s ease;
}

.eye:hover{
  color:#fff;

  transform:
    translateY(-50%)
    scale(1.08);
}


/* =====================================================
   REMEMBER
===================================================== */

.remember{
  display:flex;
  align-items:center;

  gap:8px;

  font-size:10px;

  margin:13px 2px 16px;

  color:#dbe3ff;

  animation:
    formIn .7s ease .6s both;
}

.remember input{
  accent-color:var(--lime);
}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-btn{
  width:100%;
  height:54px;

  border:0;

  border-radius:16px;

  background:var(--lime);

  color:#101828;

  font-weight:800;

  box-shadow:
    0 10px 25px rgba(0,0,0,.15);

  position:relative;

  overflow:hidden;

  transition:
    transform .2s ease,
    box-shadow .25s ease,
    filter .25s ease;

  animation:
    formIn .7s ease .65s both;
}

.login-btn:before{
  content:"";

  position:absolute;

  top:0;
  left:-120%;

  width:80%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.55),
      transparent
    );

  transform:skewX(-20deg);

  animation:
    buttonShine 3.5s ease-in-out 1.5s infinite;
}

.login-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 14px 30px rgba(0,0,0,.22);

  filter:brightness(1.03);
}

.login-btn:active{
  transform:scale(.98);
}

.login-btn:disabled{
  opacity:.6;
  cursor:wait;
}


/* =====================================================
   LOGIN HELP
===================================================== */

.login-help{
  text-align:center;

  font-size:10px;

  color:#dbe3ff;

  margin-top:18px;

  line-height:1.6;

  animation:
    fadeUp .7s ease .75s both;
}

.login-help b{
  color:#fff;
}

.footer{
  text-align:center;

  font-size:9px;

  color:rgba(255,255,255,.60);

  margin-top:22px;

  animation:
    fadeUp .7s ease .85s both;
}


/* =====================================================
   APP
===================================================== */

#app{
  min-height:100vh;

  background:
    radial-gradient(
      circle at 100% 0,
      rgba(11,68,238,.05),
      transparent 25%
    ),
    var(--bg);
}


/* =====================================================
   HEADER
===================================================== */

.header{
  position:sticky;

  top:0;

  z-index:20;

  background:
    linear-gradient(
      135deg,
      var(--blue2),
      var(--blue)
    );

  color:#fff;

  border-bottom:0;

  padding:13px 18px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  box-shadow:
    0 5px 20px rgba(11,68,238,.16);

  animation:
    headerIn .5s ease both;
}

.header-left{
  display:flex;

  align-items:center;

  gap:11px;
}

.header-logo{
  width:42px;
  height:42px;

  border-radius:12px;

  object-fit:cover;

  border:2px solid rgba(255,255,255,.35);

  box-shadow:
    0 5px 15px rgba(0,0,0,.15);

  animation:
    headerLogoFloat 4s ease-in-out infinite;
}

.header h1{
  font-size:15px;

  margin:0;

  font-weight:800;

  color:#fff;
}

.header small{
  font-size:9px;

  color:rgba(255,255,255,.72);
}


/* =====================================================
   LOGOUT
===================================================== */

.logout{
  border:1px solid rgba(255,255,255,.18);

  background:rgba(255,255,255,.10);

  color:#fff;

  padding:9px 12px;

  border-radius:11px;

  font-size:10px;

  font-weight:700;

  transition:
    background .2s ease,
    color .2s ease,
    transform .2s ease;
}

.logout:hover{
  background:var(--lime);

  color:#101828;

  transform:translateY(-1px);
}


/* =====================================================
   LAYOUT
===================================================== */

.layout{
  display:flex;

  max-width:1280px;

  margin:auto;

  min-height:
    calc(100vh - 69px);
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  width:235px;

  background:#fff;

  border-right:1px solid var(--line);

  padding:16px 12px;

  flex:none;

  box-shadow:
    3px 0 15px rgba(15,23,42,.025);
}

.nav-title{
  font-size:9px;

  color:#9ca3af;

  font-weight:800;

  margin:8px 10px 10px;
}

.nav{
  width:100%;

  border:0;

  background:transparent;

  text-align:left;

  padding:11px 12px;

  border-radius:12px;

  color:#4b5563;

  font-size:11px;

  font-weight:600;

  margin-bottom:4px;

  position:relative;

  transition:
    background .25s ease,
    color .25s ease,
    transform .2s ease;
}

.nav:hover{
  background:#f2f5ff;

  color:var(--blue);

  transform:translateX(2px);
}

.nav.active{
  background:
    linear-gradient(
      90deg,
      #e8efff,
      #f3f6ff
    );

  color:var(--blue);

  box-shadow:
    inset 3px 0 0 var(--blue);
}

.nav.active:after{
  content:"";

  position:absolute;

  right:9px;
  top:50%;

  width:5px;
  height:5px;

  border-radius:50%;

  background:var(--lime);

  transform:translateY(-50%);

  box-shadow:
    0 0 0 3px rgba(204,255,0,.18);
}

.nav span{
  margin-right:9px;
}


/* =====================================================
   CONTENT
===================================================== */

.content{
  padding:20px;

  flex:1;

  min-width:0;

  animation:
    contentIn .45s ease both;
}

.page-title{
  font-size:20px;

  font-weight:800;

  margin:0 0 4px;

  color:#15203a;
}

.page-sub{
  font-size:11px;

  color:var(--muted);

  margin:0 0 18px;
}


/* =====================================================
   GRID
===================================================== */

.grid{
  display:grid;

  gap:14px;
}

.stats{
  grid-template-columns:
    repeat(4,1fr);
}

.two{
  grid-template-columns:
    1fr 1fr;
}

.three{
  grid-template-columns:
    repeat(3,1fr);
}


/* =====================================================
   CARDS
===================================================== */

.card{
  background:#fff;

  border:1px solid var(--line);

  border-radius:18px;

  padding:17px;

  box-shadow:var(--shadow-sm);

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.card:hover{
  transform:translateY(-2px);

  box-shadow:var(--shadow);

  border-color:#dce4f8;
}


/* =====================================================
   STAT
===================================================== */

.stat{
  position:relative;

  overflow:hidden;
}

.stat:after{
  content:"";

  position:absolute;

  width:70px;
  height:70px;

  right:-30px;
  top:-30px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(11,68,238,.10),
      transparent 70%
    );
}

.stat .icon{
  font-size:20px;
}

.stat .num{
  font-size:25px;

  font-weight:800;

  margin-top:5px;

  color:var(--blue);
}

.stat .label{
  font-size:10px;

  color:var(--muted);
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
  display:flex;

  gap:9px;

  flex-wrap:wrap;

  margin-bottom:13px;
}

.search{
  height:42px;

  border:1px solid var(--line);

  border-radius:12px;

  padding:0 13px;

  outline:0;

  background:#fff;

  flex:1;

  min-width:180px;

  font-size:11px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.search:focus{
  border-color:#8aa6ff;

  box-shadow:
    0 0 0 3px #dbe5ff;
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{
  border:0;

  border-radius:11px;

  padding:10px 14px;

  font-size:10px;

  font-weight:700;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn:active{
  transform:scale(.97);
}

.btn-primary{
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue2)
    );

  color:#fff;

  box-shadow:
    0 6px 16px rgba(11,68,238,.18);
}

.btn-primary:hover{
  box-shadow:
    0 9px 22px rgba(11,68,238,.25);

  filter:brightness(1.04);
}

.btn-light{
  background:#eef2f7;

  color:#374151;
}

.btn-danger{
  background:#fee2e2;

  color:#b91c1c;
}

.btn-success{
  background:#dcfce7;

  color:#166534;
}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{
  overflow:auto;
}

.table{
  width:100%;

  border-collapse:collapse;

  font-size:10px;
}

.table th{
  background:#f8fafc;

  color:#64748b;

  text-align:left;

  padding:10px;

  white-space:nowrap;
}

.table td{
  padding:10px;

  border-top:1px solid #eef0f4;

  vertical-align:top;
}

.table tr{
  transition:
    background .2s ease;
}

.table tr:hover td{
  background:#fbfdff;
}


/* =====================================================
   BADGE
===================================================== */

.badge{
  display:inline-block;

  padding:4px 8px;

  border-radius:999px;

  font-size:8px;

  font-weight:700;

  background:#eef2ff;

  color:#3730a3;
}

.badge.green{
  background:#dcfce7;

  color:#166534;
}

.badge.red{
  background:#fee2e2;

  color:#b91c1c;
}

.badge.yellow{
  background:#fef3c7;

  color:#92400e;
}


/* =====================================================
   PROFILE
===================================================== */

.profile{
  display:flex;

  gap:15px;

  align-items:center;
}

.avatar{
  width:78px;
  height:78px;

  border-radius:20px;

  object-fit:cover;

  background:#eef2f7;

  border:1px solid #e5e7eb;
}

.profile h2{
  font-size:18px;

  margin:0 0 3px;
}

.profile p{
  margin:2px 0;

  font-size:10px;

  color:var(--muted);
}


/* =====================================================
   TIMELINE
===================================================== */

.timeline{
  border-left:2px solid #dbe4ff;

  margin:12px 0 0 8px;

  padding-left:17px;
}

.timeline-item{
  position:relative;

  margin-bottom:15px;
}

.timeline-item:before{
  content:"";

  position:absolute;

  left:-24px;

  top:4px;

  width:9px;
  height:9px;

  background:var(--blue);

  border-radius:50%;

  box-shadow:
    0 0 0 4px #eaf0ff;
}

.timeline-date{
  font-size:9px;

  color:#64748b;
}

.timeline-title{
  font-size:11px;

  font-weight:700;

  margin-top:2px;
}

.timeline-text{
  font-size:10px;

  color:#4b5563;

  line-height:1.6;

  margin-top:3px;
}


/* =====================================================
   FORM
===================================================== */

.form-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:11px;
}

.form-group{
  margin-bottom:11px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  display:block;

  font-size:9px;

  font-weight:700;

  color:#4b5563;

  margin-bottom:5px;
}

.form-control{
  width:100%;

  border:1px solid var(--line);

  border-radius:10px;

  padding:10px 11px;

  outline:0;

  background:#fff;

  font-size:10px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.form-control:focus{
  border-color:#8aa6ff;

  box-shadow:
    0 0 0 3px #dbe5ff;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;

  inset:0;

  background:rgba(15,23,42,.55);

  backdrop-filter:blur(5px);

  -webkit-backdrop-filter:blur(5px);

  z-index:50;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:18px;

  animation:
    modalBgIn .2s ease both;
}

.modal-box{
  width:min(100%,560px);

  max-height:90vh;

  overflow:auto;

  background:#fff;

  border-radius:20px;

  padding:19px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.20);

  animation:
    modalIn .35s cubic-bezier(.22,1,.36,1) both;
}

.modal-head{
  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:15px;
}

.modal-head h3{
  font-size:15px;

  margin:0;

  color:#172033;
}

.close{
  border:0;

  background:#f3f4f6;

  width:32px;
  height:32px;

  border-radius:9px;

  transition:
    background .2s ease,
    transform .2s ease;
}

.close:hover{
  background:#fee2e2;

  color:#b91c1c;

  transform:rotate(4deg);
}


/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  right:18px;
  bottom:18px;

  background:#111827;

  color:#fff;

  padding:12px 15px;

  border-radius:12px;

  font-size:10px;

  z-index:100;

  box-shadow:
    0 10px 30px rgba(0,0,0,.20);

  animation:
    toastIn .35s cubic-bezier(.22,1,.36,1) both;
}


/* =====================================================
   LOADING / EMPTY
===================================================== */

.loading{
  opacity:.65;

  pointer-events:none;
}

.empty{
  text-align:center;

  padding:30px;

  color:#9ca3af;

  font-size:11px;
}


/* =====================================================
   MOBILE NAV
===================================================== */

.mobile-nav{
  display:none;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes loginCardIn{

  from{
    opacity:0;
    transform:
      translateY(35px)
      scale(.96);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

<script>

/* =====================================================
   API
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwLcMsQe426UBd7FkRxLk3f8qDoUh4EEhnXzZfWrqav2UAirAW828XokZheQRHbedLZ/exec';


/* =====================================================
   STATE
===================================================== */

let state = {

  token:null,

  role:null,

  user:null,

  section:'home',

  students:[],

  selected:null

};


const $ =
  id => document.getElementById(id);


/* =====================================================
   ROLE
===================================================== */

function selectRole(role){

  document
    .querySelectorAll('.role')
    .forEach(function(btn){

      btn.classList.toggle(
        'active',
        btn.dataset.role === role
      );

    });


  $('credential').value='';

  $('credential').type='password';


  if(role === 'WALI'){

    $('credential').placeholder =
      'Masukkan PIN guru';

    $('credentialLabel').textContent =
      'PIN GURU';

    $('loginHelp').innerHTML =
      'PIN guru diverifikasi dari <b>UserAccount</b>.';

  }else{

    $('credential').placeholder =
      'Masukkan PIN atau NISN';

    $('credentialLabel').textContent =
      'PIN / NISN SISWA';

    $('loginHelp').innerHTML =
      'NISN atau PIN siswa diverifikasi dari <b>UserAccount</b>.';

  }

}


function currentRole(){

  const active =
    document.querySelector(
      '.role.active'
    );

  return active
    ? active.dataset.role
    : 'WALI';

}


function toggleEye(){

  $('credential').type =
    $('credential').type === 'password'
      ? 'text'
      : 'password';

}


/* =====================================================
   SESSION BROWSER
===================================================== */

const SESSION_KEY =
  'waliSiswaSession';


function saveSession(){

  if(!state.token || !state.role){
    return;
  }


  const data =
    JSON.stringify({

      token:state.token,

      role:state.role,

      user:state.user

    });


  try{

    if($('remember').checked){

      localStorage.setItem(
        SESSION_KEY,
        data
      );

      sessionStorage.removeItem(
        SESSION_KEY
      );

    }else{

      sessionStorage.setItem(
        SESSION_KEY,
        data
      );

      localStorage.removeItem(
        SESSION_KEY
      );

    }

  }catch(err){

    try{

      localStorage.setItem(
        SESSION_KEY,
        data
      );

    }catch(ignore){}

  }

}


function loadSession(){

  const stores = [
    localStorage,
    sessionStorage
  ];


  for(
    const store of stores
  ){

    try{

      const raw =
        store.getItem(
          SESSION_KEY
        );


      if(!raw){
        continue;
      }


      const parsed =
        JSON.parse(raw);


      if(
        parsed &&
        parsed.token &&
        parsed.role
      ){

        return parsed;

      }

    }catch(err){}

  }


  return null;

}


function clearSession(){

  try{

    localStorage.removeItem(
      SESSION_KEY
    );

  }catch(err){}


  try{

    sessionStorage.removeItem(
      SESSION_KEY
    );

  }catch(err){}

}


/* =====================================================
   API REQUEST
===================================================== */

async function api(
  action,
  data={}
){

  if(
    !API_URL ||
    API_URL.includes(
      'PASTE_URL'
    )
  ){

    throw new Error(
      'URL Web App GAS belum benar.'
    );

  }


  const response =
    await fetch(
      API_URL,
      {
        method:'POST',

        body:JSON.stringify(
          Object.assign(
            {action},
            data
          )
        )
      }
    );


  if(!response.ok){

    throw new Error(
      'Server GAS tidak merespons. HTTP ' +
      response.status
    );

  }


  const json =
    await response.json();


  if(!json.success){

    throw new Error(
      json.error ||
      'Terjadi kesalahan pada server.'
    );

  }


  return json;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const credential =
    $('credential').value.trim();

  const role =
    currentRole();


  if(!credential){

    toast(
      'Masukkan PIN/NISN terlebih dahulu.',
      true
    );

    return;

  }


  const btn =
    $('loginBtn');


  btn.disabled=true;

  btn.textContent=
    'MEMERIKSA...';


  try{

    const result =
      await api(
        'login',
        {
          role:role,

          credential:credential
        }
      );


    state = {

      token:
        result.token,

      role:
        result.role,

      user:
        result.user,

      section:'home',

      students:[],

      selected:null

    };


    saveSession();


    showApp();


    await render();


    toast(
      'Login berhasil. Selamat datang, ' +
      (
        result.user?.NAMA ||
        ''
      )
    );


  }catch(err){

    toast(
      err.message ||
      'Login gagal.',
      true
    );


  }finally{

    btn.disabled=false;

    btn.textContent='MASUK';

  }

}


/* =====================================================
   AUTO LOGIN
===================================================== */

async function tryAutoLogin(){

  const saved =
    loadSession();


  if(
    !saved ||
    !saved.token ||
    !saved.role
  ){

    return;

  }


  state = {

    token:
      saved.token,

    role:
      saved.role,

    user:
      saved.user || null,

    section:
      saved.section || 'home',

    students:[],

    selected:null

  };


  showApp();


  try{

    await render();

  }catch(err){

    console.warn(
      'Render awal gagal:',
      err
    );

  }


  try{

    const result =
      await api(
        'validateSession',
        {
          token:saved.token
        }
      );


    if(result.valid){

      state.role =
        result.role ||
        state.role;


      if(result.user){

        state.user =
          Object.assign(
            {},
            state.user || {},
            result.user
          );

      }


      saveSession();


      try{

        await render();

      }catch(err){}

    }else{

      console.warn(
        'Server belum mengenali token. Sesi lokal tetap disimpan.'
      );

    }

  }catch(err){

    console.warn(
      'Validasi server gagal sementara.',
      err
    );

  }

}


/* =====================================================
   SHOW APP
===================================================== */

function showApp(){

  $('loginScreen')
    .classList
    .add('hidden');


  $('app')
    .classList
    .remove('hidden');


  $('headerUser').textContent =
    state.user?.NAMA ||
    '';

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  const token =
    state.token;


  try{

    if(token){

      await api(
        'logout',
        {
          token:token
        }
      );

    }

  }catch(err){

    console.warn(
      'Logout server gagal:',
      err
    );

  }


  clearSession();


  state = {

    token:null,

    role:null,

    user:null,

    section:'home',

    students:[],

    selected:null

  };


  location.reload();

}


/* =====================================================
   NAVIGATION
===================================================== */

function navItems(){

  if(
    state.role === 'WALI'
  ){

    return [

      ['home','🏠','Dashboard'],

      ['students','👥','Data Siswa'],

      ['timeline','🕘','Riwayat 7–9'],

      ['notes','📝','Catatan'],

      ['targets','🎯','Target']

    ];

  }


  return [

    ['home','🏠','Beranda'],

    ['timeline','🕘','Perjalanan 7–9'],

    ['notes','📝','Catatan'],

    ['targets','🎯','Target'],

    ['messages','💬','Pesan Wali']

  ];

}


function renderNav(){

  const items =
    navItems();


  $('sidebar').innerHTML =
    '<div class="nav-title">MENU UTAMA</div>' +

    items.map(function(item){

      return `
        <button
          class="nav ${
            state.section === item[0]
              ? 'active'
              : ''
          }"
          onclick="go('${item[0]}')">

          <span>${item[1]}</span>

          ${item[2]}

        </button>
      `;

    }).join('');


  $('mobileNav').innerHTML =
    items
      .slice(0,5)
      .map(function(item){

        return `
          <button
            class="${
              state.section === item[0]
                ? 'active'
                : ''
            }"
            onclick="go('${item[0]}')">

            <span>${item[1]}</span>

            ${item[2]}

          </button>
        `;

      })
      .join('');

}


async function go(section){

  state.section =
    section;


  saveSession();


  await render();

}


async function render(){

  renderNav();


  if(
    state.role === 'WALI'
  ){

    if(
      state.section === 'home'
    ){
      return renderTeacherHome();
    }

    if(
      state.section === 'students'
    ){
      return renderStudents();
    }

    if(
      state.section === 'timeline'
    ){
      return renderTimeline();
    }

    if(
      state.section === 'notes'
    ){
      return renderNotes();
    }

    if(
      state.section === 'targets'
    ){
      return renderTargets();
    }

  }else{

    if(
      state.section === 'home'
    ){
      return renderStudentHome();
    }

    if(
      state.section === 'timeline'
    ){
      return renderStudentTimeline();
    }

    if(
      state.section === 'notes'
    ){
      return renderStudentNotes();
    }

    if(
      state.section === 'targets'
    ){
      return renderStudentTargets();
    }

    if(
      state.section === 'messages'
    ){
      return renderStudentMessages();
    }

  }

}


/* =====================================================
   HELPERS
===================================================== */

function esc(v){

  return String(
    v ?? ''
  ).replace(
    /[&<>"']/g,
    function(m){

      return {

        '&':'&amp;',

        '<':'&lt;',

        '>':'&gt;',

        '"':'&quot;',

        "'":'&#039;'

      }[m];

    }
  );

}


function date(v){

  if(!v){
    return '-';
  }


  const d =
    new Date(v);


  if(
    isNaN(d)
  ){

    return esc(v);

  }


  return d.toLocaleDateString(
    'id-ID',
    {
      day:'2-digit',
      month:'short',
      year:'numeric'
    }
  );

}


function toast(
  msg,
  error=false
){

  const t =
    $('toast');


  t.textContent =
    msg;


  t.style.background =
    error
      ? '#b91c1c'
      : '#111827';


  t.classList.remove(
    'hidden'
  );


  clearTimeout(
    window.__toast
  );


  window.__toast =
    setTimeout(
      function(){

        t.classList.add(
          'hidden'
        );

      },
      3000
    );

}


function openModal(html){

  $('modalBox').innerHTML =
    html;

  $('modal')
    .classList
    .remove('hidden');

}


function closeModal(){

  $('modal')
    .classList
    .add('hidden');

}


function stat(
  icon,
  num,
  label
){

  return `
    <div class="card stat">

      <div class="icon">
        ${icon}
      </div>

      <div class="num">
        ${num}
      </div>

      <div class="label">
        ${label}
      </div>

    </div>
  `;

}


/* =====================================================
   TEACHER DASHBOARD
===================================================== */

  $('content').innerHTML = `

    <h2 class="page-title">
      Dashboard

    <p class="page-sub">
      Pantauan singkat perkembangan siswa
      yang Bapak/Ibu dampingi.
    </p>

    <div id="dash">

      <div class="empty">
        Memuat data...
      </div>

    </div>
  `;


  try{

    const r =
      await api(
        'dashboard',
        {
          token:state.token
        }
      );


    $('dash').innerHTML = `

      <div class="grid stats">

        ${stat(
          '👥',
          r.stats.siswa,
          'Siswa aktif'
        )}

        ${stat(
          '📝',
          r.stats.catatan,
          'Total catatan'
        )}

        ${stat(
          '🎯',
          r.stats.targetAktif,

      </div>


      <div
        class="grid two"

        <div class="card">

          <b style="font-size:12px">
            Catatan terbaru
          </b>

          ${
            r.recentNotes.length

              ? r.recentNotes
                  .slice(0,5)
                  .map(function(n){

                    return `
                      <div class="timeline">

                        <div class="timeline-item">

                          <div class="timeline-date">
                            ${date(n.TANGGAL)}
                            •
                            ${esc(n.JENIS)}
                          </div>

                          <div class="timeline-title">
                            ${esc(
                              n.TOPIK ||
                              'Catatan wali'
                            )}
                          </div>

                          <div class="timeline-text">
                            ${esc(
                              n.CATATAN_SISWA ||
                              n.CATATAN_INTERNAL ||
                              ''
                            )}
                          </div>

                        </div>

                      </div>
                    `;

                  })
                  .join('')

              : `

                <div class="empty">
                  Belum ada catatan.
                </div>

              `
          }

        </div>


        <div class="card">

          <b style="font-size:12px">
            Prinsip pencatatan
          </b>

          <div
            style="
              font-size:10px;

async function renderNotes(){

      Semua catatan wali yang tersimpan

        class="table-wrap">

        <div class="empty">
          Memuat...
        </div>

      </div>

    </div>

  `;


  try{

    const r =
      await api(
        'students',
        {
          token:state.token
        }
      );


    const all = [];


    for(
      const s of (r.data || [])
    ){

      const profile =
        await api(
          'studentProfile',
          {
            token:state.token,

            siswaId:

      (profile.catatan || [])
        .forEach(function(n){

          all.push(
            Object.assign(
              {

                  s.NAMA

              n
            )
          );

        });

    }


    all.sort(
      function(a,b){

        return (
          new Date(
            b.TANGGAL || 0
          ) -
          new Date(
            a.TANGGAL || 0
          )
        );

      }
    );


    $('notesTable').innerHTML =
      all.length

                  <tr>

                    <td>

                    <td>

function historyHTML(arr){

  return arr.length

    ? arr
        .map(function(x){

          return `

            <div class="timeline">

              <div class="timeline-item">

                <div class="timeline-date">

                  ${esc(
                    x.TAHUN_AJARAN
                  )}

                  •

                  Kelas
                  ${esc(
                    x.TINGKAT
                  )}

                </div>


                <div class="timeline-title">

                  ${esc(
                    x.ROMBEL ||
                    '-'
                  )}

                </div>


                <div class="timeline-text">

                  Wali kelas:
                  ${esc(
                    x.WALI_KELAS ||
                    '-'
                  )}

                </div>

              </div>

            </div>

          `;

        })
        .join('')

    : `

      <div class="empty">
        Riwayat belum tersedia.
      </div>

    `;

}

async function readMessage(id){

  try{

    await api(
      'markMessageRead',
      {
        token:state.token,

        pesanId:id
      }
    );


    toast(
      'Pesan ditandai sudah dibaca.'
    );


    await renderStudentMessages();

  }catch(err){

    toast(
      err.message,
      true
    );

  }

}
