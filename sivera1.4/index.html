<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Verifikasi Antrean - SIVERA V 1.3</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    
    /* Animasi Ticker Looping */
    @keyframes scrollVertical {
      0% { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }
    .ticker-loop {
      display: inline-block;
      animation: scrollVertical 15s linear infinite;
    }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-800 font-sans min-h-screen flex flex-col justify-between select-none">

  <header class="bg-blue-900 border-b-4 border-amber-400 p-4 shadow-md">
    <div class="container mx-auto max-w-md flex items-center gap-3.5 px-1">
      <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" alt="Logo" class="w-14 h-14 object-contain shrink-0 bg-white p-1 rounded-full shadow-sm">
      <div class="leading-tight">
        <h1 class="text-sm font-black text-white tracking-wide uppercase">SMP Negeri 1 Moga</h1>
        <p class="text-[10px] text-zinc-200 font-bold">Jl. Simpang Tiga Banyumudal, Kec. Moga</p>
        <a href="https://smpn1moga.sch.id" target="_blank" class="text-[10px] text-amber-400 font-black hover:underline hover:text-amber-300">smpn1moga.sch.id</a>
      </div>
    </div>
  </header>

  <main class="container mx-auto p-4 flex-grow max-w-md flex flex-col justify-center">
    
    <div id="broadcastBox" class="hidden bg-amber-50 border-2 border-amber-400 p-4 rounded-xl mb-3 shadow-sm flex items-start gap-3 animate-fade-in">
      <img src="https://yanuar-moga.github.io/app/sivera1.3/assets/info.png" alt="Info" class="w-8 h-8 object-contain mt-0.5 shrink-0">
      <div id="broadcastContent" class="w-full">
        <h4 class="font-black text-xs text-blue-950 uppercase tracking-wider">Pengumuman:</h4>
        <div id="broadcastBody" class="text-xs text-zinc-700 mt-0.5 leading-relaxed"></div>
      </div>
    </div>

    <div class="bg-blue-900 text-white px-4 rounded-xl mb-4 border border-blue-950 shadow-md h-12 flex items-center overflow-hidden">
      <div id="tickerContainer" class="w-full h-full text-[11px] font-bold text-center tracking-wide overflow-hidden relative">
        <div id="tickerTrack" class="ticker-loop pt-3">Memuat informasi antrean...</div>
      </div>
    </div>

    <div id="customAlert" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"></div>
    <div id="aboutModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"></div>
    <div id="formSection" class="bg-white rounded-2xl p-5 shadow-xl border border-zinc-200 animate-fade-in">
      </div>
    <div id="ticketSection" class="hidden space-y-4 animate-fade-in">
      </div>

  </main>

  <footer onclick="openAboutModal()" class="text-center p-3.5 bg-zinc-200 hover:bg-zinc-300 cursor-pointer transition text-zinc-600 text-[10px] font-black tracking-widest uppercase border-t border-zinc-300">
    Aplikasi Sivera V 1.3
  </footer>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbwRDED9xCDivI4IFOLUmWY2bVaVMf5cMC4Bc-5c4bpyMQJJHT9pxBsoIHf_Zqg3o_rp/exec";

    // Fungsi Broadcast Baru
    function loadBroadcast() {
      fetch(API_URL + "?action=getBroadcast")
        .then(res => res.json())
        .then(data => {
          if (data.message && data.message.trim() !== "") {
            const body = document.getElementById('broadcastBody');
            const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(data.message.trim());
            body.innerHTML = isImg ? `<img src="${data.message}" class="rounded-lg shadow-sm border mt-2">` : data.message;
            document.getElementById('broadcastBox').classList.remove('hidden');
          }
        });
    }

    // Fungsi Ticker Baru (Looping Vertikal)
    function loadTickers() {
      fetch(API_URL + "?action=getTickers")
        .then(res => res.json())
        .then(data => {
          if (data.tickers) {
            document.getElementById('tickerTrack').innerHTML = data.tickers.join(" &nbsp;&nbsp;&bull;&nbsp;&nbsp; ");
          }
        });
    }

    window.onload = function() {
      loadBroadcast();
      loadTickers();
      // ... (tambahkan sisa fungsi original Anda di sini)
    };

    // (Masukkan fungsi submitForm, cariTiket, downloadTiket, dsb di sini)
  </script>
</body>
</html>
