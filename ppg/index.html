<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPG Learning Hub</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    display: flex;
    justify-content: center;
}

/* WRAPPER */
.wrapper {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 2rem;
    font-weight: bold;
    background: linear-gradient(90deg, #38bdf8, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.header p {
    font-size: 0.9rem;
    color: #94a3b8;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    padding: 18px;
    border-radius: 18px;
    margin-bottom: 18px;
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    transition: 0.3s;
    box-shadow: 0 0 0 rgba(0,0,0,0);
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 25px rgba(99,102,241,0.3);
}

/* TITLE */
.card h3 {
    margin-bottom: 5px;
}

/* TEXT */
.card p {
    font-size: 0.85rem;
    color: #cbd5f5;
}

/* BUTTON */
.button {
    display: block;
    text-align: center;
    padding: 11px;
    border-radius: 12px;
    background: linear-gradient(90deg, #6366f1, #38bdf8);
    text-decoration: none;
    color: white;
    margin-top: 12px;
    font-weight: 500;
    transition: 0.3s;
}

.button:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 20px rgba(56,189,248,0.4);
}

/* SUBMENU */
.submenu {
    margin-top: 12px;
}

.submenu a {
    display: block;
    background: rgba(255,255,255,0.03);
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 8px;
    text-decoration: none;
    color: #cbd5f5;
    font-size: 0.85rem;
    transition: 0.3s;
    border: 1px solid transparent;
}

.submenu a:hover {
    background: rgba(99,102,241,0.2);
    color: white;
    border: 1px solid rgba(99,102,241,0.4);
    transform: translateX(5px);
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 0.75rem;
    color: #64748b;
}
</style>

</head>

<body>

<div class="wrapper">

    <div class="header">
        <h1>PPG Learning Hub</h1>
        <p>Belajar Fokus & Terarah</p>
    </div>

    <!-- UJIAN PENGETAHUAN -->
    <div class="card">
        <h3>📝 Ujian Pengetahuan</h3>
        <p>Latihan soal untuk persiapan ujian PPG.</p>
        <a href="https://yanuar-moga.github.io/app/ppg/up/latihan_soal.html" class="button">Mulai Latihan</a>
    </div>

    <!-- STUDI KASUS -->
    <div class="card">
        <h3>📄 Studi Kasus</h3>
        <p>Contoh Study Kasus PPG.</p>

        <div class="submenu">
            <a href="https://yanuar-moga.github.io/app/ppg/studykasus/media_pembelajaran">1. Masalah Media Pembelajaran</a>
            <a href="https://yanuar-moga.github.io/app/ppg/studykasus/lkpd">2. Masalah LKPD</a>
            <a href="https://yanuar-moga.github.io/app/ppg/studykasus/masalah_pembelajaran">3. Masalah Strategi Pembelajaran</a>
            <a href="https://yanuar-moga.github.io/app/ppg/studykasus/penilaian_pembelajaran">4. Masalah Penilaian Pembelajaran</a>
        </div>
    </div>

    <div class="footer">
        © 2026 PPG Learning Hub
    </div>

</div>

</body>
</html>
