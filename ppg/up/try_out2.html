<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Try Out UP PPG</title>

<style>
body{
  font-family:'Segoe UI', sans-serif;
  background:#f1f5f9;
  margin:0;
}

.container{
  max-width:900px;
  width:95%;
  margin:auto;
  margin-top:20px;
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.userBox{
  text-align:center;
  min-width:160px;
}

.status{
  font-size:13px;
  margin-top:4px;
  display:none;
}

#btnLogout{
  margin-top:6px;
  background:#ef4444;
  display:none;
}

.logo{
  display:block;
  margin:auto;
  width:90px;
  margin-bottom:10px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

.loginBox{
  max-width:320px;
  margin:auto;
}

.inputBox,select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:4px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  width:100%;
}

#nomor{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(36px,1fr));
  gap:6px;
  margin-top:15px;
}

#nomor span{
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e2e8f0;
  border-radius:8px;
  cursor:pointer;
}

.dijawab{
  background:#22c55e!important;
  color:white;
}

#progressBox{
  height:8px;
  background:#e5e7eb;
  border-radius:10px;
  margin-top:10px;
}

#progressBar{
  height:8px;
  width:0%;
  background:#2563eb;
  border-radius:10px;
}

.soalCard{
  background:#f8fafc;
  border-radius:14px;
  padding:16px;
  margin-top:15px;
}

.opsi{
  padding:10px;
  border:1px solid #e2e8f0;
  margin-top:6px;
  border-radius:8px;
  cursor:pointer;
}

.opsi.aktif{
  background:#eff6ff;
  border-color:#2563eb;
}

.navBtn{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
}

.navBtn button{
  width:auto;
  padding:10px 18px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div></div>
<div class="userBox">
<div id="userInfo"></div>
<button id="btnLogout" onclick="logout()">Logout</button>
</div>
</div>

<img class="logo" src="https://yanuar-moga.github.io/app/ppg/up/assets/logo.png">

<h2>CBT Try Out UP PPG</h2>

<div id="login" class="loginBox">
<label>Kelas</label>
<select id="kelas"></select>

<label>Nama</label>
<select id="nama"></select>

<label>Password</label>
<input type="password" id="password" class="inputBox">

<div id="tokenBox" style="display:none;">
<label>Token</label>
<input type="text" id="token" class="inputBox">
</div>

<br>
<button onclick="login()">Login</button>
</div>

<div id="ujian" style="display:none">
<div id="timer"></div>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<div id="nomor"></div>
<div id="soal"></div>

<div class="navBtn">
<button onclick="prev()">Prev</button>
<button id="btnNext" onclick="next()">Next</button>
</div>
</div>

</div>

<script>
var URL_SCRIPT="PASTE_URL_GAS_KAMU";

var soal=[],jawaban=[],no=0;
var nama="",kelas="",level="Full Akses";
var waktu=0,timerInterval=null;

function gas(func,data,callback){
  fetch(URL_SCRIPT,{
    method:"POST",
    body:JSON.stringify({func:func,data:data})
  })
  .then(res=>res.json())
  .then(callback)
  .catch(err=>{
    alert("Gagal konek GAS");
    console.log(err);
  });
}

function cekKelas(){
  var k=document.getElementById("kelas").value.toLowerCase();
  document.getElementById("tokenBox").style.display =
    k==="free" ? "block" : "none";
}

function login(){
  nama=document.getElementById("nama").value;
  kelas=document.getElementById("kelas").value;
  var password=document.getElementById("password").value;
  var token=document.getElementById("token").value;

  gas("login",{nama,password,kelas,token},function(res){

    if(res.status==="ok"){

      level = (res.level || "Full Akses")
              .replace(/full akses/i,"Full Akses");

      localStorage.setItem("nama",nama);
      localStorage.setItem("kelas",kelas);
      localStorage.setItem("level",level);

      document.getElementById("login").style.display="none";
      document.getElementById("ujian").style.display="block";

      document.getElementById("userInfo").innerHTML=
      "👤 "+nama+" | "+kelas+" | "+level;

      document.getElementById("btnLogout").style.display="block";

      loadSoal();

    }else{
      alert(res.pesan || "Login gagal");
    }
  });
}

function loadKelas(){
  gas("getKelas",{},function(data){
    var k=document.getElementById("kelas");
    k.innerHTML="<option>Pilih Kelas</option>";

    data.forEach(x=>{
      k.innerHTML+=`<option value="${x}">${x}</option>`;
    });
  });
}

function loadNama(){
  kelas=document.getElementById("kelas").value;

  gas("getNama",{kelas},function(data){
    var n=document.getElementById("nama");
    n.innerHTML="<option>Pilih Nama</option>";

    data.forEach(x=>{
      n.innerHTML+=`<option value="${x}">${x}</option>`;
    });
  });
}

function loadSoal(){
  gas("getSoal",{},function(data){

    if(!data || data.length===0){
      alert("Soal tidak ditemukan!");
      return;
    }

    if(level.toLowerCase().includes("free")){
      soal=data.slice(0,10);
    }else{
      soal=data;
    }

    waktu=soal.length*90;
    jawaban=new Array(soal.length).fill("");
    no=0;

    renderNomor();
    tampil();
    timer();
  });
}

function renderNomor(){
  var html="";
  soal.forEach((s,i)=>{
    html+=`<span id="n${i}" onclick="goto(${i})">${i+1}</span>`;
  });
  document.getElementById("nomor").innerHTML=html;
}

function tampil(){
  var s=soal[no];
  if(!s) return;

  var html=`<div class="soalCard">
  <b>${no+1}. ${s.pertanyaan}</b>`;

  s.opsi.forEach(o=>{
    html+=`
    <div class="opsi ${jawaban[no]===o.key?'aktif':''}"
    onclick="jawab('${o.key}',this)">
    ${o.key}. ${o.text}
    </div>`;
  });

  html+="</div>";

  document.getElementById("soal").innerHTML=html;
  updateProgress();
  updateNavButton();
}

function jawab(v){
  jawaban[no]=v;
  document.getElementById("n"+no).classList.add("dijawab");
  tampil();
}

function updateProgress(){
  var j=jawaban.filter(x=>x!=="").length;
  document.getElementById("progressBar").style.width=
  (j/soal.length*100)+"%";
}

function updateNavButton(){
  var btn=document.getElementById("btnNext");

  if(no===soal.length-1){
    btn.innerHTML="Selesai";
    btn.onclick=kirim;
  }else{
    btn.innerHTML="Next";
    btn.onclick=next;
  }
}

function next(){ if(no<soal.length-1){ no++; tampil(); } }
function prev(){ if(no>0){ no--; tampil(); } }
function goto(n){ no=n; tampil(); }

function kirim(){
  clearInterval(timerInterval);

  gas("submitJawaban",{jawaban,nama,kelas},function(nilai){
    alert("Nilai: "+nilai);
  });
}

function timer(){
  timerInterval=setInterval(()=>{
    waktu--;
    var m=Math.floor(waktu/60);
    var d=waktu%60;
    if(d<10)d="0"+d;

    document.getElementById("timer").innerHTML="⏱️ "+m+":"+d;

    if(waktu<=0) kirim();
  },1000);
}

function logout(){
  localStorage.clear();
  location.reload();
}

window.onload=function(){
  loadKelas();

  var n=localStorage.getItem("nama");
  var k=localStorage.getItem("kelas");
  var l=localStorage.getItem("level");

  if(n && k){
    nama=n;
    kelas=k;
    level=(l || "Full Akses").replace(/full akses/i,"Full Akses");

    document.getElementById("login").style.display="none";
    document.getElementById("ujian").style.display="block";

    document.getElementById("userInfo").innerHTML=
    "👤 "+nama+" | "+kelas+" | "+level;

    document.getElementById("btnLogout").style.display="block";

    loadSoal();
  }
}

document.getElementById("kelas").addEventListener("change",function(){
  loadNama();
  cekKelas();
});
</script>

</body>
</html>
