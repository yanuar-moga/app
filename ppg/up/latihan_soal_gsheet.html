<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CBT ANBK REAL</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Arial;margin:0;background:#f1f5f9;color:#0f172a}
.container{max-width:900px;margin:auto;padding:12px}

/* HEADER ANBK */
.header{position:sticky;top:0;background:#1d4ed8;color:white;padding:10px;border-radius:0 0 12px 12px;z-index:10}
.header h1{margin:0;font-size:16px;text-align:center}
.timer{text-align:center;font-weight:bold;margin-top:4px}

.progress{height:6px;background:#cbd5f5;border-radius:10px;margin-top:6px;overflow:hidden}
.bar{height:100%;background:#22c55e;width:0%}

.nomor-nav{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0}
.nomor-nav button{width:36px;height:36px;border-radius:6px;border:none;background:#e2e8f0}
.nomor-nav button.aktif{background:#1d4ed8;color:white}
.nomor-nav button.sudah{background:#22c55e;color:white}

.soal{display:none;background:white;padding:14px;border-radius:12px}
.soal.active{display:block}

.opsi input{display:none}
.opsi label{display:flex;gap:10px;margin:8px 0;padding:10px;border-radius:10px;border:2px solid #e2e8f0;cursor:pointer}
.opsi span{
  min-width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e2e8f0;
  border-radius:6px;
  font-weight:bold;
  border:2px solid #94a3b8;
  transition:0.2s;
}

/* HILANGKAN TITIK RADIO (VERSI CUSTOM CLEAN) */
.opsi span::after{display:none;}
.opsi span::after{content:'';width:10px;height:10px;background:black;border-radius:50%;position:absolute;opacity:0;transition:0.2s}
.opsi input:checked + span::after{opacity:1}
.opsi input:checked + span{border-color:#1d4ed8}
.opsi label:has(input:checked){border-color:#1d4ed8;background:#eff6ff}
.opsi p{margin:0;flex:1}

.nav{display:flex;justify-content:space-between;margin-top:10px}
button{padding:10px;border:none;border-radius:8px;background:#1d4ed8;color:white}

.hasil{text-align:center;background:white;padding:20px;border-radius:12px;margin-top:20px}

@media(max-width:600px){
.container{padding:8px}
.nomor-nav button{width:30px;height:30px}
}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>CBT ANBK</h1>
<div class="timer">Sisa Waktu: <span id="time">--:--</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>

<div id="login">
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="ujian" style="display:none">
<div class="nomor-nav" id="nomorNav"></div>
<form id="quizForm"></form>
<div class="nav">
<button onclick="prevSoal()">Prev</button>
<button onclick="nextSoal()">Next</button>
</div>
</div>

<div id="hasil" class="hasil" style="display:none"></div>
</div>

<script>
let data=[];let current=0;let jawaban=[];
let usernameSiswa='';let kelasSiswa='';
let waktu=600;let timer;

const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzxZLHU0PbEbMyJKMxEeYrVBbQmtmsgdHCV_xnRNgSCe8xVs65zCVY3N6NFRnWeLg18/exec';
const form=document.getElementById('quizForm');

/* ANTI CURANG */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('copy',e=>e.preventDefault());
window.onbeforeunload=()=>"Ujian sedang berlangsung";

document.addEventListener('visibilitychange',()=>{
if(document.hidden){alert('Jangan pindah tab!');}
});

function login(){
fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({type:'login',username:username.value,password:password.value})})
.then(r=>r.json()).then(r=>{
if(r.status==='success'){usernameSiswa=username.value;kelasSiswa=r.kelas;mulai();}
else alert('Login gagal');});}

function mulai(){
fetch(SCRIPT_URL).then(r=>r.json()).then(r=>{
data=r;login.style.display='none';ujian.style.display='block';render();buatNav();show();startTimer();fullscreen();});}

function render(){
form.innerHTML='';
data.forEach((d,i)=>{
let div=document.createElement('div');
div.className='soal'+(i==0?' active':'');
div.innerHTML=`<p><b>${i+1}.</b> ${d.q}</p>
<div class='opsi'>${d.o.map((o,j)=>`
<label>
<input type='radio' name='q${i}' value='${j}'>
<span></span>
<p><b>${String.fromCharCode(65+j)}.</b> ${o}</p>
</label>`).join('')}</div>`;
form.appendChild(div);
});}

function buatNav(){
let nav=nomorNav;nav.innerHTML='';
data.forEach((_,i)=>{
let b=document.createElement('button');b.innerText=i+1;
b.onclick=()=>{current=i;show()};nav.appendChild(b);});}

function updateNav(){
document.querySelectorAll('.nomor-nav button').forEach((b,i)=>{
b.classList.remove('aktif','sudah');
if(i===current)b.classList.add('aktif');
if(jawaban[i]!=null)b.classList.add('sudah');});}

function show(){
document.querySelectorAll('.soal').forEach((s,i)=>s.classList.toggle('active',i===current));
bar.style.width=((current+1)/data.length*100)+'%';updateNav();}

form.addEventListener('change',e=>{jawaban[current]=parseInt(e.target.value);updateNav();});

function nextSoal(){if(current<data.length-1){current++;show()}else submitQuiz();}
function prevSoal(){if(current>0){current--;show()}}

function startTimer(){timer=setInterval(()=>{
waktu--;let m=Math.floor(waktu/60),s=waktu%60;
time.innerText=`${m}:${s<10?'0'+s:s}`;
if(waktu<=0){clearInterval(timer);submitQuiz();}},1000);}

function submitQuiz(){
clearInterval(timer);
let kosong=jawaban.includes(undefined);
if(kosong && !confirm('Masih ada soal kosong, lanjut?'))return;
let benar=0;data.forEach((d,i)=>{if(jawaban[i]==d.a)benar++});
let nilai=Math.round((benar/data.length)*100);
fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({type:'nilai',username:usernameSiswa,kelas:kelasSiswa,nilai})});
ujian.style.display='none';hasil.style.display='block';
hasil.innerHTML=`<h2>${usernameSiswa}</h2><h3>${kelasSiswa}</h3><h1>${nilai}</h1>
<button onclick='location.reload()'>Ulangi</button><br><br>
<a href='https://yanuar-moga.github.io/app/ppg/'><button>Home</button></a>`;
}

function fullscreen(){
let el=document.documentElement;
if(el.requestFullscreen){el.requestFullscreen();}
}
</script>
</body>
</html>
