<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATIHAN SOAL UP PPG</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#0f172a;color:white;margin:0}
.container{max-width:900px;margin:auto;padding:16px}
h1{text-align:center}

input{padding:10px;border-radius:8px;border:none;width:100%;margin:5px 0}
.start{background:#22c55e;padding:12px;border:none;border-radius:10px;width:100%;cursor:pointer;color:white}

.timer{text-align:center;color:#facc15;margin-bottom:10px;font-size:18px}
.progress{height:8px;background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;background:#22c55e;width:0%}

.nomor-nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.nomor-nav button{width:40px;height:40px;border:none;border-radius:8px;background:#334155;color:white}
.nomor-nav .aktif{background:#22c55e}
.nomor-nav .sudah{background:#0ea5e9}

.soal{display:none;background:#1e293b;padding:16px;border-radius:12px}
.soal.active{display:block}

.opsi input{display:none}
.opsi label{
display:flex;gap:10px;margin:8px 0;padding:12px;
background:#334155;border-radius:10px;cursor:pointer;
border:2px solid transparent
}
.opsi label:hover{background:#475569}

.opsi .huruf{
width:30px;height:30px;border-radius:50%;
border:2px solid #64748b;
display:flex;align-items:center;justify-content:center;
font-weight:bold
}

.opsi input:checked + .huruf{
background:#22c55e;border-color:#22c55e
}

.opsi label.selected{
border:2px solid #22c55e;
background:#166534
}

.nav{display:flex;justify-content:space-between;margin-top:15px}
button{padding:12px;border:none;border-radius:10px;background:#22c55e;color:white;cursor:pointer}

.hasil{text-align:center;background:#334155;padding:20px;border-radius:12px}
</style>
</head>

<body>

<div class="container">
<h1>LATIHAN SOAL UP PPG</h1>

<div id="login">
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button class="start" onclick="login()">Login</button>
</div>

<div id="ujian" style="display:none">
<div class="timer">Sisa Waktu: <span id="time"></span></div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div class="nomor-nav" id="nav"></div>

<form id="form"></form>

<div class="nav">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>
</div>

<div id="hasil" class="hasil" style="display:none"></div>
</div>

<script>
const URL='https://script.google.com/macros/s/AKfycbzxZLHU0PbEbMyJKMxEeYrVBbQmtmsgdHCV_xnRNgSCe8xVs65zCVY3N6NFRnWeLg18/exec';

let data=[],i=0,jawaban=[],user='',kelas='',timer,waktu=600;

function login(){
fetch(URL,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
type:'login',
username:username.value,
password:password.value
})
})
.then(r=>r.json())
.then(r=>{
if(r.status==='success'){
user=username.value;
kelas=r.kelas;
start();
}else alert('Login gagal');
});
}

function start(){
fetch(URL)
.then(r=>r.json())
.then(r=>{
data=r;
login.style.display='none';
ujian.style.display='block';
render();
nav();
show();
timerStart();
});
}

function render(){
form.innerHTML='';
data.forEach((d,x)=>{
let div=document.createElement('div');
div.className='soal'+(x==0?' active':'');

div.innerHTML=`
<p><b>${x+1}.</b> ${d.q}</p>
<div class="opsi">
${d.o.map((o,y)=>`
<label onclick="pilih(${x},${y},this)">
<input type="radio" name="q${x}" value="${y}">
<div class="huruf">${String.fromCharCode(65+y)}</div>
<div>${o}</div>
</label>
`).join('')}
</div>`;
form.appendChild(div);
});
}

function pilih(x,y,el){
jawaban[x]=y;
el.parentElement.querySelectorAll('label').forEach(l=>l.classList.remove('selected'));
el.classList.add('selected');
updateNav();
}

function nav(){
nav.innerHTML='';
data.forEach((_,x)=>{
let b=document.createElement('button');
b.innerText=x+1;
b.onclick=()=>{i=x;show()};
nav.appendChild(b);
});
}

function updateNav(){
document.querySelectorAll('.nomor-nav button').forEach((b,x)=>{
b.classList.remove('aktif','sudah');
if(x==i)b.classList.add('aktif');
if(jawaban[x]!=null)b.classList.add('sudah');
});
}

function show(){
document.querySelectorAll('.soal').forEach((s,x)=>{
s.classList.toggle('active',x==i);
});
bar.style.width=((i+1)/data.length*100)+'%';
updateNav();
}

function next(){
if(i<data.length-1){i++;show()}else submit();
}
function prev(){
if(i>0){i--;show()}
}

function timerStart(){
timer=setInterval(()=>{
waktu--;
let m=Math.floor(waktu/60);
let s=waktu%60;
time.innerText=`${m}:${s<10?'0'+s:s}`;
if(waktu<=0){clearInterval(timer);submit();}
},1000);
}

function submit(){
clearInterval(timer);

let benar=0;
data.forEach((d,x)=>{if(jawaban[x]==d.a)benar++});
let nilai=Math.round((benar/data.length)*100);

fetch(URL,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
type:'nilai',
username:user,
kelas:kelas,
nilai:nilai
})
});

ujian.style.display='none';
hasil.style.display='block';

hasil.innerHTML=`
<h2>${user}</h2>
<h3>Kelas: ${kelas}</h3>
<h1>Nilai: ${nilai}</h1>
<button onclick="location.reload()">Ulangi</button>
`;
}
</script>

</body>
</html>
