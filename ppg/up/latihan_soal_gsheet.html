<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT ONLINE SEKOLAH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 100%;
      margin: 5px 0;
    }

    .start {
      background: #22c55e;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
    }

    .timer {
      text-align: center;
      color: #facc15;
      margin-bottom: 10px;
    }

    .progress {
      height: 8px;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .bar {
      height: 100%;
      background: #22c55e;
      width: 0%;
    }

    .soal {
      display: none;
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
    }

    .soal.active {
      display: block;
    }

    .opsi label {
      display: flex;
      gap: 10px;
      margin: 8px 0;
      padding: 10px;
      background: #334155;
      border-radius: 8px;
      cursor: pointer;
    }

    .opsi span {
      min-width: 22px;
      font-weight: bold;
    }

    .opsi p {
      margin: 0;
      flex: 1;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .hasil {
      text-align: center;
      background: #334155;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>CBT ONLINE</h1>

    <!-- LOGIN -->
    <div id="login">
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button class="start" onclick="login()">Login</button>
    </div>

    <!-- UJIAN -->
    <div id="ujian" style="display:none">
      <div class="timer">Sisa Waktu: <span id="time">10:00</span></div>
      <div class="progress">
        <div class="bar" id="bar"></div>
      </div>

      <form id="quizForm"></form>

      <div class="nav">
        <button onclick="prevSoal()">Sebelumnya</button>
        <button onclick="nextSoal()">Next</button>
      </div>
    </div>

    <!-- HASIL -->
    <div id="hasil" class="hasil" style="display:none"></div>
  </div>

  <script>
    let data = [];
    let current = 0;
    let jawaban = [];
    let usernameSiswa = '';
    let kelasSiswa = '';

    const form = document.getElementById('quizForm');

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzxZLHU0PbEbMyJKMxEeYrVBbQmtmsgdHCV_xnRNgSCe8xVs65zCVY3N6NFRnWeLg18/exec';

    // LOGIN
    function login() {
      let username = document.getElementById('username').value;
      let password = document.getElementById('password').value;

      if (!username || !password) {
        alert('Isi username & password dulu');
        return;
      }

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ type: 'login', username, password })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status == 'success') {
          usernameSiswa = username;
          kelasSiswa = res.kelas;
          mulaiUjian();
        } else {
          alert('Username atau password salah!');
        }
      });
    }

    function mulaiUjian() {
      fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(res => {
        data = res;
        document.getElementById('login').style.display = 'none';
        document.getElementById('ujian').style.display = 'block';
        render();
        show();
      });
    }

    function render() {
      form.innerHTML = '';

      data.forEach((d, i) => {
        let div = document.createElement('div');
        div.className = 'soal' + (i == 0 ? ' active' : '');

        div.innerHTML = `
          <p><b>${i + 1}.</b> ${d.q}</p>
          <div class='opsi'>
            ${d.o.map((o, j) => `
              <label>
                <input type='radio' name='q${i}' value='${j}'>
                <span>${String.fromCharCode(65 + j)}.</span>
                <p>${o}</p>
              </label>
            `).join('')}
          </div>
        `;

        form.appendChild(div);
      });
    }

    function show() {
      document.querySelectorAll('.soal').forEach((s, i) => {
        s.classList.toggle('active', i == current);
      });

      document.getElementById('bar').style.width = ((current + 1) / data.length * 100) + '%';
    }

    form.addEventListener('change', e => {
      jawaban[current] = parseInt(e.target.value);
    });

    function nextSoal() {
      if (current < data.length - 1) {
        current++;
        show();
      } else {
        submitQuiz();
      }
    }

    function prevSoal() {
      if (current > 0) {
        current--;
        show();
      }
    }

    function submitQuiz() {
      let benar = 0;

      data.forEach((d, i) => {
        if (jawaban[i] == d.a) benar++;
      });

      let nilai = Math.round((benar / data.length) * 100);

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          type: 'nilai',
          username: usernameSiswa,
          kelas: kelasSiswa,
          nilai
        })
      });

      document.getElementById('hasil').style.display = 'block';

      document.getElementById('hasil').innerHTML = `
        <h2>${usernameSiswa}</h2>
        <h3>Kelas: ${kelasSiswa}</h3>
        <h3>Nilai: ${nilai}</h3>
        <button onclick="ulang()">Ulangi Ujian</button>
        <br><br>
        <a href="https://yanuar-moga.github.io/app/ppg/">
          <button>Kembali ke Home</button>
        </a>
      `;

      document.getElementById('ujian').style.display = 'none';
    }

    function ulang() {
      current = 0;
      jawaban = [];
      document.getElementById('hasil').style.display = 'none';
      document.getElementById('ujian').style.display = 'block';
      render();
      show();
    }
  </script>
</body>
</html>
