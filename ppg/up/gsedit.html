<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Soal UP PPG</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial}

/* LOGIN */
.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#e3f2fd,#bbdefb);
}

.login-card{
width:360px;
background:#fff;
padding:28px;
border-radius:18px;
box-shadow:0 12px 30px rgba(0,0,0,.15);
text-align:center;
}

.logo{width:90px;margin-bottom:10px}
.title{color:#0A4FA3;margin-bottom:15px}

.field{margin-bottom:12px;text-align:left}
.label-text{font-size:13px;color:#444}

.input-field{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

.show-pass{font-size:13px;margin:10px 0;text-align:left}

.btn{
width:100%;
padding:12px;
background:#0A4FA3;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
}

/* UJIAN */
.app-page{
display:none;
min-height:100vh;
background:#0f172a;
color:white;
padding:20px;
}

.container{max-width:900px;margin:auto}

.timer{text-align:center;color:#facc15;margin-bottom:10px}

.progress{
height:8px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-bottom:10px;
}

.bar{
height:100%;
background:#22c55e;
width:0%;
}

.nomor-nav{
display:flex;
flex-wrap:wrap;
gap:6px;
justify-content:center;
margin-bottom:10px;
}

.nomor-nav button{
width:40px;
height:40px;
border:none;
border-radius:8px;
background:#334155;
color:white;
cursor:pointer;
}

.nomor-nav .aktif{background:#22c55e}
.nomor-nav .sudah{background:#0ea5e9}

.soal{
display:none;
background:#1e293b;
padding:16px;
border-radius:12px;
}

.soal.active{display:block}

/* OPSI ELEGAN */
.opsi{margin-top:10px;}

.opsi label{
display:flex;
align-items:center;
gap:12px;
padding:12px;
margin:8px 0;
background:#334155;
border-radius:10px;
cursor:pointer;
border:2px solid transparent;
transition:0.2s;
}

.opsi label:hover{
background:#475569;
}

.opsi .huruf{
width:32px;
height:32px;
border-radius:50%;
border:2px solid #64748b;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
flex-shrink:0;
}

.opsi .text{
flex:1;
}

.opsi label.selected{
border:2px solid #22c55e;
background:#166534;
}

.opsi label.selected .huruf{
background:#22c55e;
border-color:#22c55e;
color:#fff;
}

.opsi label:active{
transform:scale(0.98);
}

.nav{
display:flex;
justify-content:space-between;
margin-top:15px;
}

button{
padding:12px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
cursor:pointer;
}

.hasil{
text-align:center;
background:#334155;
padding:20px;
border-radius:12px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <img src="assets/logo.png" class="logo">
    <h2 class="title">Latihan Soal UP PPG</h2>

    <div class="field">
      <div class="label-text">Username</div>
      <input id="username" class="input-field">
    </div>

    <div class="field">
      <div class="label-text">Password</div>
      <input id="password" type="password" class="input-field">
    </div>

    <div class="show-pass">
      <input type="checkbox" onclick="togglePass()"> Tampilkan Password
    </div>

    <button class="btn" onclick="login()">Masuk</button>
  </div>
</div>

<!-- UJIAN -->
<div class="app-page" id="app">
<div class="container">

<h2 style="text-align:center">LATIHAN SOAL UP PPG</h2>

<div class="timer">Sisa Waktu: <span id="time"></span></div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div class="nomor-nav" id="nav"></div>

<form id="form"></form>

<div class="nav">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>

<div id="hasil" class="hasil" style="display:none"></div>

</div>
</div>

<script>
const URL='https://script.google.com/macros/s/AKfycbzxZLHU0PbEbMyJKMxEeYrVBbQmtmsgdHCV_xnRNgSCe8xVs65zCVY3N6NFRnWeLg18/exec';

let data=[],i=0,jawaban=[],user='',kelas='',timer,waktu=600;

function togglePass(){
let p=document.getElementById('password');
p.type=p.type==='password'?'text':'password';
}

function login(){
let u=username.value.trim();
let p=password.value.trim();

if(!u||!p){alert('Isi data!');return;}

fetch(URL,{
method:'POST',
body:JSON.stringify({type:'login',username:u,password:p})
})
.then(res=>res.text())
.then(t=>{
let r=JSON.parse(t);

if(r.status==='success'){
user=u;
kelas=r.kelas;

loginPage.style.display='none';
app.style.display='block';

start();
}else alert('Login gagal');
})
.catch(()=>alert('Gagal koneksi'));
}

function start(){
fetch(URL)
.then(r=>r.json())
.then(r=>{
data=r;
render();
nav();
show();
timerStart();
});
}

function render(){
form.innerHTML='';
data.forEach((d,x)=>{
let div=document.createElement('div');
div.className='soal'+(x==0?' active':'');

div.innerHTML=`
<p><b>${x+1}.</b> ${d.q}</p>

<div class="opsi">
${d.o.map((o,y)=>`
<label onclick="pilih(${x},${y},this)">
  <div class="huruf">${String.fromCharCode(65+y)}</div>
  <div class="text">${o}</div>
</label>
`).join('')}
</div>
`;

form.appendChild(div);
});
}

function pilih(x,y,el){
jawaban[x]=y;
el.parentElement.querySelectorAll('label').forEach(l=>l.classList.remove('selected'));
el.classList.add('selected');
updateNav();
}

function nav(){
nav.innerHTML='';
data.forEach((_,x)=>{
let b=document.createElement('button');
b.innerText=x+1;
b.onclick=()=>{i=x;show()};
nav.appendChild(b);
});
}

function updateNav(){
document.querySelectorAll('.nomor-nav button').forEach((b,x)=>{
b.classList.remove('aktif','sudah');
if(x==i)b.classList.add('aktif');
if(jawaban[x]!=null)b.classList.add('sudah');
});
}

function show(){
document.querySelectorAll('.soal').forEach((s,x)=>{
s.classList.toggle('active',x==i);
});
bar.style.width=((i+1)/data.length*100)+'%';
updateNav();
}

function next(){i<data.length-1?(i++,show()):submit();}
function prev(){if(i>0){i--;show()}}

function timerStart(){

// 🔥 TAMPILKAN WAKTU LANGSUNG SAAT MULAI
updateTime();

timer=setInterval(()=>{
waktu--;
updateTime();

if(waktu<=0){
clearInterval(timer);
submit();
}
},1000);
}

// 🔥 FUNCTION FORMAT WAKTU
function updateTime(){
let m=Math.floor(waktu/60);
let s=waktu%60;
document.getElementById('time').innerText =
`${m}:${s<10?'0'+s:s}`;
}

function submit(){
clearInterval(timer);

let benar=0;
data.forEach((d,x)=>{if(jawaban[x]==d.a)benar++;});

let nilai=Math.round((benar/data.length)*100);

fetch(URL,{
method:'POST',
body:JSON.stringify({
type:'nilai',
username:user,
kelas:kelas,
nilai:nilai
})
});

app.innerHTML=`
<div class="hasil">
<h2>${user}</h2>
<h3>Kelas: ${kelas}</h3>
<h1>Nilai: ${nilai}</h1>
<button onclick="location.reload()">Ulangi</button>
</div>`;
}
</script>

</body>
</html>
