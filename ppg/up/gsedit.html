<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Soal UP PPG</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0}

/* LOGIN */
.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#e3f2fd,#bbdefb);
}

.login-card{
width:360px;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
text-align:center;
}

.login-card img{width:80px}
.login-card h2{color:#0A4FA3}

input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:12px;
border:none;
border-radius:10px;
background:#0A4FA3;
color:white;
cursor:pointer;
width:100%;
}

.show-pass{font-size:13px;text-align:left}

/* UJIAN */
.container{max-width:900px;margin:auto;padding:16px;background:#0f172a;color:white;display:none}
.timer{text-align:center;color:#facc15}
.progress{height:8px;background:#1e293b;border-radius:10px}
.bar{height:100%;background:#22c55e;width:0%}

.nomor-nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.nomor-nav button{width:40px;height:40px;background:#334155;color:white}

.soal{display:none;background:#1e293b;padding:15px;border-radius:10px}
.soal.active{display:block}

.opsi label{
display:flex;
gap:10px;
padding:10px;
margin:5px 0;
background:#334155;
border-radius:8px;
cursor:pointer;
}

.selected{background:#166534}

.nav{display:flex;justify-content:space-between;margin-top:10px}

.hasil{text-align:center;background:#334155;padding:20px;border-radius:10px}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
<div class="login-card">

<img src="assets/logo.png">
<h2>Latihan Soal UP PPG</h2>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<div class="show-pass">
<input type="checkbox" onclick="togglePass()"> Tampilkan Password
</div>

<button onclick="login()">Masuk</button>

</div>
</div>

<!-- UJIAN -->
<div class="container" id="app">

<h2 style="text-align:center">LATIHAN SOAL UP PPG</h2>

<div class="timer">Sisa Waktu: <span id="time"></span></div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div class="nomor-nav" id="nav"></div>

<form id="form"></form>

<div class="nav">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>

<div id="hasil" class="hasil" style="display:none"></div>

</div>

<script>
const URL='https://script.google.com/macros/s/AKfycbzxZLHU0PbEbMyJKMxEeYrVBbQmtmsgdHCV_xnRNgSCe8xVs65zCVY3N6NFRnWeLg18/exec';

let data=[],i=0,jawaban=[],user='',kelas='',timer,waktu=600;

// SHOW PASSWORD
function togglePass(){
let p=document.getElementById('password');
p.type=p.type==='password'?'text':'password';
}

// LOGIN
function login(){
let u=username.value.trim();
let p=password.value.trim();

if(!u||!p){alert('Isi data!');return;}

fetch(URL,{
method:'POST',
body:JSON.stringify({type:'login',username:u,password:p})
})
.then(res=>res.text())
.then(t=>{
let r=JSON.parse(t);

if(r.status==='success'){
user=u;
kelas=r.kelas;

// pindah ke ujian
document.getElementById('loginPage').style.display='none';
document.getElementById('app').style.display='block';

start();
}else{
alert('Login gagal');
}
})
.catch(e=>alert('Gagal koneksi'));
}

// START
function start(){
fetch(URL)
.then(r=>r.json())
.then(r=>{
data=r;
render();
nav();
show();
timerStart();
});
}

// RENDER
function render(){
form.innerHTML='';
data.forEach((d,x)=>{
let div=document.createElement('div');
div.className='soal'+(x==0?' active':'');

div.innerHTML=`
<p><b>${x+1}.</b> ${d.q}</p>
${d.o.map((o,y)=>`
<label onclick="pilih(${x},${y},this)">
<input type="radio">
${String.fromCharCode(65+y)}. ${o}
</label>`).join('')}
`;

form.appendChild(div);
});
}

// PILIH
function pilih(x,y,el){
jawaban[x]=y;
el.parentElement.querySelectorAll('label').forEach(l=>l.classList.remove('selected'));
el.classList.add('selected');
updateNav();
}

// NAV
function nav(){
nav.innerHTML='';
data.forEach((_,x)=>{
let b=document.createElement('button');
b.innerText=x+1;
b.onclick=()=>{i=x;show()};
nav.appendChild(b);
});
}

// UPDATE NAV
function updateNav(){
document.querySelectorAll('.nomor-nav button').forEach((b,x)=>{
b.classList.remove('aktif','sudah');
if(x==i)b.classList.add('aktif');
if(jawaban[x]!=null)b.classList.add('sudah');
});
}

// SHOW
function show(){
document.querySelectorAll('.soal').forEach((s,x)=>{
s.classList.toggle('active',x==i);
});
bar.style.width=((i+1)/data.length*100)+'%';
updateNav();
}

// NAV BTN
function next(){i<data.length-1?(i++,show()):submit();}
function prev(){if(i>0){i--;show()}}

// TIMER
function timerStart(){
timer=setInterval(()=>{
waktu--;
let m=Math.floor(waktu/60);
let s=waktu%60;
time.innerText=`${m}:${s<10?'0'+s:s}`;

if(waktu<=0){clearInterval(timer);submit();}
},1000);
}

// SUBMIT
function submit(){
clearInterval(timer);

let benar=0;
data.forEach((d,x)=>{if(jawaban[x]==d.a)benar++;});

let nilai=Math.round((benar/data.length)*100);

// SIMPAN NILAI
fetch(URL,{
method:'POST',
body:JSON.stringify({
type:'nilai',
username:user,
kelas:kelas,
nilai:nilai
})
});

app.innerHTML=`
<div class="hasil">
<h2>${user}</h2>
<h3>Kelas: ${kelas}</h3>
<h1>Nilai: ${nilai}</h1>
<button onclick="location.reload()">Ulangi</button>
</div>
`;
}
</script>

</body>
</html>
