<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login - Latihan Soal UP PPG</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#e3f2fd,#bbdefb);
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-card {
  width: 360px;
  background: #fff;
  border-radius: 18px;
  padding: 28px 26px 22px;
  box-shadow: 0 12px 30px rgba(0,0,0,.15);
  text-align: center;
}

.logo {
  width: 90px;
  margin-bottom: 10px;
}

.title {
  margin: 6px 0 18px;
  color: #0A4FA3;
  font-size: 22px;
}

.form { text-align: left; }

.field {
  display: flex;
  flex-direction: column;
  margin-bottom: 14px;
}

.label-text {
  font-size: 13px;
  margin-bottom: 5px;
  color: #444;
}

.input-field {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
  height: 42px;
}

.input-field:focus {
  border-color: #0A4FA3;
}

.show-pass {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  margin: 6px 0 18px;
}

.btn-primary {
  width: 100%;
  padding: 11px;
  background: #0A4FA3;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.btn-primary:hover {
  background: #083d82;
}

.footer {
  margin-top: 18px;
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<div class="login-card">

  <!-- LOGO -->
  <img src="assets/logo.png" alt="Logo" class="logo" />

  <!-- JUDUL -->
  <h1 class="title">Latihan Soal UP PPG</h1>

  <!-- FORM -->
  <form id="loginForm" class="form">

    <div class="field">
      <span class="label-text">Username</span>
      <input id="username" type="text" class="input-field"
             placeholder="Masukkan Username" required />
    </div>

    <div class="field">
      <span class="label-text">Password</span>
      <input id="password" type="password" class="input-field"
             placeholder="Masukkan Password" required />
    </div>

    <div class="show-pass">
      <input type="checkbox" id="showPassword" />
      <label for="showPassword">Tampilkan Password</label>
    </div>

    <button type="submit" class="btn-primary">Masuk</button>

  </form>

  <div class="footer">© 2025 Latihan Soal UP PPG</div>

</div>

<script>
const URL = 'https://script.google.com/macros/s/AKfycbzxZLHU0PbEbMyJKMxEeYrVBbQmtmsgdHCV_xnRNgSCe8xVs65zCVY3N6NFRnWeLg18/exec';

// 👁️ SHOW / HIDE PASSWORD
document.getElementById('showPassword').addEventListener('change', function () {
  const pass = document.getElementById('password');
  pass.type = this.checked ? 'text' : 'password';
});

// 🔐 LOGIN
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if(!username || !password){
    alert("Isi username dan password!");
    return;
  }

  fetch(URL, {
    method: 'POST',
    body: JSON.stringify({
      type: 'login',
      username: username,
      password: password
    })
  })
  .then(res => res.text()) // 🔥 penting
  .then(text => {
    console.log("RAW:", text);

    let res;
    try {
      res = JSON.parse(text);
    } catch(e){
      throw new Error("Response bukan JSON");
    }

    if(res.status === 'success'){
      localStorage.setItem('user', username);
      localStorage.setItem('kelas', res.kelas);

      // 🔥 redirect aman
      window.location.href = "./latihan_soal.html";
    } else {
      alert("Username atau password salah!");
    }
  })
  .catch(err => {
    console.error(err);
    alert("Gagal koneksi ke server!");
  });
});
</script>

</body>
</html>
