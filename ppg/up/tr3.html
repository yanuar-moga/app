<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Try Out UP PPG</title>

<style>
body{
  font-family:'Segoe UI';
  background:#f1f5f9;
  margin:0;
}

.container{
  max-width:900px;
  width:95%;
  margin:auto;
  margin-top:20px;
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.userBox{
  text-align:right;
  min-width:200px;
}

.status{
  font-size:13px;
  margin-top:4px;
  display:none;
}

.status.belum{color:#f59e0b;}
.status.sudah{color:#22c55e;}

#btnLogout{
  margin-top:6px;
  background:#ef4444;
  display:none;
}

.logo{
  display:block;
  margin:auto;
  width:90px;
  margin-bottom:10px;
}

h2{
  text-align:center;
  margin-bottom:10px;
  font-weight:700;
  color:#1e293b;
}

#infoAkses{
  text-align:center;
  font-size:13px;
  color:#64748b;
  margin-bottom:10px;
}

.loginBox{
  max-width:320px;
  margin:auto;
}

.loginBox label{
  display:block;
  margin-top:12px;
}

.inputBox,select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:4px;
  box-sizing:border-box;
}

.passwordCheck{
  margin-top:8px;
  display:flex;
  gap:8px;
  font-size:13px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  width:auto;
}

#navBtn{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
}

#nomor{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(36px,1fr));
  gap:6px;
  margin-top:15px;
}

#nomor span{
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e2e8f0;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}

.dijawab{
  background:#22c55e!important;
  color:white;
}

#progressBox{
  height:8px;
  background:#e5e7eb;
  border-radius:10px;
  margin-top:10px;
}

#progressBar{
  height:8px;
  width:0%;
  background:#2563eb;
  border-radius:10px;
}

.soalCard{
  background:#f8fafc;
  border-radius:14px;
  padding:16px;
  border:1px solid #e2e8f0;
  margin-top:15px;
}

.opsi{
  display:flex;
  gap:10px;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  margin-top:6px;
  border:1px solid #e2e8f0;
  align-items:flex-start;
}

.opsi:hover{
  background:#f1f5f9;
}

.opsi.aktif{
  border-color:#2563eb;
  background:#eff6ff;
}

.opsi img{
  max-width:120px;
  border-radius:8px;
  cursor:pointer;
}

#imageModal{
  display:none;
  position:fixed;
  z-index:999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

#imageModal img{
  max-width:90%;
  max-height:90%;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div></div>
<div class="userBox">
<div id="userInfo"></div>
<div id="infoAkses"></div>
<div class="status belum" id="statusUjian">Belum Mengerjakan</div>
<button id="btnLogout" onclick="logout()">Logout</button>
</div>
</div>

<img class="logo" src="https://yanuar-moga.github.io/app/ppg/up/assets/logo.png">

<h2>CBT Try Out UP PPG</h2>

<div id="login" class="loginBox">

<label>Kelas</label>
<select id="kelas"></select>

<label>Nama</label>
<select id="nama"></select>

<label>Password</label>
<input type="password" id="password" class="inputBox">

<div class="passwordCheck">
<input type="checkbox" onclick="lihatPassword()">
<label>Tampilkan Password</label>
</div>

<div id="tokenBox" style="display:none;">
<label>Token</label>
<input type="text" id="token" class="inputBox">
</div>

<br>
<button onclick="login()">Login</button>

</div>

<div id="ujian" style="display:none">

<div id="timer"></div>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<div id="nomor"></div>
<div id="soal"></div>

<div id="navBtn">
<button id="btnPrev" onclick="prev()">Prev</button>
<button id="btnNext" onclick="next()">Next</button>
</div>

</div>

</div>

<div id="imageModal" onclick="this.style.display='none'">
<img id="modalImg">
</div>

<script>
var URL_SCRIPT="https://script.google.com/macros/s/AKfycbxkR915Z-eS61U9OIAtu_CzULtAo6I6niI1MZ6h3nSpLSQBoXTn-IeIVV-J6GaVVC1O/exec";

var soal=[],jawaban=[],no=0;
var nama,kelas,level="";

// ================= GAS =================
function gas(func,data,callback){
  fetch(URL_SCRIPT,{
    method:"POST",
    body:JSON.stringify({func:func,data:data})
  })
  .then(res=>res.json())
  .then(callback);
}

// ================= LOAD KELAS =================
function loadKelas(){
  gas("getKelas",{},function(data){

    var urutan = ["free","basic","premium","unlimited"];

    var sorted = urutan.filter(u =>
      data.map(x=>x.toLowerCase()).includes(u)
    );

    var k=document.getElementById("kelas");
    k.innerHTML="<option>Pilih Kelas</option>";

    sorted.forEach(x=>{
      var text = x.charAt(0).toUpperCase() + x.slice(1);
      var o=document.createElement("option");
      o.value=text;
      o.text=text;
      k.appendChild(o);
    });
  });
}

// ================= LOAD NAMA (FIX UTAMA) =================
function loadNama(){
  var kls = document.getElementById("kelas").value;

  if(!kls || kls==="Pilih Kelas") return;

  gas("getNama",{kelas:kls},function(data){
    var n=document.getElementById("nama");
    n.innerHTML="<option>Pilih Nama</option>";

    data.forEach(x=>{
      var o=document.createElement("option");
      o.value=x;
      o.text=x;
      n.appendChild(o);
    });
  });
}

// ================= LOGIN =================
function login(){
  nama=document.getElementById("nama").value;
  kelas=document.getElementById("kelas").value;
  var password=document.getElementById("password").value;
  var token=document.getElementById("token").value;

  if(!nama||!password){
    alert("Lengkapi login");
    return;
  }

  gas("login",{nama:nama,password:password,token:token},function(res){
    if(res.status=="ok"){

      document.getElementById("login").style.display="none";
      document.getElementById("ujian").style.display="block";

      document.getElementById("userInfo").innerHTML=
        "👤 "+nama+" | "+kelas+" | "+res.level;

      document.getElementById("infoAkses").innerHTML=
        res.deskripsi || "";

      document.getElementById("btnLogout").style.display="block";

      loadSoal();
    }else{
      alert(res.pesan||"Login gagal");
    }
  });
}

// ================= SOAL =================
function loadSoal(){
  gas("getSoal",{nama:nama},function(data){
    soal=data;
    jawaban=[];
    no=0;

    document.getElementById("nomor").innerHTML="";

    soal.forEach((s,i)=>{
      jawaban.push("");
      document.getElementById("nomor").innerHTML+=
        "<span id='n"+i+"' onclick='goto("+i+")'>"+(i+1)+"</span>";
    });

    tampil();
  });
}

function tampil(){
  var s=soal[no];
  var html="<div class='soalCard'>";

  html+="<b>"+(no+1)+".</b> "+s.pertanyaan;

  s.opsi.forEach(o=>{
    html+=`
    <div class="opsi ${jawaban[no]==o.key?"aktif":""}" onclick="jawab('${o.key}',this)">
      <div><b>${o.key}.</b></div>
      <div>${o.text}</div>
    </div>`;
  });

  html+="</div>";

  document.getElementById("soal").innerHTML=html;

  updateNav();
}

// ================= NAV =================
function updateNav(){
  document.getElementById("btnPrev").style.display = no===0 ? "none" : "inline-block";
  document.getElementById("btnNext").innerText = (no===soal.length-1) ? "Selesai" : "Next";
}

function next(){
  if(no<soal.length-1){
    no++;
    tampil();
  }else{
    kirim();
  }
}

function prev(){
  if(no>0){
    no--;
    tampil();
  }
}

function goto(n){
  no=n;
  tampil();
}

// ================= JAWAB =================
function jawab(v,el){
  jawaban[no]=v;
  document.querySelectorAll(".opsi").forEach(x=>x.classList.remove("aktif"));
  el.classList.add("aktif");
  document.getElementById("n"+no).classList.add("dijawab");
}

// ================= SUBMIT =================
function kirim(){
  alert("Ujian selesai");
}

// ================= UTIL =================
function lihatPassword(){
  var p=document.getElementById("password");
  p.type=(p.type==="password")?"text":"password";
}

function cekKelas(){
  var k=document.getElementById("kelas").value.toLowerCase();
  var t=document.getElementById("tokenBox");

  if(k==="free"||k==="basic"||k==="premium"){
    t.style.display="block";
  }else{
    t.style.display="none";
    document.getElementById("token").value="";
  }
}

function logout(){
  localStorage.clear();
  location.reload();
}

// ================= INIT =================
window.onload=function(){
  loadKelas();
}

document.getElementById("kelas").addEventListener("change",function(){
  loadNama();
  cekKelas();
});
</script>

</body>
</html>
