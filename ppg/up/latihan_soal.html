<style>

body{font-family:Arial;background:#0f172a;color:white;margin:0}

h1{text-align:center}

.hasil{text-align:center;background:#334155;padding:20px;border-radius:12px;margin-top:20px;animation:fadeIn 0.8s ease}

.home{background:#38bdf8;color:#0f172a}
.ulang{background:#f97316;color:white}

<div class="container">

<div class="timer">Sisa Waktu: <span id="time">10:00</span></div>

<div class="nomor" id="navSoal"></div>

<div class="nav">
<button onclick="prevSoal()">Sebelumnya</button>
<button onclick="nextSoal()">Next</button>
</div>

<div id="hasil" class="hasil" style="display:none"></div>
</div>

<script>
const data = "+JSON.stringify(data)+";
let current=0, jawaban=[];
const form=document.getElementById('quizForm');

function render(){
form.innerHTML='';
data.forEach((d,i)=>{
let div=document.createElement('div');
div.className='soal'+(i==0?' active':'');
div.innerHTML=`<p><b>${i+1}.</b> ${d.q}</p><div class='opsi'>${d.o.map((o,j)=>`<label><input type='radio' name='q${i}' value='${j}' ${jawaban[i]==j?'checked':''}><span>${String.fromCharCode(65+j)}.</span><p>${o}</p></label>`).join('')}</div>`;
form.appendChild(div);
});
renderNav();
}

function renderNav(){
let nav=document.getElementById('navSoal');
nav.innerHTML='';
data.forEach((_,i)=>{
let b=document.createElement('button');
b.innerText=i+1;
b.onclick=()=>{current=i;show();};
nav.appendChild(b);
});
}

function show(){
document.querySelectorAll('.soal').forEach((s,i)=>{
s.classList.toggle('active',i==current);
});
document.getElementById('bar').style.width=((current+1)/data.length*100)+'%';
}

form.addEventListener('change',e=>{
jawaban[current]=parseInt(e.target.value);
});

function nextSoal(){
if(current<data.length-1){current++;show();}
else submitQuiz();
}
function prevSoal(){if(current>0){current--;show();}}

let waktu=600;
let t=setInterval(()=>{
let m=Math.floor(waktu/60),d=waktu%60;
document.getElementById('time').innerText=`${m}:${d<10?'0':''}${d}`;
waktu--;if(waktu<0){clearInterval(t);submitQuiz();}
},1000);

function submitQuiz(){
clearInterval(t);
let benar=0;
data.forEach((d,i)=>{if(jawaban[i]==d.a) benar++;});
let nilai=Math.round((benar/data.length)*100);

// RANKING SEDERHANA
let rank = nilai>=90?"🏆 Sangat Baik": nilai>=75?"👍 Baik": nilai>=60?"🙂 Cukup":"⚠ Perlu Belajar Lagi";

let hasilHTML = `
<h2>Nilai Anda: ${nilai}</h2>
<p>Benar: ${benar} dari ${data.length}</p>
<h3>${rank}</h3>

<div>
<a href="https://yanuar-moga.github.io/app/ppg/" class="action-btn home">⬅ Kembali ke Home</a>
<button onclick="ulangUjian()" class="action-btn ulang">🔄 Ulangi Ujian</button>
</div>
`;

document.getElementById('hasil').style.display='block';
document.getElementById('hasil').innerHTML=hasilHTML;

form.style.display='none';
document.querySelector('.nav').style.display='none';
}

function ulangUjian(){
location.reload();
}

render();
</script>

</body>
