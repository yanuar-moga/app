<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Ujian Sekolah</title>

<style>

body{
font-family:'Segoe UI';
background:#f1f5f9;
margin:0;
}

/* CONTAINER */
.container{
max-width:900px;
width:95%;
margin:auto;
margin-top:20px;
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
}

.userBox{
text-align:center;
min-width:160px;
}

.userInfo{
font-size:14px;
font-weight:600;
}

.status{
font-size:13px;
margin-top:4px;
display:none;
}

.status.belum{color:#f59e0b;}
.status.sudah{color:#22c55e;}

#btnLogout{
margin-top:6px;
background:#ef4444;
display:none;
}

/* LOGO */
.logo{
display:block;
margin:auto;
width:90px;
margin-bottom:10px;
}

/* JUDUL */
h2{
text-align:center;
margin-bottom:20px;
font-weight:700;
color:#1e293b;
}

/* LOGIN */
.loginBox{
max-width:320px;
margin:auto;
}

.loginBox label{
display:block;
margin-top:12px;
}

/* INPUT */
.inputBox{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-top:4px;
box-sizing:border-box;
display:block;
}

/* CHECKBOX PASSWORD */
.passwordCheck{
margin-top:8px;
display:flex;
align-items:center;
gap:8px;
font-size:13px;
}

.passwordCheck input{
width:auto;
}

/* BUTTON */
button{
background:#2563eb;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
font-weight:500;
width:100%;
}

button:disabled{
background:#94a3b8;
cursor:not-allowed;
}

/* NOMOR */
#nomor{
display:flex;
flex-wrap:wrap;
margin-top:10px;
}

#nomor span{
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
margin:3px;
background:#e2e8f0;
border-radius:6px;
cursor:pointer;
font-size:13px;
}

.dijawab{
background:#22c55e!important;
color:white;
}

/* PROGRESS */
#progressBox{
height:8px;
background:#e5e7eb;
border-radius:10px;
margin-top:10px;
}

#progressBar{
height:8px;
width:0%;
background:#2563eb;
border-radius:10px;
}

/* SOAL */
#soal{
margin-top:15px;
}

.soalText{
text-align:justify;
line-height:1.6;
}

/* OPSI */
.opsi{
display:flex;
align-items:center;
gap:12px;
padding:12px;
border-radius:12px;
cursor:pointer;
margin-bottom:10px;
transition:0.25s;
border:2px solid #e2e8f0;
}

.opsi:hover{
background:#f8fafc;
}

.circle{
width:34px;
height:34px;
border-radius:50%;
border:2px solid #94a3b8;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:#334155;
}

.teks{
flex:1;
text-align:justify;
}

.opsi.aktif{
border:2px solid #2563eb;
background:#eff6ff;
}

.opsi.aktif .circle{
background:#2563eb;
color:white;
border-color:#2563eb;
}

/* NAV */
.navBtn{
display:flex;
gap:10px;
margin-top:15px;
}

.navBtn button{
flex:1;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<div></div>

<div class="userBox">
<div class="userInfo" id="userInfo"></div>
<div class="status belum" id="statusUjian">Belum Mengerjakan</div>
<button id="btnLogout" onclick="logout()">Logout</button>
</div>
</div>

<img class="logo" src="https://yanuar-moga.github.io/app/ppg/up/assets/logo.png">

<h2>Try Out UP PPG</h2>

<!-- LOGIN -->
<div id="login" class="loginBox">

<label>Username</label>
<input type="text" id="username" class="inputBox">

<label>Password</label>
<input type="password" id="password" class="inputBox">

<div class="passwordCheck">
<input type="checkbox" id="showPass" onclick="lihatPassword()">
<label for="showPass">Tampilkan Password</label>
</div>

<br>
<button onclick="login()">Login</button>

</div>

<!-- UJIAN -->
<div id="ujian" style="display:none">

<div id="timer"></div>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<div id="nomor"></div>

<div id="soal"></div>

<div class="navBtn">
<button onclick="prev()">Prev</button>
<button id="btnKirim" onclick="kirim()">Selesai</button>
<button onclick="next()">Next</button>
</div>

</div>

</div>

<script>

var URL_SCRIPT="https://script.google.com/macros/s/AKfycbyIIkiSDaj2VnlXo8SSeKENbUKB2OuZOfdHIs2AFbfbVCq_qquMtaHTylnk5MBv7DDX/exec";

var soal=[],jawaban=[],no=0;
var username,kelas;
var waktu=1800;
var sudahSubmit=false;

function gas(func,data,callback){
fetch(URL_SCRIPT,{
method:"POST",
body:JSON.stringify({func:func,data:data})
})
.then(res=>res.json())
.then(callback);
}

function lihatPassword(){
var p=document.getElementById("password");
p.type = (p.type==="password") ? "text" : "password";
}

function login(){

username=document.getElementById("username").value;
var password=document.getElementById("password").value;

if(!username||!password){
alert("Lengkapi login!");
return;
}

gas("login",{username:username,password:password},function(res){

if(res.status=="ok"){

kelas=res.kelas;

localStorage.setItem("username",username);
localStorage.setItem("kelas",kelas);

document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

document.getElementById("userInfo").innerHTML="👤 "+username+" | "+kelas;
document.getElementById("btnLogout").style.display="block";
document.getElementById("statusUjian").style.display="block";

loadSoal();
timer();

}else{
alert("Username atau Password salah!");
}

});

}

function loadSoal(){

gas("getSoal",{},function(data){

soal=data;
jawaban=[];

document.getElementById("nomor").innerHTML="";

data.forEach((s,i)=>{
jawaban.push("");
document.getElementById("nomor").innerHTML+=
"<span id='n"+i+"' onclick='goto("+i+")'>"+(i+1)+"</span>";
});

tampil();

});

}

function tampil(){

var s=soal[no];

var html="<div class='soalText'><b>"+(no+1)+".</b> "+s.pertanyaan+"</div>";

var huruf=["A","B","C","D","E"];

s.opsi.forEach((o,i)=>{
var aktif=jawaban[no]==o.key?"aktif":"";

html+=`
<div class="opsi ${aktif}" onclick="jawab('${o.key}', this)">
    <div class="circle">${huruf[i]}</div>
    <div class="teks">${o.text}</div>
</div>
`;
});

document.getElementById("soal").innerHTML=html;

}

function jawab(v,el){

jawaban[no]=v;

document.querySelectorAll(".opsi").forEach(x=>x.classList.remove("aktif"));
el.classList.add("aktif");

document.getElementById("n"+no).classList.add("dijawab");

localStorage.setItem("jawaban",JSON.stringify(jawaban));
updateProgress();

}

function next(){if(no<soal.length-1){no++;tampil();}}
function prev(){if(no>0){no--;tampil();}}
function goto(n){no=n;tampil();}

function updateProgress(){
var j=jawaban.filter(x=>x!="").length;
document.getElementById("progressBar").style.width=(j/soal.length*100)+"%";
}

function kirim(){

if(sudahSubmit) return;

gas("submitJawaban",{
jawaban:jawaban,
username:username,
kelas:kelas
},function(nilai){

alert("Nilai Anda : "+nilai);

sudahSubmit=true;
document.getElementById("btnKirim").disabled=true;

document.getElementById("statusUjian").innerHTML="Sudah Mengerjakan";
document.getElementById("statusUjian").classList.remove("belum");
document.getElementById("statusUjian").classList.add("sudah");

});

}

function timer(){
setInterval(()=>{
waktu--;
var m=Math.floor(waktu/60);
var d=waktu%60;
d=d<10?"0"+d:d;
document.getElementById("timer").innerHTML="⏱️ "+m+":"+d;
if(waktu<=0) kirim();
},1000);
}

function logout(){
if(confirm("Logout?")){
localStorage.clear();
location.reload();
}
}

</script>

</body>
</html>
