<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Try Out</title>

<style>

body{
font-family:'Segoe UI';
background:#f1f5f9;
margin:0;
}

.container{
max-width:900px;
width:95%;
margin:auto;
margin-top:20px;
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h2{
text-align:center;
margin-bottom:20px;
}

.inputBox{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-top:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
margin-top:10px;
cursor:pointer;
font-weight:500;
}

button:disabled{
background:#94a3b8;
}

#nomor{
display:flex;
flex-wrap:wrap;
margin-top:10px;
}

#nomor span{
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
margin:3px;
background:#e2e8f0;
border-radius:6px;
cursor:pointer;
font-size:13px;
}

.dijawab{
background:#22c55e!important;
color:white;
}

.opsi{
display:flex;
gap:12px;
padding:12px;
border-radius:10px;
cursor:pointer;
margin-top:10px;
border:2px solid #e2e8f0;
transition:0.2s;
}

.opsi:hover{
background:#f8fafc;
}

.opsi.aktif{
background:#eff6ff;
border-color:#2563eb;
}

.circle{
width:32px;
height:32px;
border-radius:50%;
border:2px solid #94a3b8;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.opsi.aktif .circle{
background:#2563eb;
color:white;
border-color:#2563eb;
}

.navBtn{
display:flex;
gap:10px;
margin-top:20px;
}

.navBtn button{
flex:1;
}

#timer{
font-weight:bold;
text-align:right;
margin-bottom:10px;
}

@media(max-width:600px){
.container{padding:15px;}
}

</style>

</head>

<body>

<div class="container">

<h2>Try Out CBT</h2>

<!-- LOGIN -->
<div id="login">

<input type="text" id="username" class="inputBox" placeholder="Username">
<input type="password" id="password" class="inputBox" placeholder="Password">

<label style="font-size:13px;">
<input type="checkbox" onclick="togglePass()"> Tampilkan Password
</label>

<button onclick="login()">Login</button>

</div>

<!-- UJIAN -->
<div id="ujian" style="display:none">

<div id="timer"></div>

<div id="nomor"></div>

<div id="soal"></div>

<div class="navBtn">
<button onclick="prev()">Prev</button>
<button id="btnKirim" onclick="kirim()">Selesai</button>
<button onclick="next()">Next</button>
</div>

</div>

</div>

<script>

var URL_SCRIPT="https://script.google.com/macros/s/AKfycbyIIkiSDaj2VnlXo8SSeKENbUKB2OuZOfdHIs2AFbfbVCq_qquMtaHTylnk5MBv7DDX/exec";

var soal=[],jawaban=[],no=0;
var username,kelas,tipe;
var waktu=1800;
var sudahSubmit=false;

// ================= GAS =================
function gas(data,callback){

const payload = "data=" + encodeURIComponent(JSON.stringify(data));

fetch(URL_SCRIPT,{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:payload
})
.then(res=>res.text())
.then(txt=>{
try{
callback(JSON.parse(txt));
}catch(e){
console.log("RESPON:",txt);
alert("Server error");
}
})
.catch(err=>{
console.error(err);
alert("Gagal konek ke server!");
});

}

// ================= LOGIN =================
function login(){

username=document.getElementById("username").value.trim();
var password=document.getElementById("password").value.trim();

if(!username || !password){
alert("Isi username & password!");
return;
}

gas({
type:"login",
username:username,
password:password
},function(res){

if(res.status==="success"){

kelas=res.kelas;
tipe=res.tipe;

document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

loadSoal();
timer();

}else{
alert("Username atau Password salah!");
}

});

}

// ================= LOAD SOAL =================
function loadSoal(){

gas({
type:"getSoal",
tipe:tipe
},function(data){

soal=data;
jawaban=[];

var nomorHTML="";

data.forEach((s,i)=>{
jawaban.push("");
nomorHTML += "<span id='n"+i+"' onclick='goto("+i+")'>"+(i+1)+"</span>";
});

document.getElementById("nomor").innerHTML=nomorHTML;

tampil();

});

}

// ================= TAMPIL =================
function tampil(){

var s=soal[no];
var huruf=["A","B","C","D","E"];

var html="<div><b>"+(no+1)+".</b> "+s.pertanyaan+"</div>";

// 🔥 GAMBAR
if(s.gambar && s.gambar.trim()!=""){
html += "<img src='"+s.gambar+"' style='max-width:100%;margin:10px 0;border-radius:10px'>";
}

s.opsi.forEach((o,i)=>{
var aktif=jawaban[no]==o.key?"aktif":"";

html+=`
<div class="opsi ${aktif}" onclick="jawab('${o.key}',this)">
<div class="circle">${huruf[i]}</div>
<div>${o.text}</div>
</div>
`;
});

document.getElementById("soal").innerHTML=html;

}

// ================= JAWAB =================
function jawab(v,el){

jawaban[no]=v;

document.querySelectorAll(".opsi").forEach(x=>x.classList.remove("aktif"));
el.classList.add("aktif");

document.getElementById("n"+no).classList.add("dijawab");

}

// ================= NAV =================
function next(){ if(no<soal.length-1){no++;tampil();} }
function prev(){ if(no>0){no--;tampil();} }
function goto(n){ no=n; tampil(); }

// ================= KIRIM =================
function kirim(){

if(sudahSubmit) return;

gas({
type:"submit",
jawaban:jawaban,
username:username,
kelas:kelas,
tipe:tipe
},function(res){

alert("Nilai Anda: "+res.nilai);

sudahSubmit=true;
document.getElementById("btnKirim").disabled=true;

});

}

// ================= TIMER =================
function timer(){
setInterval(()=>{
waktu--;

var m=Math.floor(waktu/60);
var d=waktu%60;
if(d<10)d="0"+d;

document.getElementById("timer").innerHTML="⏱️ "+m+":"+d;

if(waktu<=0) kirim();

},1000);
}

// ================= PASSWORD =================
function togglePass(){
var p=document.getElementById("password");
p.type = (p.type==="password") ? "text" : "password";
}

</script>

</body>
</html>
