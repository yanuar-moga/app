<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Ujian Sekolah</title>

<style>

body{
font-family:'Segoe UI';
background:#f1f5f9;
margin:0;
}

.container{
max-width:900px;
width:95%;
margin:auto;
margin-top:20px;
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
}

.userBox{
text-align:center;
min-width:160px;
}

.status{display:none;font-size:13px;margin-top:4px;}
.status.belum{color:#f59e0b;}
.status.sudah{color:#22c55e;}

#btnLogout{display:none;background:#ef4444;}

.logo{
display:block;
margin:auto;
width:90px;
margin-bottom:10px;
}

h2{text-align:center;}

.loginBox{
max-width:320px;
margin:auto;
}

.inputBox{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-top:10px;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
margin-top:10px;
cursor:pointer;
}

button:disabled{background:#94a3b8;}

#nomor{
display:flex;
flex-wrap:wrap;
margin-top:10px;
}

#nomor span{
width:32px;height:32px;
display:flex;
align-items:center;
justify-content:center;
margin:3px;
background:#e2e8f0;
border-radius:6px;
cursor:pointer;
}

.dijawab{
background:#22c55e!important;
color:white;
}

#progressBox{
height:8px;
background:#e5e7eb;
border-radius:10px;
margin-top:10px;
}

#progressBar{
height:8px;
width:0%;
background:#2563eb;
border-radius:10px;
}

.opsi{
display:flex;
gap:10px;
padding:12px;
border-radius:10px;
border:2px solid #e2e8f0;
margin-top:8px;
cursor:pointer;
}

.opsi.aktif{
background:#eff6ff;
border-color:#2563eb;
}

.circle{
width:30px;height:30px;
border-radius:50%;
border:2px solid #94a3b8;
display:flex;
align-items:center;
justify-content:center;
}

.opsi.aktif .circle{
background:#2563eb;
color:white;
}

.navBtn{
display:flex;
gap:10px;
margin-top:15px;
}

.navBtn button{flex:1;}

</style>

</head>

<body>

<div class="container">

<div class="header">
<div></div>

<div class="userBox">
<div id="userInfo"></div>
<div class="status belum" id="statusUjian">Belum Mengerjakan</div>
<button id="btnLogout" onclick="logout()">Logout</button>
</div>
</div>

<img class="logo" src="https://yanuar-moga.github.io/app/ppg/up/assets/logo.png">

<h2>Try Out UP PPG</h2>

<!-- LOGIN -->
<div id="login" class="loginBox">

<input type="text" id="username" class="inputBox" placeholder="Username">
<input type="password" id="password" class="inputBox" placeholder="Password">

<label>
<input type="checkbox" onclick="togglePass()"> Tampilkan Password
</label>

<button onclick="login()">Login</button>

</div>

<!-- UJIAN -->
<div id="ujian" style="display:none">

<div id="timer"></div>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<div id="nomor"></div>
<div id="soal"></div>

<div class="navBtn">
<button onclick="prev()">Prev</button>
<button id="btnKirim" onclick="kirim()">Selesai</button>
<button onclick="next()">Next</button>
</div>

</div>

</div>

<script>

var URL_SCRIPT="https://script.google.com/macros/s/AKfycbyIIkiSDaj2VnlXo8SSeKENbUKB2OuZOfdHIs2AFbfbVCq_qquMtaHTylnk5MBv7DDX/exec";

var soal=[],jawaban=[],no=0;
var username,kelas;
var waktu=1800;
var sudahSubmit=false;

// ================= GAS FETCH =================
function gas(func,data,callback){

fetch(URL_SCRIPT,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
func:func,
data:data
})
})
.then(res=>res.json())
.then(callback)
.catch(err=>{
alert("Gagal konek ke server!");
console.log(err);
});

}

// ================= PASSWORD =================
function togglePass(){
var p=document.getElementById("password");
p.type = (p.type==="password") ? "text" : "password";
}

// ================= LOGIN =================
function login(){

username=document.getElementById("username").value.trim();
var password=document.getElementById("password").value.trim();

if(!username || !password){
alert("Isi username & password!");
return;
}

gas("login",{username:username,password:password},function(res){

console.log(res);

if(res.status==="ok"){

kelas=res.kelas;

document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

document.getElementById("userInfo").innerHTML="👤 "+username+" | "+kelas;
document.getElementById("statusUjian").style.display="block";
document.getElementById("btnLogout").style.display="block";

loadSoal();
timer();

}else{
alert("Username atau Password salah!");
}

});

}

// ================= LOAD SOAL =================
function loadSoal(){

gas("getSoal",{},function(data){

soal=data;
jawaban=[];

var nomorHTML="";

data.forEach((s,i)=>{
jawaban.push("");
nomorHTML += "<span id='n"+i+"' onclick='goto("+i+")'>"+(i+1)+"</span>";
});

document.getElementById("nomor").innerHTML=nomorHTML;

tampil();

});

}

// ================= TAMPIL =================
function tampil(){

var s=soal[no];
var huruf=["A","B","C","D","E"];

var html="<b>"+(no+1)+".</b> "+s.pertanyaan;

s.opsi.forEach((o,i)=>{
var aktif = jawaban[no]==o.key ? "aktif":"";

html += `
<div class="opsi ${aktif}" onclick="jawab('${o.key}',this)">
<div class="circle">${huruf[i]}</div>
<div>${o.text}</div>
</div>
`;
});

document.getElementById("soal").innerHTML=html;

}

// ================= JAWAB =================
function jawab(v,el){

jawaban[no]=v;

document.querySelectorAll(".opsi").forEach(x=>x.classList.remove("aktif"));
el.classList.add("aktif");

document.getElementById("n"+no).classList.add("dijawab");

updateProgress();

}

// ================= NAV =================
function next(){ if(no<soal.length-1){no++;tampil();} }
function prev(){ if(no>0){no--;tampil();} }
function goto(n){ no=n; tampil(); }

// ================= PROGRESS =================
function updateProgress(){
var j = jawaban.filter(x=>x!="").length;
document.getElementById("progressBar").style.width = (j/soal.length*100)+"%";
}

// ================= KIRIM =================
function kirim(){

if(sudahSubmit) return;

gas("submitJawaban",{
jawaban:jawaban,
username:username,
kelas:kelas
},function(nilai){

alert("Nilai Anda: "+nilai);

sudahSubmit=true;
document.getElementById("btnKirim").disabled=true;

document.getElementById("statusUjian").innerHTML="Sudah Mengerjakan";
document.getElementById("statusUjian").classList.remove("belum");
document.getElementById("statusUjian").classList.add("sudah");

});

}

// ================= TIMER =================
function timer(){
setInterval(()=>{
waktu--;
var m=Math.floor(waktu/60);
var d=waktu%60;
if(d<10)d="0"+d;

document.getElementById("timer").innerHTML="⏱️ "+m+":"+d;

if(waktu<=0) kirim();

},1000);
}

// ================= LOGOUT =================
function logout(){
if(confirm("Logout?")){
location.reload();
}
}

</script>

</body>
</html>
