<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Try Out UP PPG</title>

<style>

body{
font-family:'Segoe UI';
background:#f1f5f9;
margin:0;
}

.container{
max-width:900px;
width:95%;
margin:auto;
margin-top:20px;
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
}

.userBox{
text-align:center;
min-width:160px;
}

.userInfo{
font-size:14px;
font-weight:600;
}

.status{
font-size:13px;
margin-top:4px;
display:none;
}

.status.belum{color:#f59e0b;}
.status.sudah{color:#22c55e;}

#btnLogout{
margin-top:6px;
background:#ef4444;
display:none;
}

.logo{
display:block;
margin:auto;
width:90px;
margin-bottom:10px;
}

h2{
text-align:center;
margin-bottom:20px;
font-weight:700;
color:#1e293b;
}

.loginBox{
max-width:320px;
margin:auto;
}

.loginBox label{
display:block;
margin-top:12px;
}

.inputBox,
select{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-top:4px;
box-sizing:border-box;
display:block;
}

select{
appearance:none;
-webkit-appearance:none;
-moz-appearance:none;
background:white;
}

.passwordCheck{
margin-top:8px;
display:flex;
align-items:center;
gap:8px;
font-size:13px;
}

.passwordCheck input{
width:auto;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
font-weight:500;
width:100%;
}

button:disabled{
background:#94a3b8;
cursor:not-allowed;
}

#nomor{
display:flex;
flex-wrap:wrap;
margin-top:10px;
}

#nomor span{
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
margin:3px;
background:#e2e8f0;
border-radius:6px;
cursor:pointer;
font-size:13px;
}

.dijawab{
background:#22c55e!important;
color:white;
}

#progressBox{
height:8px;
background:#e5e7eb;
border-radius:10px;
margin-top:10px;
}

#progressBar{
height:8px;
width:0%;
background:#2563eb;
border-radius:10px;
}

#soal{
margin-top:15px;
}

.soalText{
text-align:justify;
line-height:1.6;
}

.opsi{
display:flex;
align-items:center;
gap:12px;
padding:12px;
border-radius:12px;
cursor:pointer;
margin-bottom:10px;
transition:0.25s;
border:2px solid #e2e8f0;
}

.opsi:hover{
background:#f8fafc;
}

.circle{
width:34px;
height:34px;
border-radius:50%;
border:2px solid #94a3b8;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:#334155;
transition:0.25s;
}

.teks{
flex:1;
text-align:justify;
line-height:1.5;
}

.opsi.aktif{
border:2px solid #2563eb;
background:#eff6ff;
}

.opsi.aktif .circle{
background:#2563eb;
color:white;
border-color:#2563eb;
}

@keyframes bounceClick{
0%{transform:scale(1);}
30%{transform:scale(1.2);}
60%{transform:scale(0.9);}
100%{transform:scale(1);}
}

.bounce{
animation:bounceClick 0.3s ease;
}

.navBtn{
display:flex;
gap:10px;
margin-top:15px;
}

.navBtn button{
flex:1;
}

#tokenBox{
transition:all 0.3s ease;
}

@media(max-width:600px){
.soalText{font-size:14px;}
.teks{font-size:14px;}
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<div></div>

<div class="userBox">
<div class="userInfo" id="userInfo"></div>
<div class="status belum" id="statusUjian">Belum Mengerjakan</div>
<button id="btnLogout" onclick="logout()">Logout</button>
</div>
</div>

<img class="logo" src="https://yanuar-moga.github.io/app/ppg/up/assets/logo.png">

<h2>CBT Try Out UP PPG</h2>

<div id="login" class="loginBox">

<label>Kelas</label>
<select id="kelas"></select>

<label>Nama</label>
<select id="nama"></select>

<label>Password</label>
<input type="password" id="password" class="inputBox">

<div class="passwordCheck">
<input type="checkbox" id="showPass" onclick="lihatPassword()">
<label for="showPass">Tampilkan Password</label>
</div>

<div id="tokenBox" style="display:none;">
<label>Token</label>
<input type="password" id="token" class="inputBox" placeholder="Masukkan token">
</div>

<br>
<button onclick="login()">Login</button>

</div>

<div id="ujian" style="display:none">

<div id="timer"></div>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<div id="nomor"></div>

<div id="soal"></div>

<div class="navBtn">
<button onclick="prev()">Prev</button>
<button id="btnKirim" onclick="kirim()">Selesai</button>
<button onclick="next()">Next</button>
</div>

</div>

</div>

<script>

var URL_SCRIPT="https://script.google.com/macros/s/AKfycbxshIulNSOovCjQKY8aDklsXFJGYnYF1CXlGHsiMpOafLI_xqlV6Vwjynj-8s9aoms2/exec";

var soal=[],jawaban=[],no=0;
var nama,jk,kelas,level="normal";
var waktu=0;
var sudahSubmit=false;

function gas(func,data,callback){
fetch(URL_SCRIPT,{
method:"POST",
body:JSON.stringify({func:func,data:data})
})
.then(res=>res.json())
.then(callback);
}

function lihatPassword(){
var p=document.getElementById("password");
p.type = (p.type==="password") ? "text" : "password";
}

function cekKelas(){

var k = document.getElementById("kelas").value;
var tokenBox = document.getElementById("tokenBox");
var tokenInput = document.getElementById("token");

k = k.toLowerCase().trim();

if(k === "free"){
tokenBox.style.display = "block";
tokenInput.value = "12345CBT";
}else{
tokenBox.style.display = "none";
tokenInput.value = "";
}

}

function login(){

nama=document.getElementById("nama").value;
var password=document.getElementById("password").value;
var token=document.getElementById("token").value;

if(!nama||!password){alert("Lengkapi login!");return;}

gas("login",{nama:nama,password:password,token:token},function(res){

if(res.status=="ok"){

jk=res.jk;
kelas=res.kelas;
level=res.level || "normal";

localStorage.setItem("nama",nama);
localStorage.setItem("kelas",kelas);
localStorage.setItem("jk",jk);
localStorage.setItem("level",level);

document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

document.getElementById("userInfo").innerHTML="👤 "+nama+" | "+kelas+" | "+level;
document.getElementById("btnLogout").style.display="block";
document.getElementById("statusUjian").style.display="block";

loadSoal();

}else alert(res.pesan || "Login gagal");

});

}

function loadKelas(){
gas("getKelas",{},function(data){
var k=document.getElementById("kelas");
k.innerHTML="<option value=''>Pilih Kelas</option>";
data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
k.appendChild(o);
});
});
}

function loadNama(){

kelas=document.getElementById("kelas").value;

if(!kelas){
document.getElementById("nama").innerHTML="<option>Pilih Nama</option>";
return;
}

gas("getNama",{kelas:kelas},function(data){

var n=document.getElementById("nama");
n.innerHTML="<option>Pilih Nama</option>";

data.forEach(x=>{
var o=document.createElement("option");
o.value=x;
o.text=x;
n.appendChild(o);
});

});
}

function loadSoal(){

gas("getSoal",{},function(data){

if(level.toLowerCase()=="free"){
soal = data.slice(0,10);
waktu = 20 * 60;
}else{
soal = data;
waktu = 30 * 60;
}

jawaban=[];

document.getElementById("nomor").innerHTML="";

soal.forEach((s,i)=>{
jawaban.push("");
document.getElementById("nomor").innerHTML+=
"<span id='n"+i+"' onclick='goto("+i+")'>"+(i+1)+"</span>";
});

tampil();
timer();

});

}

function tampil(){

var s=soal[no];

var html="<div class='soalText'><b>"+(no+1)+".</b> "+s.pertanyaan+"</div>";

if(s.gambar && s.gambar.trim()!=""){
html+="<img src='"+s.gambar+"' style='max-width:100%;margin:10px 0;border-radius:10px'><br>";
}

var huruf=["A","B","C","D","E"];

s.opsi.forEach((o,i)=>{
var aktif=jawaban[no]==o.key?"aktif":"";

html+=`
<div class="opsi ${aktif}" onclick="jawab('${o.key}', this)">
<div class="circle">${huruf[i]}</div>
<div class="teks">${o.text}</div>
</div>
`;
});

document.getElementById("soal").innerHTML=html;

}

function jawab(v,el){

jawaban[no]=v;

document.querySelectorAll(".opsi").forEach(x=>x.classList.remove("aktif"));
el.classList.add("aktif");

var c = el.querySelector(".circle");
c.classList.remove("bounce");
void c.offsetWidth;
c.classList.add("bounce");

document.getElementById("n"+no).classList.add("dijawab");

updateProgress();

}

function next(){if(no<soal.length-1){no++;tampil();}}
function prev(){if(no>0){no--;tampil();}}
function goto(n){no=n;tampil();}

function updateProgress(){
var j=jawaban.filter(x=>x!="").length;
document.getElementById("progressBar").style.width=(j/soal.length*100)+"%";
}

function kirim(){

if(sudahSubmit) return;

gas("submitJawaban",{
jawaban:jawaban,
nama:nama,
kelas:kelas
},function(nilai){

alert("Nilai Anda : "+nilai);

sudahSubmit=true;
document.getElementById("btnKirim").disabled=true;

document.getElementById("statusUjian").innerHTML="Sudah Mengerjakan";
document.getElementById("statusUjian").classList.remove("belum");
document.getElementById("statusUjian").classList.add("sudah");

localStorage.clear();

});

}

function timer(){
setInterval(()=>{
waktu--;
var m=Math.floor(waktu/60);
var d=waktu%60;
d=d<10?"0"+d:d;
document.getElementById("timer").innerHTML="⏱️ "+m+":"+d;
if(waktu<=0) kirim();
},1000);
}

function logout(){
if(confirm("Logout?")){
localStorage.clear();
location.reload();
}
}

window.onload=function(){

loadKelas();

var n=localStorage.getItem("nama");
var k=localStorage.getItem("kelas");

if(n&&k){

nama=n;
kelas=k;
jk=localStorage.getItem("jk");
level=localStorage.getItem("level") || "normal";

document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

document.getElementById("userInfo").innerHTML="👤 "+nama+" | "+kelas+" | "+level;
document.getElementById("btnLogout").style.display="block";
document.getElementById("statusUjian").style.display="block";

loadSoal();

}

window.onbeforeunload=function(){
return "Ujian sedang berlangsung!";
}

}

document.getElementById("kelas").addEventListener("change",function(){
loadNama();
cekKelas();
});

</script>

</body>
</html>
