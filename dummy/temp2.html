<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071426">
<title>Secure Verification | Premium</title>

<style>
:root {
  --navy:#071426;
  --blue:#6485ff;
  --cyan:#59e7ff;
  --green:#38edb0;
  --red:#ff647b;
  --text:#f4f7ff;
  --muted:#9aaac7;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:24px 16px;
  overflow-x:hidden;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 15% 10%,#163c70 0,transparent 40%),
    radial-gradient(ellipse at 90% 85%,#075749 0,transparent 38%),
    linear-gradient(145deg,#050b18,#0a1930 55%,#061421);
}

button { font:inherit; }

.ambient {
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.ambient::before,
.ambient::after {
  content:"";
  position:absolute;
  width:360px;
  height:360px;
  border-radius:50%;
  filter:blur(85px);
  opacity:.23;
  animation:ambientFloat 12s ease-in-out infinite alternate;
}

.ambient::before {
  background:#476bff;
  top:-170px;
  right:-100px;
}

.ambient::after {
  background:#16d9ac;
  bottom:-190px;
  left:-100px;
  animation-delay:-6s;
}

.particle {
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#9cecff;
  box-shadow:0 0 12px #59e7ff;
  opacity:0;
  animation:particleRise var(--duration,9s) linear infinite;
  animation-delay:var(--delay,0s);
}

.card {
  position:relative;
  z-index:1;
  width:100%;
  max-width:400px;
  padding:32px 27px 25px;
  border:1px solid rgba(181,209,255,.18);
  border-radius:30px;
  text-align:center;
  overflow:hidden;
  background:
    linear-gradient(145deg,rgba(255,255,255,.105),
    rgba(255,255,255,.025));
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  box-shadow:
    0 35px 100px #0008,
    inset 0 1px 0 #ffffff20;
  animation:cardEnter .85s cubic-bezier(.16,1,.3,1) both;
}

.card::before {
  content:"";
  position:absolute;
  inset:0 10% auto;
  height:1px;
  background:linear-gradient(90deg,transparent,#8bdfff,
  #a2ffe3,transparent);
  opacity:.8;
}

.card::after {
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  top:-125px;
  left:-120px;
  border-radius:50%;
  background:#7ba4ff;
  filter:blur(75px);
  opacity:.12;
  pointer-events:none;
}

.brand {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:27px;
  color:#c2cce0;
  font-size:11px;
  font-weight:800;
  letter-spacing:2.5px;
}

.brand-icon {
  display:grid;
  place-items:center;
  width:29px;
  height:29px;
  border:1px solid #9db8ff55;
  border-radius:10px;
  color:#fff;
  background:linear-gradient(135deg,#668bff,#6554d9);
  box-shadow:0 0 24px #617fff40;
}

.brand-icon svg {
  width:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.5;
}

.icon-stage {
  position:relative;
  width:130px;
  height:130px;
  margin:0 auto 24px;
  display:grid;
  place-items:center;
  border-radius:37px;
  background:
    radial-gradient(circle at 50% 35%,#354d77aa,transparent 70%),
    #101e36;
  border:1px solid #a6c4ff20;
  box-shadow:
    inset 0 0 30px #8caeff0c,
    0 15px 45px #0002;
}

.icon-stage::before,
.icon-stage::after {
  content:"";
  position:absolute;
  inset:-8px;
  border:1px solid #70a1ff2b;
  border-radius:42px;
  animation:orbit 12s linear infinite;
}

.icon-stage::after {
  inset:-15px;
  border-color:#4de9d51a;
  border-radius:47px;
  animation:orbit 18s linear infinite reverse;
}

.main-icon {
  position:relative;
  z-index:2;
  display:grid;
  place-items:center;
  width:72px;
  height:72px;
  border:1px solid #ffffff50;
  border-radius:24px;
  color:white;
  background:linear-gradient(145deg,#62eac0,#079b83);
  box-shadow:
    0 0 35px #32edb03a,
    inset 0 1px 0 #ffffff80;
  transition:background .4s,box-shadow .4s;
}

.main-icon svg {
  width:34px;
  height:34px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
}

h1 {
  font-size:25px;
  font-weight:800;
  letter-spacing:-.8px;
  margin-bottom:10px;
}

.subtitle {
  min-height:44px;
  margin-bottom:24px;
  color:var(--muted);
  font-size:13px;
  line-height:1.75;
}

.pin-dots {
  display:flex;
  justify-content:center;
  gap:14px;
  margin-bottom:28px;
}

.pin-dot {
  position:relative;
  width:12px;
  height:12px;
  border:1.5px solid #687b9b;
  border-radius:50%;
  transition:transform .25s,border-color .25s,background .25s,
    box-shadow .25s;
}

.pin-dot.filled {
  transform:scale(1.2);
  border-color:var(--cyan);
  background:var(--cyan);
  box-shadow:0 0 15px #59e7ff80;
  animation:dotPop .25s cubic-bezier(.2,1.7,.4,1);
}

.keypad {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  transition:opacity .3s;
}

.key {
  position:relative;
  min-width:0;
  min-height:58px;
  overflow:hidden;
  border:1px solid #a5bbdf20;
  border-radius:17px;
  color:#f1f5ff;
  background:linear-gradient(145deg,#ffffff12,#ffffff05);
  box-shadow:inset 0 1px 0 #ffffff0b;
  font-size:21px;
  font-weight:650;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .18s,border-color .2s,
    background .2s,box-shadow .2s;
}

.key::after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(115deg,transparent 25%,
    #ffffff12 48%,transparent 68%);
  transform:translateX(-130%);
  transition:transform .5s;
  pointer-events:none;
}

@media (hover:hover) {
  .key:hover {
    transform:translateY(-2px);
    border-color:#83b3ff70;
    background:linear-gradient(145deg,#ffffff1b,#6485ff12);
    box-shadow:0 8px 24px #0002,0 0 16px #6485ff0c;
  }

  .key:hover::after { transform:translateX(130%); }
}

.key:active {
  transform:scale(.94);
  background:#6485ff30;
}

.key.utility {
  font-size:12px;
  color:#b2bfd7;
  background:#ffffff07;
}

.key svg {
  width:20px;
  height:20px;
  vertical-align:middle;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.status {
  min-height:19px;
  margin-top:19px;
  color:#9baac4;
  font-size:12px;
  font-weight:600;
  line-height:1.6;
}

.secure {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:19px;
  color:#72eac3;
  font-size:11px;
  font-weight:700;
  letter-spacing:.3px;
}

.secure svg {
  width:16px;
  height:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.footer {
  margin-top:23px;
  padding-top:17px;
  border-top:1px solid #ffffff0c;
  color:#6f809d;
  font-size:9px;
  letter-spacing:2px;
}

.action-btn {
  width:100%;
  min-height:48px;
  margin-top:15px;
  border:1px solid #ffffff20;
  border-radius:15px;
  color:white;
  background:linear-gradient(110deg,#557bff,#7761f3,#4d8eff);
  background-size:200% 100%;
  box-shadow:0 8px 28px #557bff30;
  font-size:13px;
  font-weight:750;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s;
}

.action-btn:active {
  transform:scale(.97);
}

.hidden { display:none!important; }

/* VERIFY */
.loading .main-icon {
  background:linear-gradient(145deg,#7094ff,#554fe3);
  box-shadow:0 0 38px #6485ff65;
  animation:iconPulse 1.1s ease-in-out infinite;
}

.loading .icon-stage::before {
  border-top-color:#86a8ff;
  border-right-color:#86a8ff;
  animation:orbit .8s linear infinite;
}

.loading .icon-stage::after {
  border-bottom-color:#5ce9dc;
  animation:orbit 1.2s linear infinite reverse;
}

.loading #iconSvg {
  animation:iconRotate 2s linear infinite;
}

.loading .keypad {
  opacity:.15;
  pointer-events:none;
}

/* SUCCESS */
.success .main-icon {
  background:linear-gradient(145deg,#4df1bd,#079c77);
  animation:successPop .65s cubic-bezier(.2,1.6,.4,1);
  box-shadow:0 0 45px #38edb05c;
}

.success .icon-stage {
  animation:successGlow 1.5s ease-in-out infinite alternate;
}

.success .icon-stage::before {
  border-color:#38edb070;
  animation:orbit 5s linear infinite;
}

/* ERROR */
.error .main-icon {
  background:linear-gradient(145deg,#ff899e,#df3659);
  box-shadow:0 0 35px #ff647b40;
}

.error .icon-stage::before {
  border-color:#ff647b50;
}

.error .pin-dot {
  border-color:#ff647b;
  background:#ff647b;
  box-shadow:0 0 10px #ff647b50;
}

.shake { animation:shake .38s ease-in-out; }

@keyframes cardEnter {
  from { opacity:0; transform:translateY(28px) scale(.96); filter:blur(8px); }
  to { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}

@keyframes ambientFloat {
  to { transform:translate(60px,35px) scale(1.15); }
}

@keyframes particleRise {
  0% { transform:translateY(20px); opacity:0; }
  15% { opacity:.8; }
  85% { opacity:.35; }
  100% { transform:translateY(-110vh) translateX(35px); opacity:0; }
}

@keyframes orbit {
  to { transform:rotate(360deg); }
}

@keyframes dotPop {
  from { transform:scale(.5); }
  to { transform:scale(1.2); }
}

@keyframes iconPulse {
  50% { transform:scale(1.06); }
}

@keyframes iconRotate {
  to { transform:rotate(360deg); }
}

@keyframes successPop {
  0% { transform:scale(.5) rotate(-12deg); }
  65% { transform:scale(1.15) rotate(4deg); }
  100% { transform:scale(1) rotate(0); }
}

@keyframes successGlow {
  to { box-shadow:0 0 45px #38edb020; }
}

@keyframes shake {
  0%,100% { transform:translateX(0); }
  25%,75% { transform:translateX(-6px); }
  50% { transform:translateX(6px); }
}

@media(max-width:380px) {
  .card { padding:28px 19px 22px; }
  .key { min-height:53px; }
  .pin-dots { gap:12px; }
  h1 { font-size:23px; }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>
<div class="ambient" id="ambient" aria-hidden="true"></div>

<main class="card" id="card">
  <div class="brand">
    <span class="brand-icon">
      <svg viewBox="0 0 24 24">
        <path d="M5 12l4 4L19 6"/>
      </svg>
    </span>
    SECURE ACCESS
  </div>

  <div class="icon-stage">
    <div class="main-icon" id="mainIcon">
      <svg id="iconSvg" viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7"/>
      </svg>
    </div>
  </div>

  <h1 id="title">Verification PIN</h1>

  <p class="subtitle" id="subtitle">
    Masukkan PIN 6 digit Anda untuk melanjutkan dengan aman.
  </p>

  <div class="pin-dots" id="pinDots" aria-label="PIN enam digit">
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
  </div>

  <div class="keypad" id="keypad">
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>

    <button class="key utility" data-key="clear">Hapus</button>
    <button class="key" data-key="0">0</button>
    <button class="key utility" data-key="back"
      aria-label="Hapus satu digit">
      <svg viewBox="0 0 24 24">
        <path d="M9 5H20V19H9L3 12L9 5Z"/>
        <path d="M12 9L17 15M17 9L12 15"/>
      </svg>
    </button>
  </div>

  <p class="status" id="status" aria-live="polite">
    PIN Anda bersifat rahasia.
  </p>

  <button class="action-btn hidden" id="retry">
    Coba Lagi
  </button>

  <div class="secure" id="secure">
    <svg viewBox="0 0 24 24">
      <rect x="4" y="10" width="16" height="11" rx="2"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    </svg>
    Protected &amp; Secure
  </div>

  <div class="footer">SECURE VERIFICATION SYSTEM</div>
</main>

<script>
(() => {
  // Ganti PIN untuk keperluan demo.
  const CORRECT_PIN = "123456";
  const PIN_LENGTH = 6;

  let pin = "";
  let busy = false;
  let completed = false;
  let timer = null;

  const $ = id => document.getElementById(id);

  const card = $("card");
  const dots = [...document.querySelectorAll(".pin-dot")];
  const keypad = $("keypad");
  const title = $("title");
  const subtitle = $("subtitle");
  const status = $("status");
  const iconSvg = $("iconSvg");
  const retry = $("retry");
  const secure = $("secure");

  const icons = {
    check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    lock:
      '<rect x="5" y="10" width="14" height="11" rx="2"/>' +
      '<path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    spinner:
      '<path d="M12 3a9 9 0 1 0 9 9"/>' +
      '<path d="M12 3v5l4 2"/>'
  };

  // Partikel ringan, tanpa library tambahan.
  const ambient = $("ambient");

  for (let i = 0; i < 18; i++) {
    const particle = document.createElement("span");
    particle.className = "particle";
    particle.style.left = (Math.random() * 100) + "%";
    particle.style.top = (45 + Math.random() * 55) + "%";
    particle.style.setProperty(
      "--duration", (7 + Math.random() * 10) + "s"
    );
    particle.style.setProperty(
      "--delay", (-Math.random() * 15) + "s"
    );
    ambient.appendChild(particle);
  }

  function renderDots(error = false) {
    dots.forEach((dot, i) => {
      dot.classList.toggle("filled", !error && i < pin.length);
      dot.classList.toggle("error", error);
    });
  }

  function setStatus(message, color = "") {
    status.textContent = message;
    status.style.color = color;
  }

  function resetVisual() {
    if (timer !== null) {
      clearTimeout(timer);
      timer = null;
    }

    card.classList.remove(
      "loading", "success", "error", "shake"
    );

    pin = "";
    busy = false;
    completed = false;

    iconSvg.innerHTML = icons.check;
    keypad.classList.remove("hidden");
    retry.classList.add("hidden");

    secure.classList.remove("hidden");
    secure.innerHTML =
      '<svg viewBox="0 0 24 24">' +
      '<rect x="4" y="10" width="16" height="11" rx="2"/>' +
      '<path d="M8 10V7a4 4 0 0 1 8 0v3"/>' +
      '</svg> Protected &amp; Secure';

    title.textContent = "Verification PIN";
    subtitle.textContent =
      "Masukkan PIN 6 digit Anda untuk melanjutkan dengan aman.";

    setStatus("PIN Anda bersifat rahasia.");
    renderDots();
  }

  function enterDigit(digit) {
    if (busy || completed || pin.length >= PIN_LENGTH) return;

    pin += digit;
    renderDots();

    if (pin.length === PIN_LENGTH) verifyPin();
  }

  function verifyPin() {
    busy = true;

    card.classList.remove("error", "shake");
    card.classList.add("loading");

    iconSvg.innerHTML = icons.spinner;
    title.textContent = "Memverifikasi...";
    subtitle.textContent =
      "Mohon tunggu, sistem sedang memeriksa PIN Anda.";
    setStatus("Memproses autentikasi...");

    keypad.classList.add("hidden");

    timer = window.setTimeout(() => {
      timer = null;
      card.classList.remove("loading");

      if (pin === CORRECT_PIN) {
        completed = true;
        card.classList.add("success");

        iconSvg.innerHTML = icons.check;
        title.textContent = "Verification Successful";
        subtitle.textContent =
          "PIN berhasil diverifikasi. Akses Anda telah dikonfirmasi.";

        setStatus("Verifikasi berhasil!", "#55efb6");

        secure.innerHTML =
          '<svg viewBox="0 0 24 24">' +
          '<path d="M5 12l4 4L19 6"/>' +
          '</svg> Identity Verified';

        // Tambahkan aksi setelah PIN benar di sini.
        // Contoh: window.location.href = "dashboard.html";

      } else {
        busy = false;
        card.classList.add("error", "shake");

        iconSvg.innerHTML = icons.lock;
        title.textContent = "PIN Tidak Sesuai";
        subtitle.textContent =
          "PIN yang Anda masukkan salah. Silakan coba kembali.";

        setStatus("PIN salah, periksa kembali.", "#ff8197");
        renderDots(true);

        retry.classList.remove("hidden");
        secure.classList.add("hidden");

        window.setTimeout(() => {
          card.classList.remove("shake");
        }, 450);
      }
    }, 1050);
  }

  function editPin(action) {
    if (busy || completed) return;

    if (action === "clear") {
      pin = "";
      setStatus("PIN telah dihapus.");
    } else {
      pin = pin.slice(0, -1);
    }

    renderDots();
  }

  keypad.addEventListener("click", event => {
    const button = event.target.closest("button[data-key]");
    if (!button) return;

    const key = button.dataset.key;

    if (key === "clear" || key === "back") {
      editPin(key);
      return;
    }

    if (/^\d$/.test(key)) enterDigit(key);
  });

  retry.addEventListener("click", resetVisual);

  document.addEventListener("keydown", event => {
    if (/^\d$/.test(event.key)) {
      event.preventDefault();
      enterDigit(event.key);
    } else if (event.key === "Backspace") {
      event.preventDefault();
      editPin("back");
    } else if (event.key === "Escape") {
      editPin("clear");
    }
  });
})();
</script>
</body>
</html>
