<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIN Verification</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --green: #19b981;
  --dark-green: #07865f;
  --blue: #4263eb;
  --text: #17212f;
  --muted: #8992a3;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 15%, #dce9ff 0, transparent 42%),
    radial-gradient(ellipse at 85% 85%, #d8f8eb 0, transparent 42%),
    #f5f7fb;
  overflow-x: hidden;
}

.bg-orb {
  position: fixed;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  filter: blur(65px);
  opacity: .42;
  z-index: -1;
  animation: float 8s ease-in-out infinite alternate;
}

.orb1 {
  background: #8bb5ff;
  top: -70px;
  right: -50px;
}

.orb2 {
  background: #83eac1;
  bottom: -70px;
  left: -50px;
  animation-delay: -3s;
}

.card {
  position: relative;
  width: 100%;
  max-width: 390px;
  padding: 36px 27px 30px;
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 30px;
  text-align: center;
  background: rgba(255,255,255,.84);
  box-shadow: 0 25px 75px rgba(36, 57, 92, .12);
  backdrop-filter: blur(20px);
  animation: cardIn .7s cubic-bezier(.2,.8,.2,1) both;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 25px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #778398;
}

.brand-icon {
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: white;
  background: linear-gradient(135deg, #4975ff, #7658e9);
  box-shadow: 0 5px 15px #5978f64a;
}

.icon-stage {
  width: 112px;
  height: 112px;
  margin: 0 auto 24px;
  display: grid;
  place-items: center;
  border-radius: 32px;
  background: linear-gradient(145deg, #edf2ff, #f1f6ff);
  box-shadow: inset 0 0 25px #ffffff;
  animation: breathe 3s ease-in-out infinite;
}

.main-icon {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: white;
  background: linear-gradient(145deg, #29d49a, #12a975);
  box-shadow: 0 10px 25px #19b98150;
  transition: background .3s, transform .3s;
}

.main-icon svg {
  width: 34px;
  height: 34px;
  stroke: currentColor;
  fill: none;
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

h1 {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -.8px;
  margin-bottom: 10px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 27px;
}

.pin-dots {
  display: flex;
  justify-content: center;
  gap: 13px;
  margin-bottom: 25px;
}

.pin-dot {
  width: 13px;
  height: 13px;
  border: 2px solid #d7ddea;
  border-radius: 50%;
  background: transparent;
  transition: .2s ease;
}

.pin-dot.filled {
  border-color: var(--blue);
  background: var(--blue);
  transform: scale(1.15);
  box-shadow: 0 0 12px #4263eb35;
}

.pin-dot.error {
  background: #f04452;
  border-color: #f04452;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.key {
  min-height: 57px;
  border: 1px solid #edf0f6;
  border-radius: 16px;
  background: #fff;
  color: #273449;
  font-size: 22px;
  font-weight: 650;
  cursor: pointer;
  box-shadow: 0 3px 8px #182c4c08;
  transition: transform .15s, background .15s,
              box-shadow .15s;
  -webkit-tap-highlight-color: transparent;
}

.key:active {
  transform: scale(.92);
  background: #edf2ff;
}

.key.utility {
  font-size: 13px;
  color: #69768b;
  background: #f7f9fc;
}

.key svg {
  width: 20px;
  height: 20px;
  vertical-align: middle;
}

.status {
  min-height: 22px;
  margin-top: 18px;
  font-size: 12px;
  font-weight: 600;
  color: #929bad;
}

.secure {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  margin-top: 20px;
  color: #14a77b;
  font-size: 12px;
  font-weight: 700;
}

.secure svg {
  width: 15px;
  height: 15px;
}

.footer {
  margin-top: 20px;
  color: #a5adbb;
  font-size: 10px;
  letter-spacing: 1px;
}

/* Animasi proses */
.loading .main-icon {
  background: linear-gradient(145deg, #6c8aff, #4263eb);
  animation: spinPulse 1s linear infinite;
}

.loading .main-icon svg {
  animation: rotate 1.5s linear infinite;
}

.success .main-icon {
  background: linear-gradient(145deg, #36dda2, #0ba56f);
  animation: successPop .55s cubic-bezier(.2,1.5,.5,1) both;
}

.success .icon-stage {
  background: #e8fff4;
  animation: successGlow 1.4s ease-in-out infinite alternate;
}

.error .main-icon {
  background: linear-gradient(145deg, #ff7c85, #e63946);
}

.shake {
  animation: shake .4s ease-in-out;
}

.hidden {
  display: none !important;
}

.action-btn {
  width: 100%;
  margin-top: 17px;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  color: white;
  background: linear-gradient(135deg, #4263eb, #7556e8);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 7px 20px #4263eb30;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(25px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes float {
  from { transform: translate(0,0); }
  to { transform: translate(35px,-25px); }
}

@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes successPop {
  0% { transform: scale(.4); }
  70% { transform: scale(1.17); }
  100% { transform: scale(1); }
}

@keyframes successGlow {
  from { box-shadow: 0 0 15px #19b98112; }
  to { box-shadow: 0 0 35px #19b98135; }
}

@keyframes spinPulse {
  50% { box-shadow: 0 0 30px #4263eb55; }
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-7px); }
  40%,80% { transform: translateX(7px); }
}

@media (max-width: 380px) {
  .card { padding: 28px 19px 24px; }
  .key { min-height: 52px; }
  .pin-dots { gap: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<main class="card" id="card">
  <div class="brand">
    <span class="brand-icon">✓</span>
    SECURE ACCESS
  </div>

  <div class="icon-stage">
    <div class="main-icon" id="mainIcon">
      <svg id="iconSvg" viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7"/>
      </svg>
    </div>
  </div>

  <h1 id="title">Verification PIN</h1>
  <p class="subtitle" id="subtitle">
    Masukkan PIN 6 digit Anda untuk melanjutkan dengan aman.
  </p>

  <div class="pin-dots" id="pinDots">
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
  </div>

  <div class="keypad" id="keypad">
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>

    <button class="key utility" data-key="clear">Hapus</button>
    <button class="key" data-key="0">0</button>
    <button class="key utility" data-key="back" aria-label="Hapus satu digit">
      ⌫
    </button>
  </div>

  <p class="status" id="status" aria-live="polite">
    PIN Anda bersifat rahasia.
  </p>

  <button class="action-btn hidden" id="retry">
    Coba Lagi
  </button>

  <div class="secure" id="secure">
    <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.2">
      <rect x="4" y="10" width="16" height="11" rx="2"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    </svg>
    Protected &amp; Secure
  </div>

  <div class="footer">SECURE VERIFICATION SYSTEM</div>
</main>

<script>
(() => {
  // GANTI PIN DI SINI
  const CORRECT_PIN = "123456";

  const PIN_LENGTH = 6;
  let pin = "";
  let busy = false;
  let completed = false;

  const card = document.getElementById("card");
  const dots = [...document.querySelectorAll(".pin-dot")];
  const keypad = document.getElementById("keypad");
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const status = document.getElementById("status");
  const mainIcon = document.getElementById("mainIcon");
  const iconSvg = document.getElementById("iconSvg");
  const retry = document.getElementById("retry");
  const secure = document.getElementById("secure");

  const checkIcon =
    '<path d="M5 12.5l4.5 4.5L19 7"/>';
  const lockIcon =
    '<rect x="5" y="10" width="14" height="11" rx="2"/>' +
    '<path d="M8 10V7a4 4 0 0 1 8 0v3"/>';
  const spinnerIcon =
    '<path d="M12 3a9 9 0 1 0 9 9"/>' +
    '<path d="M12 3v5l4 2"/>';

  function renderDots() {
    dots.forEach((dot, i) => {
      dot.classList.toggle("filled", i < pin.length);
      dot.classList.remove("error");
    });
  }

  function resetVisual() {
    card.classList.remove("loading", "success", "error", "shake");
    iconSvg.innerHTML = checkIcon;
    mainIcon.style.background = "";
    keypad.classList.remove("hidden");
    retry.classList.add("hidden");
    secure.classList.remove("hidden");
    busy = false;
    completed = false;
    pin = "";
    renderDots();
    title.textContent = "Verification PIN";
    subtitle.textContent =
      "Masukkan PIN 6 digit Anda untuk melanjutkan dengan aman.";
    status.textContent = "PIN Anda bersifat rahasia.";
    status.style.color = "";
  }

  function enterDigit(digit) {
    if (busy || completed || pin.length >= PIN_LENGTH) return;

    pin += digit;
    renderDots();

    if (pin.length === PIN_LENGTH) {
      verifyPin();
    }
  }

  function verifyPin() {
    busy = true;
    card.classList.add("loading");
    iconSvg.innerHTML = spinnerIcon;
    title.textContent = "Memverifikasi...";
    subtitle.textContent = "Mohon tunggu, PIN sedang diperiksa.";
    status.textContent = "Sedang memproses keamanan...";
    keypad.classList.add("hidden");

    // Simulasi proses. Hubungkan ke server untuk verifikasi nyata.
    window.setTimeout(() => {
      card.classList.remove("loading");

      if (pin === CORRECT_PIN) {
        completed = true;
        card.classList.add("success");
        iconSvg.innerHTML = checkIcon;
        title.textContent = "Verification Successful";
        subtitle.textContent =
          "PIN berhasil diverifikasi. Akses Anda telah dikonfirmasi.";
        status.textContent = "Verifikasi berhasil!";
        status.style.color = "#12a875";
        secure.innerHTML =
          "✓ &nbsp; Verified and secure";

        // Tempatkan aksi setelah verifikasi berhasil di sini.
        // Contoh: window.location.href = "dashboard.html";
      } else {
        busy = false;
        card.classList.add("error", "shake");
        iconSvg.innerHTML = lockIcon;
        title.textContent = "PIN Tidak Sesuai";
        subtitle.textContent =
          "PIN yang Anda masukkan salah. Silakan coba kembali.";
        status.textContent = "PIN salah, periksa kembali.";
        status.style.color = "#e63946";

        dots.forEach(dot => dot.classList.add("error"));
        retry.classList.remove("hidden");
        secure.classList.add("hidden");

        window.setTimeout(() => {
          card.classList.remove("shake");
        }, 450);
      }
    }, 1200);
  }

  keypad.addEventListener("click", event => {
    const button = event.target.closest("button[data-key]");
    if (!button) return;

    const key = button.dataset.key;

    if (key === "clear") {
      if (!busy && !completed) {
        pin = "";
        renderDots();
        status.textContent = "PIN telah dihapus.";
      }
      return;
    }

    if (key === "back") {
      if (!busy && !completed) {
        pin = pin.slice(0, -1);
        renderDots();
      }
      return;
    }

    if (/^\d$/.test(key)) enterDigit(key);
  });

  retry.addEventListener("click", resetVisual);

  // Dukungan keyboard fisik
  document.addEventListener("keydown", event => {
    if (/^\d$/.test(event.key)) {
      enterDigit(event.key);
    } else if (event.key === "Backspace") {
      if (!busy && !completed) {
        pin = pin.slice(0, -1);
        renderDots();
      }
    } else if (event.key === "Escape") {
      if (!busy && !completed) {
        pin = "";
        renderDots();
      }
    }
  });
})();
</script>
</body>
</html>
