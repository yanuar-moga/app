<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PANDA Mobile</title>
    <style>
        :root { 
            --primary: #4f46e5; 
            --bg: #f8fafc; 
            --card: rgba(255, 255, 255, 0.8);
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%); 
            margin: 0; padding: 20px; min-height: 100vh;
        }
        .container { 
            max-width: 450px; margin: 0 auto; 
            background: var(--card); backdrop-filter: blur(20px);
            padding: 25px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        h2 { color: #1e293b; font-size: 1.4rem; margin-bottom: 5px; }
        .progress-bar { height: 6px; background: #e2e8f0; border-radius: 10px; margin-bottom: 25px; }
        .progress-fill { height: 100%; background: var(--primary); width: 25%; border-radius: 10px; transition: 0.5s; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; color: #64748b; font-weight: 600; margin-bottom: 8px; }
        input, select { 
            width: 100%; padding: 14px; border: none; border-radius: 15px; 
            background: #f1f5f9; font-size: 1rem; box-sizing: border-box;
        }
        input:focus { outline: 2px solid var(--primary); }
        
        button { 
            width: 100%; padding: 16px; border: none; border-radius: 15px; 
            background: var(--primary); color: white; font-weight: 600; cursor: pointer;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.98); }
        
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    
    <div class="step active" id="s1">
        <h2>Identitas Diri</h2>
        <div class="form-group"><label>NAMA LENGKAP</label><input type="text"></div>
        <div class="form-group"><label>NO ABSEN</label><input type="number"></div>
        <button onclick="go(2, 50)">LANJUT</button>
    </div>

    </div>

<script>
    function go(s, p) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('s' + s).classList.add('active');
        document.getElementById('progress').style.width = p + '%';
    }
</script>
</body>
</html>
