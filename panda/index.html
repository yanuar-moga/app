<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>🐼 PANDA | Diagnostik</title>
    <style>
        :root { --primary: #003b95; --bg: #eef2f7; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .step { display: none; }
        .step.active { display: block; animation: slideIn 0.3s; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 12px; }
        label { font-size: 0.7rem; color: #555; font-weight: 700; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-top: 4px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        button.secondary { background: #6c757d; }
        button.close-modal { background: #e0e0e0; color: #333; margin-top: 10px; }
        footer { text-align: center; font-size: 0.7rem; color: #999; margin-top: 25px; cursor: pointer; }
        .modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align:center; margin-bottom:20px;">
        <img src="https://yanuar-moga.github.io/app/sipanda/assets/logo_sipanda.png" width="70">
        <h3 style="color:var(--primary); margin:5px 0 0 0;">PANDA</h3>
        <p style="font-size:0.75rem; color:#666; margin:0;">Pemetaan Anak melalui Diagnostik Awal</p>
    </div>

    <form id="pandaForm">
        <!-- Section 1 -->
        <div class="step active" id="step1">
            <h4 style="margin-top:0">Biodata Diri (1/3)</h4>
            <div class="form-group"><label>No Absen</label><input type="number" id="noAbsen" required></div>
            <div class="form-group"><label>Kelas</label><input type="text" id="kelas" required></div>
            <div class="form-group"><label>Nama Lengkap</label><input type="text" id="namaLengkap" required></div>
            <div class="form-group"><label>Nama Panggilan</label><input type="text" id="namaPanggilan" required></div>
            <div class="form-group"><label>Jenis Kelamin</label><select id="jk"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
            <div class="form-group"><label>Tempat Lahir</label><input type="text" id="tempatLahir" required></div>
            <div class="form-group"><label>Tgl Lahir</label><input type="date" id="tglLahir" required></div>
            <div class="form-group"><label>Alamat Lengkap</label><input type="text" id="alamat" required></div>
            <div class="form-group"><label>No WA Siswa</label><input type="text" id="noWaSiswa" required></div>
            <div class="form-group"><label>No WA Ortu</label><input type="text" id="noWaOrtu" required></div>
            <button type="button" onclick="go(2)">Lanjut ke Sesi 2</button>
        </div>

        <!-- Section 2 -->
        <div class="step" id="step2">
            <h4>Minat & Sekolah (2/3)</h4>
            <div class="form-group"><label>Hobi</label><input type="text" id="hobi"></div>
            <div class="form-group"><label>Cita-cita</label><input type="text" id="citaCita"></div>
            <div class="form-group"><label>No Induk Siswa</label><input type="text" id="nis"></div>
            <div class="form-group"><label>NISN</label><input type="number" id="nisn" required></div>
            <div class="form-group"><label>Pelajaran Disukai</label><input type="text" id="pelajaranSuka"></div>
            <div class="form-group"><label>Pelajaran Tdk Disukai</label><input type="text" id="pelajaranTdkSuka"></div>
            <div class="form-group"><label>Ekskul</label><input type="text" id="ekskul"></div>
            <div class="form-group"><label>Kegiatan Motivasi</label><input type="text" id="kegiatanMotivasi"></div>
            <div class="form-group"><label>Cara Belajar</label><select id="caraBelajar"><option value="Melihat video atau gambar">Melihat video atau gambar</option><option value="Mendengarkan guru atau podcast">Mendengarkan guru atau podcast</option><option value="Praktik langsung">Praktik langsung</option></select></div>
            <div class="btn-group">
                <button type="button" class="secondary" onclick="go(1)">Kembali</button>
                <button type="button" onclick="go(3)">Lanjut</button>
            </div>
        </div>

        <!-- Section 3 -->
        <div class="step" id="step3">
            <h4>Data Keluarga (3/3)</h4>
            <div class="form-group"><label>Nama Ayah</label><input type="text" id="namaAyah"></div>
            <div class="form-group"><label>Pekerjaan Ayah</label><input type="text" id="pekerjaanAyah"></div>
            <div class="form-group"><label>Pendidikan Ayah</label><input type="text" id="pendidikanAyah"></div>
            <div class="form-group"><label>Nama Ibu</label><input type="text" id="namaIbu"></div>
            <div class="form-group"><label>Pekerjaan Ibu</label><input type="text" id="pekerjaanIbu"></div>
            <div class="form-group"><label>Pendidikan Ibu</label><input type="text" id="pendidikanIbu"></div>
            <div class="form-group"><label>Topik dibicarakan dgn ortu</label><input type="text" id="topikOrtu"></div>
            <div class="form-group"><label>Harapan Orang Tua</label><input type="text" id="harapanOrtu"></div>
            <div class="form-group"><label>Punya KIP</label><select id="punyaKip"><option value="Ya">Ya</option><option value="Tidak">Tidak</option></select></div>
            <div class="form-group"><label>Status Yatim / Piatu</label><select id="statusYatimPiatu"><option value="Lengkap">Lengkap</option><option value="Yatim">Yatim</option><option value="Piatu">Piatu</option></select></div>
            <div class="form-group"><label>Riwayat Sakit</label><input type="text" id="riwayatSakit" placeholder="Contoh: Tipes, Kejang atau lainnya"></div>
            <div class="btn-group">
                <button type="button" class="secondary" onclick="go(2)">Kembali</button>
                <button type="submit" id="btnSubmit">SUBMIT DATA</button>
            </div>
        </div>
    </form>

    <footer onclick="document.getElementById('m').style.display='flex'">PANDA V 1.0</footer>
</div>

<div class="modal" id="m" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <img src="https://yanuar-moga.github.io/app/sipanda/assets/logo_sipanda.png" width="60">
        <p style="font-size:0.8rem; line-height:1.6; margin-top:10px;">
            <b>PANDA</b><br>
            Pemetaan Anak melalui Diagnostik Awal<br>
            Versi 1.0 Build 1 Juli 2026<br>
            Develop by MB<br>
            yanuar.b@gmail.com
        </p>
        <button class="close-modal" onclick="document.getElementById('m').style.display='none'">Tutup</button>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzPaWgz2zof9UTq-BRvvk5Nwcmz0pMwZAkEQfHne-k3RmUcKVWvG1VaxU9R-M_QmLI/exec";

    function go(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
        window.scrollTo(0,0);
    }

    document.getElementById('pandaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerText = "Mengirim..."; btn.disabled = true;

        const data = {
            action: "SUBMIT_SISWA_LENGKAP",
            noAbsen: document.getElementById('noAbsen').value,
            kelas: document.getElementById('kelas').value,
            namaLengkap: document.getElementById('namaLengkap').value,
            namaPanggilan: document.getElementById('namaPanggilan').value,
            jk: document.getElementById('jk').value,
            tempatLahir: document.getElementById('tempatLahir').value,
            tglLahir: document.getElementById('tglLahir').value,
            alamat: document.getElementById('alamat').value,
            noWaSiswa: document.getElementById('noWaSiswa').value,
            noWaOrtu: document.getElementById('noWaOrtu').value,
            hobi: document.getElementById('hobi').value,
            citaCita: document.getElementById('citaCita').value,
            nis: document.getElementById('nis').value,
            nisn: document.getElementById('nisn').value,
            pelajaranSuka: document.getElementById('pelajaranSuka').value,
            pelajaranTdkSuka: document.getElementById('pelajaranTdkSuka').value,
            ekskul: document.getElementById('ekskul').value,
            kegiatanMotivasi: document.getElementById('kegiatanMotivasi').value,
            caraBelajar: document.getElementById('caraBelajar').value,
            namaAyah: document.getElementById('namaAyah').value,
            pekerjaanAyah: document.getElementById('pekerjaanAyah').value,
            pendidikanAyah: document.getElementById('pendidikanAyah').value,
            namaIbu: document.getElementById('namaIbu').value,
            pekerjaanIbu: document.getElementById('pekerjaanIbu').value,
            pendidikanIbu: document.getElementById('pendidikanIbu').value,
            topikOrtu: document.getElementById('topikOrtu').value,
            harapanOrtu: document.getElementById('harapanOrtu').value,
            punyaKip: document.getElementById('punyaKip').value,
            statusYatimPiatu: document.getElementById('statusYatimPiatu').value,
            riwayatSakit: document.getElementById('riwayatSakit').value
        };

        try {
            const res = await fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify(data)
            });
            alert("Data berhasil tersimpan!");
            location.reload();
        } catch (err) { 
            alert("Gagal koneksi. Periksa internet atau deployment Anda."); 
            btn.disabled = false; btn.innerText = "SUBMIT DATA"; 
        }
    });
</script>
</body>
</html>
