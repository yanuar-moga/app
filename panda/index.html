<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐼 PANDA | Pemetaan Anak melalui Diagnostik Awal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #003b95; --bg: #f3f4f6; --glass: rgba(255, 255, 255, 0.9); }
        body { font-family: 'Poppins', sans-serif; background: #eef2f7; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; background: var(--glass); backdrop-filter: blur(10px); padding: 2rem; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header-section { text-align: center; margin-bottom: 2rem; }
        .logo { width: 120px; margin-bottom: 15px; }
        h1 { font-size: 1.5rem; color: var(--primary); margin: 0; }
        .form-group { margin-bottom: 15px; }
        label { font-size: 0.8rem; color: #555; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-family: 'Poppins'; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        .uppercase { text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <img src="https://yanuar-moga.github.io/app/sipanda/assets/logo_sipanda.png" class="logo" alt="Logo">
        <h1>PANDA</h1>
        <p>Pemetaan Anak melalui Diagnostik Awal</p>
    </div>

    <form id="formSiswa">
        <div class="form-group"><label>No Absen</label><input type="number" id="noAbsen" required></div>
        <div class="form-group"><label>Nama Lengkap</label><input type="text" id="namaLengkap" class="uppercase" required></div>
        <div class="form-group"><label>Nama Panggilan</label><input type="text" id="namaPanggilan" class="uppercase" required></div>
        <div class="form-group"><label>Jenis Kelamin</label><select id="jk"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
        <div class="form-group"><label>Tempat Lahir</label><input type="text" id="tempatLahir" required></div>
        <div class="form-group"><label>Tgl Lahir</label><input type="date" id="tglLahir" required></div>
        <div class="form-group"><label>Alamat Lengkap</label><input type="text" id="alamat" required></div>
        <div class="form-group"><label>No WA Siswa</label><input type="text" id="noWaSiswa" placeholder="628..." required></div>
        <div class="form-group"><label>No WA Ortu</label><input type="text" id="noWaOrtu" placeholder="628..." required></div>
        <div class="form-group"><label>Hobi</label><input type="text" id="hobi" required></div>
        <div class="form-group"><label>Cita-cita</label><input type="text" id="citaCita" required></div>
        <div class="form-group"><label>No Induk Siswa</label><input type="text" id="nis" required></div>
        <div class="form-group"><label>NISN</label><input type="number" id="nisn" required></div>
        <div class="form-group"><label>Pelajaran Disukai</label><input type="text" id="pelajaranSuka"></div>
        <div class="form-group"><label>Pelajaran Tidak Disukai</label><input type="text" id="pelajaranTdkSuka"></div>
        <div class="form-group"><label>Ekskul</label><input type="text" id="ekskul"></div>
        <div class="form-group"><label>Kegiatan Motivasi</label><input type="text" id="kegiatanMotivasi"></div>
        <div class="form-group"><label>Cara Belajar</label><select id="caraBelajar"><option value="Visual">Visual</option><option value="Auditori">Auditori</option><option value="Kinestetik">Kinestetik</option></select></div>
        <div class="form-group"><label>Nama Ayah</label><input type="text" id="namaAyah" class="uppercase" required></div>
        <div class="form-group"><label>Pekerjaan Ayah</label><input type="text" id="pekerjaanAyah"></div>
        <div class="form-group"><label>Pendidikan Ayah</label><input type="text" id="pendidikanAyah"></div>
        <div class="form-group"><label>Nama Ibu</label><input type="text" id="namaIbu" class="uppercase" required></div>
        <div class="form-group"><label>Pekerjaan Ibu</label><input type="text" id="pekerjaanIbu"></div>
        <div class="form-group"><label>Pendidikan Ibu</label><input type="text" id="pendidikanIbu"></div>
        <div class="form-group"><label>Punya KIP</label><select id="punyaKip"><option value="Ya">Ya</option><option value="Tidak">Tidak</option></select></div>
        <div class="form-group"><label>Status Yatim/Piatu</label><select id="statusYatimPiatu"><option value="Lengkap">Lengkap</option><option value="Yatim">Yatim</option><option value="Piatu">Piatu</option><option value="Yatim Piatu">Yatim Piatu</option></select></div>
        <div class="form-group"><label>Riwayat Sakit</label><input type="text" id="riwayatSakit" placeholder="Contoh: Asma/Tidak ada"></div>
        
        <button type="submit" id="btnSubmit">SUBMIT DATA</button>
    </form>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzPaWgz2zof9UTq-BRvvk5Nwcmz0pMwZAkEQfHne-k3RmUcKVWvG1VaxU9R-M_QmLI/exec";

    document.getElementById('formSiswa').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true; btn.innerText = "Mengirim...";

        const data = {
            action: "SUBMIT_SISWA",
            id: crypto.randomUUID(),
            noAbsen: document.getElementById('noAbsen').value,
            namaLengkap: document.getElementById('namaLengkap').value,
            namaPanggilan: document.getElementById('namaPanggilan').value,
            jk: document.getElementById('jk').value,
            tempatLahir: document.getElementById('tempatLahir').value,
            tglLahir: document.getElementById('tglLahir').value,
            alamat: document.getElementById('alamat').value,
            noWaSiswa: document.getElementById('noWaSiswa').value,
            noWaOrtu: document.getElementById('noWaOrtu').value,
            hobi: document.getElementById('hobi').value,
            citaCita: document.getElementById('citaCita').value,
            nis: document.getElementById('nis').value,
            nisn: document.getElementById('nisn').value,
            pelajaranSuka: document.getElementById('pelajaranSuka').value,
            pelajaranTdkSuka: document.getElementById('pelajaranTdkSuka').value,
            ekskul: document.getElementById('ekskul').value,
            kegiatanMotivasi: document.getElementById('kegiatanMotivasi').value,
            caraBelajar: document.getElementById('caraBelajar').value,
            namaAyah: document.getElementById('namaAyah').value,
            pekerjaanAyah: document.getElementById('pekerjaanAyah').value,
            pendidikanAyah: document.getElementById('pendidikanAyah').value,
            namaIbu: document.getElementById('namaIbu').value,
            pekerjaanIbu: document.getElementById('pekerjaanIbu').value,
            pendidikanIbu: document.getElementById('pendidikanIbu').value,
            punyaKip: document.getElementById('punyaKip').value,
            statusYatimPiatu: document.getElementById('statusYatimPiatu').value,
            riwayatSakit: document.getElementById('riwayatSakit').value
        };

        try {
            const res = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if(result.status === "success") {
                alert("Data berhasil tersimpan!");
                document.getElementById('formSiswa').reset();
            } else {
                alert("Error: " + result.message);
            }
        } catch (err) {
            alert("Koneksi gagal. Periksa koneksi atau deploy ulang GAS.");
        } finally {
            btn.disabled = false; btn.innerText = "SUBMIT DATA";
        }
    });
</script>
</body>
</html>
