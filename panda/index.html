<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐼 PANDA | Diagnostik Lengkap</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #003b95; --bg: #f3f4f6; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .step { display: none; }
        .step.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .asesmen-box { height: 400px; overflow-y: auto; padding: 10px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <form id="pandaForm">
        <div class="step active" id="step1">
            <h2>Biodata Siswa</h2>
            <div class="form-group"><label>Nama Lengkap</label><input type="text" id="namaLengkap" required></div>
            <div class="form-group"><label>NISN</label><input type="number" id="nisn" required></div>
            <button type="button" onclick="goStep(2)">Lanjut ke Asesmen</button>
        </div>

        <div class="step" id="step2">
            <h2>Asesmen Diagnostik (100 Soal)</h2>
            <div class="asesmen-box" id="asesmen-container"></div>
            <button type="submit" id="btnSubmit">KIRIM SEMUA DATA</button>
        </div>
    </form>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzPaWgz2zof9UTq-BRvvk5Nwcmz0pMwZAkEQfHne-k3RmUcKVWvG1VaxU9R-M_QmLI/exec";

    // Generate 100 Soal Otomatis
    const container = document.getElementById('asesmen-container');
    for (let i = 1; i <= 100; i++) {
        container.innerHTML += `
            <div class="form-group">
                <label>${i}. Pertanyaan asesmen terkait minat/bakat ${i}?</label>
                <select name="Q${i}" required>
                    <option value="1">1 - Sangat Tidak Setuju</option>
                    <option value="2">2 - Tidak Setuju</option>
                    <option value="3">3 - Netral</option>
                    <option value="4">4 - Setuju</option>
                    <option value="5">5 - Sangat Setuju</option>
                </select>
            </div>
        `;
    }

    function goStep(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
    }

    document.getElementById('pandaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true; btn.innerText = "Mengirim Data...";

        const formData = new FormData(e.target);
        const data = {
            action: "SUBMIT_SISWA_LENGKAP", // Sesuaikan dengan handler di GAS
            id: crypto.randomUUID(),
            namaLengkap: document.getElementById('namaLengkap').value,
            nisn: document.getElementById('nisn').value
        };

        // Masukkan Q1-Q100 ke objek data
        for(let i=1; i<=100; i++) data['Q'+i] = formData.get('Q'+i);

        try {
            await fetch(GAS_URL, { method: "POST", body: JSON.stringify(data) });
            alert("Data Asesmen Berhasil Dikirim!");
            location.reload();
        } catch (err) { alert("Gagal koneksi."); btn.disabled = false; }
    });
</script>
</body>
</html>
