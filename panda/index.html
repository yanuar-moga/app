<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐼 PANDA Diagnostik</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #003b95; 
            --primary-hover: #002b6d;
            --bg: #f4f7fc; 
            --text-main: #2d3748;
            --text-muted: #718096;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #28a745;
            --success-hover: #218838;
        }
        
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--bg); 
            margin: 0; 
            padding: 20px 10px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
            color: var(--text-main);
        }
        
        .container { 
            width: 100%; 
            max-width: 450px; 
            background: white; 
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 59, 149, 0.05); 
            margin-bottom: 20px;
        }

        .header-brand {
            text-align: center; 
            margin-bottom: 25px;
        }

        .header-brand img {
            width: 75px;
            height: auto;
            margin-bottom: 8px;
        }

        .header-brand h3 {
            color: var(--primary);
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header-brand p.subtitle {
            margin: 4px 0 0 0;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.3;
        }
        
        /* Tombol Instal PWA Khusus Android */
        .btn-pwa-install {
            display: none; /* Sembunyi secara default, muncul jika didukung browser */
            width: 100%;
            padding: 14px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
            transition: var(--transition);
            animation: pulseGlow 2s infinite;
        }
        .btn-pwa-install:hover {
            background: var(--success-hover);
            transform: translateY(-1px);
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        /* Progress Bar Langkah */
        .progress-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 30px;
        }
        .progress-line {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 4px;
            background: #e2e8f0;
            width: 100%;
            z-index: 1;
            border-radius: 2px;
        }
        .progress-line-fill {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 4px;
            background: var(--primary);
            width: 0%;
            z-index: 2;
            transition: var(--transition);
            border-radius: 2px;
        }
        .progress-step {
            width: 32px;
            height: 32px;
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            z-index: 3;
            transition: var(--transition);
        }
        .progress-step.active {
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 700;
            transform: scale(1.1);
        }
        .progress-step.completed {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .step { display: none; }
        .step.active { display: block; animation: slideIn 0.4s forwards; }
        
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .step h4 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-main);
            font-weight: 600;
        }
        
        .form-group { margin-bottom: 16px; }
        
        label { 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 6px;
        }
        
        input, select { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1.5px solid #e2e8f0; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 0.95rem;
            color: var(--text-main);
            transition: var(--transition);
            background: #f8fafc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 59, 149, 0.1);
        }
        
        .btn-group { display: flex; gap: 12px; margin-top: 25px; }
        
        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 0.95rem;
            cursor: pointer; 
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(0, 59, 149, 0.15);
        }

        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        button:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }
        
        button.secondary { 
            background: white; 
            color: var(--text-main); 
            border: 1.5px solid #e2e8f0;
            box-shadow: none;
        }
        button.secondary:hover { background: #f1f5f9; }
        
        /* Sistem Animasi Modal */
        .modal { 
            display: none; 
            position: fixed; 
            top:0; left:0; 
            width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(4px);
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .modal.active { display: flex; opacity: 1; }
        
        .modal-content { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            width: 85%; 
            max-width: 360px; 
            text-align: center; 
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .modal.active .modal-content { transform: scale(1); }

        .modal-content img.modal-logo {
            width: 65px;
            height: auto;
            margin-bottom: 12px;
        }

        .modal-content p {
            margin: 10px 0 20px 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
        }

        /* Desain Footer Gradasi Melengkung */
        footer {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 50%, #e0f2fe 100%);
            border: 1.5px solid rgba(0, 59, 149, 0.15);
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 0.85rem;
            color: #334155;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            font-weight: 500;
        }
        footer span {
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            transition: var(--transition);
        }
        footer span:hover {
            color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-brand">
        <img src="https://yanuar-moga.github.io/app/sipanda/assets/logo_sipanda.png" alt="Logo PANDA">
        <h3>P A N D A</h3>
        <p class="subtitle">Pemetaan Anak melalui Diagnostik Awal</p>
    </div>

    <button id="btnPWA" class="btn-pwa-install">📱 INSTAL APLIKASI PANDA</button>

    <div class="progress-container">
        <div class="progress-line"></div>
        <div class="progress-line-fill" id="progressLine"></div>
        <div class="progress-step active" id="pstep1">1</div>
        <div class="progress-step" id="pstep2">2</div>
        <div class="progress-step" id="pstep3">3</div>
    </div>

    <form id="pandaForm">
        <div class="step active" id="step1">
            <h4>Biodata Diri (1/3)</h4>
            <div class="form-group"><label>No Absen</label><input type="number" id="noAbsen" placeholder="Contoh: 1" required></div>
            <div class="form-group"><label>Kelas</label><input type="text" id="kelas" placeholder="Contoh: VII-A" required></div>
            <div class="form-group"><label>Nama Lengkap</label><input type="text" id="namaLengkap" placeholder="Nama sesuai Akte Lahir" required></div>
            <div class="form-group"><label>Nama Panggilan</label><input type="text" id="namaPanggilan" placeholder="Contoh: Budi" required></div>
            <div class="form-group"><label>Jenis Kelamin</label><select id="jk"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
            <div class="form-group"><label>Tempat Lahir</label><input type="text" id="tempatLahir" placeholder="Contoh: Pemalang" required></div>
            <div class="form-group"><label>Tgl Lahir</label><input type="date" id="tglLahir" required></div>
            <div class="form-group"><label>Alamat Lengkap</label><input type="text" id="alamat" placeholder="Nama jalan, RT/RW, nomor rumah, kecamatan" required></div>
            <div class="form-group"><label>No WA Siswa</label><input type="text" id="noWaSiswa" placeholder="Contoh: 0852xxx" required></div>
            <div class="form-group"><label>No WA Ortu</label><input type="text" id="noWaOrtu" placeholder="Contoh: 0852xxx" required></div>
            <button type="button" onclick="go(2)">Lanjut</button>
        </div>

        <div class="step" id="step2">
            <h4>Minat & Sekolah (2/3)</h4>
            <div class="form-group"><label>Hobi</label><input type="text" id="hobi" placeholder="Contoh: Membaca, Sepak bola, Menggambar"></div>
            <div class="form-group"><label>Cita-cita</label><input type="text" id="citaCita" placeholder="Contoh: Programmer, Dokter, Guru"></div>
            <div class="form-group"><label>No Induk (NIS)</label><input type="text" id="nis" placeholder="Masukkan Nomor Induk Siswa"></div>
            <div class="form-group"><label>NISN</label><input type="number" id="nisn" placeholder="Masukkan 10 digit NISN nasional" required></div>
            <div class="form-group"><label>Pelajaran Disukai</label><input type="text" id="pelajaranSuka" placeholder="Contoh: Matematika, Bahasa Inggris"></div>
            <div class="form-group"><label>Pelajaran Tidak Disukai</label><input type="text" id="pelajaranTdkSuka" placeholder="Contoh: Sejarah, Fisika"></div>
            <div class="form-group"><label>Ekskul</label><input type="text" id="ekskul" placeholder="Contoh: Pramuka, PMR, Basket"></div>
            <div class="form-group"><label>Kegiatan Motivasi</label><input type="text" id="kegiatanMotivasi" placeholder="Kegiatan yang bikin kamu semangat belajar"></div>
            <div class="form-group"><label>Cara Belajar</label><select id="caraBelajar"><option value="Menonton Video atau Gambar">Menonton Video atau Gambar</option><option value="Mendengarkan cerita guru atau podcast">Mendengarkan cerita guru atau podcast</option><option value="Praktik langsung">Praktik langsung</option></select></div>
            <div class="btn-group">
                <button type="button" class="secondary" onclick="go(1)">Kembali</button>
                <button type="button" onclick="go(3)">Lanjut</button>
            </div>
        </div>

        <div class="step" id="step3">
            <h4>Data Keluarga (3/3)</h4>
            <div class="form-group"><label>Nama Ayah</label><input type="text" id="namaAyah" placeholder="Nama lengkap ayah"></div>
            <div class="form-group"><label>Pekerjaan Ayah</label><input type="text" id="pekerjaanAyah" placeholder="Contoh: Karyawan Swasta, PNS, Wiraswasta"></div>
            <div class="form-group"><label>Pendidikan Ayah</label><input type="text" id="pendidikanAyah" placeholder="Contoh: SMA, S1, Diploma"></div>
            <div class="form-group"><label>Nama Ibu</label><input type="text" id="namaIbu" placeholder="Nama lengkap ibu"></div>
            <div class="form-group"><label>Pekerjaan Ibu</label><input type="text" id="pekerjaanIbu" placeholder="Contoh: Ibu Rumah Tangga, Guru, Pedagang"></div>
            <div class="form-group"><label>Pendidikan Ibu</label><input type="text" id="pendidikanIbu" placeholder="Contoh: SMP, SMA, S1"></div>
            <div class="form-group"><label>Topik Sering Dibicarakan</label><input type="text" id="topikOrtu" placeholder="Contoh: Perkembangan belajar, Masalah keuangan, Masa depan"></div>
            <div class="form-group"><label>Harapan Orang Tua</label><input type="text" id="harapanOrtu" placeholder="Contoh: Sukses kuliah, Menjadi anak mandiri"></div>
            <div class="form-group"><label>Punya KIP</label><select id="punyaKip"><option value="Ya">Ya</option><option value="Tidak">Tidak</option></select></div>
            <div class="form-group"><label>Status Yatim/Piatu</label><select id="statusYatimPiatu"><option value="Lengkap">Lengkap</option><option value="Yatim">Yatim</option><option value="Piatu">Piatu</option></select></div>
            <div class="form-group"><label>Riwayat Sakit</label><input type="text" id="riwayatSakit" placeholder="Contoh: Asma, Tipes, Kejang, Mag, atau Tulis 'Tidak Ada'"></div>
            <div class="btn-group">
                <button type="button" class="secondary" onclick="go(2)">Kembali</button>
                <button type="submit" id="btnSubmit">SUBMIT DATA</button>
            </div>
        </div>
    </form>
</div>

<footer>
    <span onclick="openAboutModal()">PANDA V 1.0</span>
</footer>

<div class="modal" id="msgModal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin: 0 0 10px 0;"></h3>
        <p id="modalText"></p>
        <button id="modalBtn" onclick="closeModal()">Tutup</button>
    </div>
</div>

<div class="modal" id="aboutModal">
    <div class="modal-content">
        <img class="modal-logo" src="https://yanuar-moga.github.io/app/sipanda/assets/logo_sipanda.png" alt="Logo PANDA">
        <h3 style="margin: 5px 0; color: var(--primary);">PANDA</h3>
        <p style="font-weight: 500; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;">Pemetaan Anak melalui Diagnostik Awal</p>
        <p style="font-size: 0.8rem; margin-top: 0;">Versi 1.0 Build 30 Juni 2026</p>
        <div style="border-top: 1px solid #e2e8f0; padding-top: 15px; margin-top: 15px;">
            <p style="font-size: 0.85rem; font-weight: 600; margin: 0;">Developed by MB</p>
        </div>
        <button style="margin-top: 15px;" onclick="closeAboutModal()">Tutup</button>
    </div>
</div>

<script>
    // ==========================================
    // LOGIKA INTEGRASI PWA (PROGRESSIVE WEB APP)
    // ==========================================
    let deferredPrompt;
    const btnPWA = document.getElementById('btnPWA');

    // Registrasi Service Worker agar syarat PWA terpenuhi
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
            .then(reg => console.log('Service Worker terdaftar!', reg))
            .catch(err => console.log('Service Worker gagal:', err));
        });
    }

    // Tangkap perintah instalasi bawaan browser Android
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); // Blokir banner bawaan Chrome yang mengganggu
        deferredPrompt = e;  // Simpan event-nya
        btnPWA.style.display = 'block'; // Tampilkan tombol kustom PANDA
    });

    // Jalankan instalasi saat tombol PWA diklik siswa
    btnPWA.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        btnPWA.disabled = true;
        deferredPrompt.prompt(); // Munculkan popup instalasi Android
        
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`Pilihan instalasi pengguna: ${outcome}`);
        
        deferredPrompt = null;
        btnPWA.style.display = 'none';
        btnPWA.disabled = false;
    });

    // Sembunyikan tombol jika aplikasi sudah sukses terinstal
    window.addEventListener('appinstalled', () => {
        console.log('Aplikasi PANDA sukses terpasang di Android.');
        btnPWA.style.display = 'none';
    });


    // ==========================================
    // LOGIKA UTAMA LOG-IN & PENGIRIMAN DATA
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwEZuEovCgVlE6cWfB-IoUA0fqrjN12TvgAOMwupXfaiaSz36p5nQ0fDmvptK2DEUt9/exec";
    let reloadOnClose = false;

    function go(s) {
        if (s === 2) {
            const requiredFields = document.getElementById('step1').querySelectorAll('[required]');
            for (let field of requiredFields) {
                if (!field.value) { field.reportValidity(); return; }
            }
        }
        if (s === 3) {
            const requiredFields = document.getElementById('step2').querySelectorAll('[required]');
            for (let field of requiredFields) {
                if (!field.value) { field.reportValidity(); return; }
            }
        }

        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
        
        const fillPercent = ((s - 1) / 2) * 100;
        document.getElementById('progressLine').style.width = fillPercent + '%';
        
        for (let i = 1; i <= 3; i++) {
            const stepEl = document.getElementById('pstep' + i);
            if (i < s) {
                stepEl.className = 'progress-step completed';
                stepEl.innerText = '✓';
            } else if (i === s) {
                stepEl.className = 'progress-step active';
                stepEl.innerText = i;
            } else {
                stepEl.className = 'progress-step';
                stepEl.innerText = i;
            }
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('pandaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerText = "Mengirim Data..."; btn.disabled = true;

        const data = {
            action: "SUBMIT_SISWA_LENGKAP",
            noAbsen: document.getElementById('noAbsen').value,
            kelas: document.getElementById('kelas').value,
            namaLengkap: document.getElementById('namaLengkap').value,
            namaPanggilan: document.getElementById('namaPanggilan').value,
            jk: document.getElementById('jk').value,
            tempatLahir: document.getElementById('tempatLahir').value,
            tglLahir: document.getElementById('tglLahir').value,
            alamat: document.getElementById('alamat').value,
            noWaSiswa: document.getElementById('noWaSiswa').value,
            noWaOrtu: document.getElementById('noWaOrtu').value,
            hobi: document.getElementById('hobi').value,
            citaCita: document.getElementById('citaCita').value,
            nis: document.getElementById('nis').value,
            nisn: document.getElementById('nisn').value,
            pelajaranSuka: document.getElementById('pelajaranSuka').value,
            pelajaranTdkSuka: document.getElementById('pelajaranTdkSuka').value,
            ekskul: document.getElementById('ekskul').value,
            kegiatanMotivasi: document.getElementById('kegiatanMotivasi').value,
            caraBelajar: document.getElementById('caraBelajar').value,
            namaAyah: document.getElementById('namaAyah').value,
            pekerjaanAyah: document.getElementById('pekerjaanAyah').value,
            pendidikanAyah: document.getElementById('pendidikanAyah').value,
            namaIbu: document.getElementById('namaIbu').value,
            pekerjaanIbu: document.getElementById('pekerjaanIbu').value,
            pendidikanIbu: document.getElementById('pendidikanIbu').value,
            topikOrtu: document.getElementById('topikOrtu').value,
            harapanOrtu: document.getElementById('harapanOrtu').value,
            punyaKip: document.getElementById('punyaKip').value,
            statusYatimPiatu: document.getElementById('statusYatimPiatu').value,
            riwayatSakit: document.getElementById('riwayatSakit').value
        };

        try {
            const response = await fetch(GAS_URL, {
                method: "POST",
                mode: "cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            if (result.status === "success") {
                showCustomModal("Sukses!", "Data Anda berhasil dikirim dan disimpan ke sistem PANDA.", true);
            } else {
                showCustomModal("Gagal Menyimpan", "Server error: " + result.message, false);
                btn.disabled = false; btn.innerText = "SUBMIT DATA";
            }
        } catch (err) {
            showCustomModal("Sukses!", "Data Anda berhasil dikirim dan sedang diproses oleh sistem PANDA.", true);
            btn.disabled = false; btn.innerText = "SUBMIT DATA";
        }
    });

    function showCustomModal(title, text, isSuccess) {
        const modal = document.getElementById('msgModal');
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalTitle').style.color = isSuccess ? 'var(--primary)' : '#dc2626';
        document.getElementById('modalText').innerText = text;
        
        reloadOnClose = isSuccess;
        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('msgModal').classList.remove('active');
        if (reloadOnClose) { location.reload(); }
    }

    function openAboutModal() { document.getElementById('aboutModal').classList.add('active'); }
    function closeAboutModal() { document.getElementById('aboutModal').classList.remove('active'); }
</script>
</body>
</html>
