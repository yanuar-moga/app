<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐼 Pemetaan Anak melalui Diagnostik Awal</title>
    <style>
        :root { --primary: #003b95; --bg: #eef2f7; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .step { display: none; }
        .step.active { display: block; animation: slideIn 0.3s; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 15px; }
        label { font-size: 0.7rem; color: #666; font-weight: 600; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-top: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; margin-top: 10px; font-weight: 600; }
        footer { text-align: center; font-size: 0.7rem; color: #999; margin-top: 30px; cursor: pointer; }
        .modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; width: 80%; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align:center; margin-bottom:20px;">
        <img src="https://yanuar-moga.github.io/app/sipanda/assets/logo_sipanda.png" width="80">
        <h3>PANDA</h3>
        <h2>Pemetaan Anak melalui Diagnostik Awal</h2>
    </div>

    <form id="pandaForm">
        <div class="step active" id="step1">
            <h4>Identitas Diri (1/2)</h4>
            <div class="form-group"><label>Nama Lengkap</label><input type="text" required></div>
            <div class="form-group"><label>No Absen</label><input type="number"></div>
            <button type="button" onclick="go(2)">Lanjut</button>
        </div>

        <div class="step" id="step2">
            <h4>Data Keluarga & Minat (2/2)</h4>
            <button type="submit" id="btnSubmit">SUBMIT</button>
        </div>
    </form>

    <footer onclick="document.getElementById('m').style.display='flex'">PANDA V 1.0</footer>
</div>

<div class="modal" id="m" onclick="this.style.display='none'">
    <div class="modal-content">
        <img src="https://yanuar-moga.github.io/app/sipanda/assets/logo_sipanda.png" width="50">
        <p><b>PANDA</b><br>Pemetaan Anak melalui Diagnostik Awal<br>Versi 1.0 Build 30 Juni 2026<br>Develop by MB<br>yanuar.b@gmail.com</p>
    </div>
</div>

<script>
    function go(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
    }
</script>
</body>
</html>
