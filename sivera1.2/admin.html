<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivera - Super Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .popup-animate { transform: scale(0.9); opacity: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .popup-active { transform: scale(1); opacity: 1; }
    </style>
</head>
<body class="bg-gray-900 text-slate-100 font-sans flex flex-col min-h-screen p-4">

    <!-- SECURITY LOGIN PANEL -->
    <div id="admin-auth" class="max-w-md mx-auto mt-20 p-6 bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 w-full">
        <h2 class="text-xl font-black text-center text-amber-400 mb-2 uppercase tracking-wider">SECURITY LOGIN ADMIN</h2>
        <p class="text-center text-xs text-gray-400 mb-6 uppercase font-bold">Aplikasi Sivera V 1.2</p>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Masukkan PIN Kode Admin</label>
                <input type="password" id="admin-pin" class="w-full bg-gray-700 border-2 border-gray-600 rounded-lg p-3 text-center tracking-widest font-black text-white focus:border-amber-400 outline-none" placeholder="••••••••">
            </div>
            <button onclick="verifyAdminPin()" class="w-full bg-amber-400 hover:bg-amber-500 text-gray-900 py-3 rounded-xl font-black uppercase tracking-wider transition text-sm">
                BUKA AKSES SISTEM
            </button>
        </div>
    </div>

    <!-- MAIN CONTROL PANEL -->
    <div id="admin-dashboard" class="max-w-5xl mx-auto space-y-6 w-full hidden">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-xl gap-4">
            <div>
                <h1 class="text-lg font-black text-amber-400 uppercase tracking-wide">Sivera Pusat Kendali Utama</h1>
                <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">SMP NEGERI 1 MOGA</p>
            </div>
            <div class="flex gap-2">
                <button onclick="logoutAdmin()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold text-xs px-4 py-2.5 rounded-lg tracking-wider uppercase transition">LOGOUT</button>
                <button onclick="resetSystem()" class="bg-red-600 hover:bg-red-700 text-white font-black text-xs px-4 py-2.5 rounded-lg tracking-wider uppercase transition">RESET DATA</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-4">
                <h3 class="text-sm font-black text-amber-400 border-b border-gray-700 pb-2 uppercase tracking-wider">KONTROL PARAMETER</h3>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">STATUS GERBANG ANTREAN</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btn-gate-buka" onclick="setGate('Buka')" class="py-2 rounded-lg font-black text-xs uppercase tracking-wider transition bg-gray-700 text-gray-400">BUKA</button>
                        <button id="btn-gate-tutup" onclick="setGate('Tutup')" class="py-2 rounded-lg font-black text-xs uppercase tracking-wider transition bg-gray-700 text-gray-400">TUTUP</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Estimasi Durasi per Berkas (Menit)</label>
                    <input type="number" id="cfg-duration" class="w-full bg-gray-700 p-2.5 rounded border-2 border-gray-600 font-bold text-sm text-white focus:border-amber-400 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Jam Mulai Operasional</label>
                    <input type="time" id="cfg-start" class="w-full bg-gray-700 p-2.5 rounded border-2 border-gray-600 font-bold text-sm text-white focus:border-amber-400 outline-none">
                </div>
                <button onclick="saveConfig()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg text-xs font-black uppercase tracking-wider transition">SIMPAN PARAMETER</button>
            </div>

            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-4 md:col-span-2">
                <h3 class="text-sm font-black text-amber-400 border-b border-gray-700 pb-2 uppercase tracking-wider">MANAJEMEN PENGUMUMAN REALTIME</h3>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">ISI TEXT TICKER BERJALAN</label>
                    <textarea id="cfg-ticker" rows="2" class="w-full bg-gray-700 p-2.5 rounded border-2 border-gray-600 text-sm font-semibold text-white focus:border-amber-400 outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">KIRIM NOTIFIKASI FLASH POP-UP</label>
                    <textarea id="cfg-flash" rows="2" class="w-full bg-gray-700 p-2.5 rounded border-2 border-gray-600 text-sm font-semibold text-white focus:border-amber-400 outline-none" placeholder="Isi pesan popup otomatis..."></textarea>
                </div>
                <button onclick="broadcastAnnouncement()" class="w-full bg-amber-400 hover:bg-amber-500 text-gray-900 py-3 rounded-lg text-xs font-black uppercase tracking-wider transition">BROADCAST SEKARANG</button>
            </div>
        </div>
    </div>

    <!-- FOOTER REVISI -->
    <footer class="bg-gray-950 border-t border-gray-800 py-4 text-center text-xs text-gray-500 mt-auto w-full">
        <button onclick="toggleDevPopup(true)" class="hover:text-amber-400 font-bold tracking-wide uppercase focus:outline-none transition">
            Aplikasi SIVERA V 1.2
        </button>
    </footer>

    <!-- POPUP DEVELOPER -->
    <div id="dev-popup" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="dev-box" class="bg-gray-800 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl popup-animate border-t-8 border-amber-400">
            <h3 class="text-xl font-black text-amber-400 tracking-wider mb-1">SIVERA V 1.2</h3>
            <div class="w-12 h-1 bg-white mx-auto mb-4"></div>
            <div class="text-left text-xs space-y-2 bg-gray-900 p-4 rounded-xl border border-gray-700 font-mono text-gray-300 mb-5">
                <div><strong>Dev :</strong> MB</div>
                <div><strong>Version :</strong> 1.2</div>
                <div><strong>Build :</strong> 12 Juni 2026</div>
                <div><strong>Contac :</strong> <a href="mailto:yanuar.b@gmail.com" class="text-amber-400 underline font-bold">yanuar.b@gmail.com</a></div>
            </div>
            <button onclick="toggleDevPopup(false)" class="w-full bg-amber-400 hover:bg-amber-500 text-gray-900 font-bold text-xs py-3 rounded-xl uppercase tracking-wider transition">Tutup</button>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA0xQfsUmrVWGTI1WQFauY3UZ2HIV5u7WZRKJ39bpKM1V9cScV-PfRj-n8gZ6Emk9uvw/exec";
        let activeAdminPin = "";
        let selectedGateStatus = "Buka";

        // ANTI MENTAL: Cek session simpanan di localStorage saat pertama kali dimuat
        window.onload = function() {
            const savedPin = localStorage.getItem('sivera_admin_pin');
            if(savedPin) {
                activeAdminPin = savedPin;
                document.getElementById('admin-auth').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadCurrentConfig();
            }
        };

        function verifyAdminPin() {
            const pin = document.getElementById('admin-pin').value;
            fetch(`${APPS_SCRIPT_URL}?action=loginAdmin&pin=${pin}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "authorized") {
                    activeAdminPin = pin;
                    localStorage.setItem('sivera_admin_pin', pin); // Amankan Sesi
                    document.getElementById('admin-auth').classList.add('hidden');
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    loadCurrentConfig();
                } else { alert("PIN KODE ADMIN SALAH!"); }
            });
        }

        function logoutAdmin() {
            localStorage.removeItem('sivera_admin_pin');
            location.reload();
        }

        function loadCurrentConfig() {
            fetch(`${APPS_SCRIPT_URL}?action=getAdminConfigData`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('cfg-duration').value = data.duration;
                document.getElementById('cfg-start').value = data.startTime;
                document.getElementById('cfg-ticker').value = data.ticker;
                document.getElementById('cfg-flash').value = data.flashMsg;
                setGate(data.gateStatus);
            });
        }

        function setGate(status) {
            selectedGateStatus = status;
            const btnBuka = document.getElementById('btn-gate-buka');
            const btnTutup = document.getElementById('btn-gate-tutup');
            if(status === "Buka") {
                btnBuka.className = "py-2 rounded-lg font-black text-xs uppercase tracking-wider transition bg-emerald-600 text-white";
                btnTutup.className = "py-2 rounded-lg font-black text-xs uppercase tracking-wider transition bg-gray-700 text-gray-400";
            } else {
                btnTutup.className = "py-2 rounded-lg font-black text-xs uppercase tracking-wider transition bg-red-600 text-white";
                btnBuka.className = "py-2 rounded-lg font-black text-xs uppercase tracking-wider transition bg-gray-700 text-gray-400";
            }
        }

        function saveConfig() {
            const duration = document.getElementById('cfg-duration').value;
            const startTime = document.getElementById('cfg-start').value;
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "saveConfig", pin: activeAdminPin, duration, startTime, gateStatus: selectedGateStatus })
            })
            .then(res => res.json())
            .then(data => { if(data.status === 'success') alert('Parameter berhasil disimpan!'); });
        }

        function broadcastAnnouncement() {
            const ticker = document.getElementById('cfg-ticker').value;
            const flash = document.getElementById('cfg-flash').value;
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "broadcastAnnounce", pin: activeAdminPin, ticker, flashMsg: flash })
            })
            .then(res => res.json())
            .then(data => { if(data.status === 'success') alert('Pengumuman berhasil di-broadcast!'); });
        }

        function resetSystem() {
            if(confirm("Hapus seluruh data antrean peserta hari ini?")) {
                fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "resetSystem", pin: activeAdminPin })
                })
                .then(res => res.json())
                .then(data => { if(data.status === 'success') location.reload(); });
            }
        }

        function toggleDevPopup(show) {
            const p = document.getElementById('dev-popup');
            const b = document.getElementById('dev-box');
            if(show) { p.classList.remove('pointer-events-none','opacity-0'); setTimeout(()=>b.classList.add('popup-active'),50); }
            else { b.classList.remove('popup-active'); p.classList.add('opacity-0','pointer-events-none'); }
        }
    </script>
</body>
</html>
