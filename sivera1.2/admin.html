<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivera - Admin Area</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 min-h-screen text-slate-100 font-sans p-4">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- HEADER BAR -->
        <header class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="bg-amber-400 p-2 rounded-lg text-gray-900 font-black"><i class="fa-solid fa-screwdriver-wrench"></i></div>
                <div>
                    <h1 class="text-lg font-bold">Sivera Super Administrator</h1>
                    <p class="text-xs text-gray-400">Pusat kendali operasional & pemeliharaan sistem</p>
                </div>
            </div>
            <button onclick="resetSystem()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3 py-2 rounded-lg transition">Reset Seluruh Antrean</button>
        </header>

        <!-- KENDALI FITUR BARU & KONFIGURASI -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-4">
                <h3 class="text-sm font-bold text-amber-400 border-b border-gray-700 pb-2"><i class="fa-solid fa-sliders"></i> Pengaturan Parameter</h3>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Estimasi Waktu per Berkas (Menit)</label>
                    <input type="number" id="cfg-duration" class="w-full bg-gray-700 p-2 rounded border border-gray-600 text-sm" value="10">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Jam Dimulai Pelayanan</label>
                    <input type="time" id="cfg-start" class="w-full bg-gray-700 p-2 rounded border border-gray-600 text-sm" value="08:00">
                </div>
                <button onclick="saveConfig()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded text-xs font-bold transition">Simpan Fitur & Konfigurasi</button>
            </div>

            <!-- LIVE ACTIVITY LOG -->
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 md:col-span-2 space-y-3">
                <h3 class="text-sm font-bold text-gray-200 border-b border-gray-700 pb-2 flex justify-between items-center">
                    <span>Audit Log Aktivitas Terkini (Hari Ini)</span>
                    <span class="h-2 w-2 rounded-full bg-emerald-500 animate-ping"></span>
                </h3>
                <div class="overflow-y-auto max-h-[220px] font-mono text-xs text-gray-300 space-y-1.5" id="admin-logs">
                    <!-- Log entries filled by system -->
                    <div>[SYSTEM] Menunggu respon data server...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA0xQfsUmrVWGTI1WQFauY3UZ2HIV5u7WZRKJ39bpKM1V9cScV-PfRj-n8gZ6Emk9uvw/exec";

        window.onload = function() {
            loadAdminAudit();
        };

        function loadAdminAudit() {
            fetch(`${APPS_SCRIPT_URL}?action=getAdminLogs`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('admin-logs');
                container.innerHTML = "";
                data.logs.forEach(log => {
                    container.innerHTML += `<div class="border-b border-gray-700/50 pb-1 text-gray-400"><span class="text-amber-500">[${log.timestamp}]</span> ${log.message} <span class="text-blue-400">(${log.device_info})</span></div>`;
                });
            });
        }

        function saveConfig() {
            const duration = document.getElementById('cfg-duration').value;
            const startTime = document.getElementById('cfg-start').value;
            
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "saveConfig", duration: duration, startTime: startTime })
            })
            .then(res => res.json())
            .then(data => { if(data.status === 'success') alert('Parameter konfigurasi baru berhasil ditambahkan!'); });
        }

        function resetSystem() {
            if(confirm("PERINGATAN: Anda akan menghapus seluruh rekapan antrean hari ini! Lanjutkan?")) {
                fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "resetSystem" }) })
                .then(res => res.json())
                .then(data => { if(data.status === 'success') location.reload(); });
            }
        }
    </script>
</body>
</html>
