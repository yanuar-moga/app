<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivera - Dashboard Monitoring</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4 font-sans text-gray-800">

    <div class="max-w-5xl mx-auto space-y-5">
        <!-- HEADER -->
        <header class="bg-white p-4 rounded-2xl shadow-sm border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 class="text-xl font-bold text-blue-900"><i class="fa-solid fa-chart-pie"></i> Executive Dashboard Sivera</h1>
                <p class="text-xs text-gray-500">Monitoring data real-time berkas SPMB SMP Negeri 1 Moga</p>
            </div>
            <span class="bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-lg font-bold border border-blue-200" id="live-time">Juni 2026</span>
        </header>

        <!-- KPI SUMMARY CARDS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border text-center">
                <p class="text-xs font-semibold text-gray-400 uppercase">Total Pendaftar</p>
                <p id="kpi-total" class="text-3xl font-black text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border text-center border-l-4 border-l-amber-500">
                <p class="text-xs font-semibold text-gray-400 uppercase">Sedang Antre</p>
                <p id="kpi-wait" class="text-3xl font-black text-amber-600 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border text-center border-l-4 border-l-blue-600">
                <p class="text-xs font-semibold text-gray-400 uppercase">Sedang Diproses</p>
                <p id="kpi-process" class="text-3xl font-black text-blue-600 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border text-center border-l-4 border-l-emerald-600">
                <p class="text-xs font-semibold text-gray-400 uppercase">Selesai Berkas</p>
                <p id="kpi-done" class="text-3xl font-black text-emerald-600 mt-1">0</p>
            </div>
        </div>

        <!-- CHARTS GRID -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border">
                <h3 class="text-sm font-bold text-gray-700 mb-2">Komposisi Jalur Pendaftaran</h3>
                <div class="max-h-[250px] flex justify-center">
                    <canvas id="chartJalur"></canvas>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border">
                <h3 class="text-sm font-bold text-gray-700 mb-2">Produktivitas Ruang Verifikator (Berkas Selesai)</h3>
                <div class="max-h-[250px]">
                    <canvas id="chartLoket"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA0xQfsUmrVWGTI1WQFauY3UZ2HIV5u7WZRKJ39bpKM1V9cScV-PfRj-n8gZ6Emk9uvw/exec";
        let jalurChart, loketChart;

        window.onload = function() {
            renderCharts();
            fetchDashboardData();
            setInterval(fetchDashboardData, 20000); // refresh otomatis setiap 20 detik
        }

        function renderCharts() {
            const ctxJalur = document.getElementById('chartJalur').getContext('2d');
            jalurChart = new Chart(ctxJalur, {
                type: 'doughnut',
                data: {
                    labels: ['Domisili', 'Prestasi', 'Afirmasi', 'Mutasi'],
                    datasets: [{ data: [0, 0, 0, 0], backgroundColor: ['#004687', '#FFD700', '#34D399', '#F87171'] }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });

            const ctxLoket = document.getElementById('chartLoket').getContext('2d');
            loketChart = new Chart(ctxLoket, {
                type: 'bar',
                data: {
                    labels: ['Loket 1', 'Loket 2', 'Loket 3', 'Loket 4', 'Loket 5', 'Loket 6'],
                    datasets: [{ label: 'Berkas Tervalidasi', data: [0, 0, 0, 0, 0, 0], backgroundColor: '#004687' }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        function fetchDashboardData() {
            fetch(`${APPS_SCRIPT_URL}?action=getDashboardData`)
            .then(res => res.json())
            .then(data => {
                // Update KPIs
                document.getElementById('kpi-total').innerText = data.kpi.total;
                document.getElementById('kpi-wait').innerText = data.kpi.wait;
                document.getElementById('kpi-process').innerText = data.kpi.process;
                document.getElementById('kpi-done').innerText = data.kpi.done;

                // Update Jalur Chart
                jalurChart.data.datasets[0].data = [data.jalur.domisili, data.jalur.prestasi, data.jalur.afirmasi, data.jalur.mutasi];
                jalurChart.update();

                // Update Loket Chart
                loketChart.data.datasets[0].data = data.loket;
                loketChart.update();
            });
        }
    </script>
</body>
</html>
