<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivera - Dashboard Monitoring</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 p-4 font-sans text-gray-800 flex flex-col min-h-screen">

    <div class="max-w-5xl mx-auto space-y-5 w-full flex-grow">
        <header class="bg-white p-4 rounded-2xl shadow-sm border-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 class="text-xl font-black text-blue-900 uppercase tracking-wide">EXECUTIVE MONITORING DASHBOARD</h1>
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">PANTAU DATA SPMB SMP NEGERI 1 MOGA</p>
            </div>
            <span class="bg-blue-900 text-white text-xs px-4 py-1.5 rounded-lg font-black tracking-widest" id="live-time">JUNI 2026</span>
        </header>

        <!-- DATA KPI CARDS COLORFUL -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border-2 text-center">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Total Pendaftar</p>
                <p id="kpi-total" class="text-3xl font-black text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-amber-400 p-4 rounded-xl shadow-sm text-center text-blue-950">
                <p class="text-[10px] font-black uppercase tracking-wider opacity-80">Sedang Antre</p>
                <p id="kpi-wait" class="text-3xl font-black mt-1">0</p>
            </div>
            <div class="bg-blue-600 p-4 rounded-xl shadow-sm text-center text-white">
                <p class="text-[10px] font-black uppercase tracking-wider opacity-80">Sedang Diproses</p>
                <p id="kpi-process" class="text-3xl font-black mt-1">0</p>
            </div>
            <div class="bg-emerald-600 p-4 rounded-xl shadow-sm text-center text-white">
                <p class="text-[10px] font-black uppercase tracking-wider opacity-80">Selesai Validasi</p>
                <p id="kpi-done" class="text-3xl font-black mt-1">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border-2">
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider mb-2">Komposisi Jalur Pendaftaran</h3>
                <div class="max-h-[240px] flex justify-center"><canvas id="chartJalur"></canvas></div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border-2">
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider mb-2">Produktivitas Ruang Verifikator</h3>
                <div class="max-h-[240px]"><canvas id="chartLoket"></canvas></div>
            </div>
        </div>
    </div>

    <!-- FOOTER APLIKASI STANDAR -->
    <footer class="bg-white border-t-2 border-gray-200 py-4 text-center text-xs text-gray-600 mt-5 shadow-inner w-full">
        <span class="font-bold tracking-wide uppercase">
            Aplikasi Sivera V 1.2 by MB [MONITORING DASHBOARD]
        </span>
    </footer>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA0xQfsUmrVWGTI1WQFauY3UZ2HIV5u7WZRKJ39bpKM1V9cScV-PfRj-n8gZ6Emk9uvw/exec";
        let jalurChart, loketChart;

        window.onload = function() {
            renderCharts(); fetchDashboardData();
            setInterval(fetchDashboardData, 15000);
        }

        function renderCharts() {
            jalurChart = new Chart(document.getElementById('chartJalur').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: ['Domisili', 'Prestasi', 'Afirmasi', 'Mutasi'],
                    datasets: [{ data: [0, 0, 0, 0], backgroundColor: ['#004687', '#FFD700', '#10B981', '#EF4444'] }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });

            loketChart = new Chart(document.getElementById('chartLoket').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['Loket 1', 'Loket 2', 'Loket 3', 'Loket 4', 'Loket 5', 'Loket 6'],
                    datasets: [{ label: 'Berkas Selesai', data: [0, 0, 0, 0, 0, 0], backgroundColor: '#004687' }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        function fetchDashboardData() {
            fetch(`${APPS_SCRIPT_URL}?action=getDashboardData`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('kpi-total').innerText = data.kpi.total;
                document.getElementById('kpi-wait').innerText = data.kpi.wait;
                document.getElementById('kpi-process').innerText = data.kpi.process;
                document.getElementById('kpi-done').innerText = data.kpi.done;
                jalurChart.data.datasets[0].data = [data.jalur.domisili, data.jalur.prestasi, data.jalur.afirmasi, data.jalur.mutasi];
                jalurChart.update();
                loketChart.data.datasets[0].data = data.loket;
                loketChart.update();
            });
        }
    </script>
</body>
</html>
