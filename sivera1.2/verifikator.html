<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivera - Panel Verifikator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col">

    <!-- Auth Area -->
    <div id="auth-panel" class="max-w-md mx-auto mt-20 p-6 bg-white rounded-2xl shadow-md border mx-4 w-full">
        <h2 class="text-xl font-black text-center text-blue-900 mb-4 uppercase tracking-wider">LOGIN LOKET VERIFIKATOR</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Nomor Ruang/Loket Petugas</label>
                <input type="number" id="v-loket" class="w-full border-2 p-2.5 rounded-lg font-bold" placeholder="Contoh: 1">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">PIN Autentikasi Petugas</label>
                <input type="password" id="v-pin" class="w-full border-2 p-2.5 rounded-lg text-center font-bold tracking-widest" placeholder="••••">
            </div>
            <button onclick="loginVerifikator()" class="w-full bg-blue-800 text-white py-3 rounded-xl font-black uppercase tracking-wider hover:bg-blue-900 transition">MASUK SISTEM</button>
        </div>
    </div>

    <!-- Main Panel Verifikator -->
    <div id="main-panel" class="max-w-4xl mx-auto p-4 w-full hidden flex-grow">
        <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-4 border-2">
            <div>
                <h1 class="font-black text-lg text-blue-900 uppercase">Sivera Petugas Panel</h1>
                <p id="label-loket" class="text-xs text-amber-600 font-black uppercase tracking-wide">Ruang Loket: -</p>
            </div>
            <button onclick="location.reload()" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg text-xs font-black uppercase border border-red-200">LOGOUT</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border-2 text-center h-fit">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Mengoreksi Antrean No</h3>
                <div id="active-num" class="text-6xl font-black text-blue-900 my-2">--</div>
                <p id="active-name" class="text-sm font-black text-gray-600 uppercase mb-5 tracking-wide">Tidak Ada Data</p>
                <button onclick="panggilBerikutnya()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-xs uppercase tracking-widest shadow">
                    PANGGIL ANTREAN BERIKUTNYA
                </button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border-2 md:col-span-2">
                <h3 class="text-xs font-black uppercase tracking-widest mb-3 text-gray-500 flex justify-between items-center">
                    <span>Daftar Tunggu Peserta Hari Ini</span>
                    <button onclick="loadQueueTable()" class="text-[10px] bg-gray-100 px-2 py-1 rounded font-black text-gray-700 hover:bg-gray-200 uppercase">REFRESH TABEL</button>
                </h3>
                <div class="overflow-x-auto max-h-[350px]">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 uppercase font-black tracking-wider border-b-2">
                                <th class="p-2.5">No</th>
                                <th class="p-2.5">Nama</th>
                                <th class="p-2.5">Jalur</th>
                                <th class="p-2.5">Status</th>
                                <th class="p-2.5 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="queue-tbody" class="font-semibold"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER APLIKASI STANDAR -->
    <footer class="bg-white border-t-2 border-gray-200 py-4 text-center text-xs text-gray-600 mt-auto shadow-inner w-full">
        <span class="font-bold tracking-wide uppercase">
            Aplikasi Sivera V 1.2 by MB [PANEL LOKET]
        </span>
    </footer>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA0xQfsUmrVWGTI1WQFauY3UZ2HIV5u7WZRKJ39bpKM1V9cScV-PfRj-n8gZ6Emk9uvw/exec";
        let sessionLoket = "", sessionPin = "";

        function loginVerifikator() {
            const loket = document.getElementById('v-loket').value;
            const pin = document.getElementById('v-pin').value;
            fetch(`${APPS_SCRIPT_URL}?action=loginVerifikator&loket=${loket}&pin=${pin}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "authorized") {
                    sessionLoket = loket; sessionPin = pin;
                    document.getElementById('auth-panel').classList.add('hidden');
                    document.getElementById('main-panel').classList.remove('hidden');
                    document.getElementById('label-loket').innerText = `Ruang Loket: ${loket} (${data.nama_petugas})`;
                    loadQueueTable();
                } else { alert("KODE PIN ATAU NOMOR LOKET SALAH!"); }
            });
        }

        function loadQueueTable() {
            fetch(`${APPS_SCRIPT_URL}?action=getQueueList`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('queue-tbody');
                tbody.innerHTML = "";
                data.forEach(row => {
                    let badge = "bg-gray-100 text-gray-600";
                    if (row.status === "Diproses") badge = "bg-amber-400 text-blue-900";
                    if (row.status === "Selesai") badge = "bg-emerald-600 text-white";
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50 uppercase text-[11px]">
                            <td class="p-2.5 font-black">${row.no_antrean}</td>
                            <td class="p-2.5 font-bold">${row.nama}</td>
                            <td class="p-2.5">${row.jalur}</td>
                            <td class="p-2.5"><span class="px-2 py-0.5 rounded text-[9px] font-black tracking-wider ${badge}">${row.status}</span></td>
                            <td class="p-2.5 text-center">
                                ${row.status !== 'Selesai' ? `<button onclick="validasiAntrean(${row.no_antrean}, '${row.nama}')" class="bg-blue-800 text-white px-3 py-1 rounded text-[9px] font-black hover:bg-blue-900 transition uppercase tracking-wider">LAYANI</button>` : '-'}
                            </td>
                        </tr>`;
                });
            });
        }

        function validasiAntrean(no, nama) {
            if(!confirm(`Konfirmasi melayani nomor antrean ${no} atas nama ${nama}?`)) return;
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "serveQueue", no_antrean: no, loket: sessionLoket, pin: sessionPin })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    document.getElementById('active-num').innerText = String(no).padStart(3, '0');
                    document.getElementById('active-name').innerText = nama;
                    loadQueueTable();
                }
            });
        }

        function panggilBerikutnya() {
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "serveNext", loket: sessionLoket, pin: sessionPin })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    document.getElementById('active-num').innerText = String(data.no_antrean).padStart(3, '0');
                    document.getElementById('active-name').innerText = data.nama;
                    loadQueueTable();
                } else { alert("Selesai! Tidak ada lagi data antrean pendaftar tersisa."); }
            });
        }
    </script>
</body>
</html>
