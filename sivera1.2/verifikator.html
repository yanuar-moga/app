<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivera - Panel Verifikator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Auth Area -->
    <div id="auth-panel" class="max-w-md mx-auto mt-20 p-6 bg-white rounded-2xl shadow-md border mx-4">
        <h2 class="text-xl font-bold text-center text-gray-700 mb-4"><i class="fa-solid fa-lock text-amber-500"></i> Login Verifikator</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold mb-1">Nomor Ruang/Loket</label>
                <input type="number" id="v-loket" class="w-full border p-2 rounded-lg" placeholder="Contoh: 1">
            </div>
            <div>
                <label class="block text-xs font-bold mb-1">PIN Autentikasi</label>
                <input type="password" id="v-pin" class="w-full border p-2 rounded-lg" placeholder="••••">
            </div>
            <button onclick="loginVerifikator()" class="w-full bg-blue-800 text-white py-2 rounded-lg font-bold">Masuk Sistem</button>
        </div>
    </div>

    <!-- Main Panel Verifikator -->
    <div id="main-panel" class="max-w-4xl mx-auto p-4 hidden">
        <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-4 border">
            <div>
                <h1 class="font-bold text-lg text-blue-900">Sivera Verifikator Panel</h1>
                <p id="label-loket" class="text-xs text-amber-600 font-semibold">Ruang Loket: -</p>
            </div>
            <button onclick="location.reload()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold border border-red-200">Logout</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Bagian Aksi / Panggilan Aktif -->
            <div class="bg-white p-4 rounded-xl shadow-sm border text-center h-fit">
                <h3 class="text-xs font-bold text-gray-400 uppercase">Mengoreksi Antrean No</h3>
                <div id="active-num" class="text-5xl font-black text-blue-900 my-2">--</div>
                <p id="active-name" class="text-sm font-semibold text-gray-600 mb-4">Tidak Ada Data</p>
                <button onclick="panggilBerikutnya()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm mb-2 shadow">
                    Panggil Antrean Berikutnya
                </button>
            </div>

            <!-- Tabel Monitoring / List Seluruh Antrean -->
            <div class="bg-white p-4 rounded-xl shadow-sm border md:col-span-2">
                <h3 class="text-sm font-bold mb-3 text-gray-700 flex justify-between items-center">
                    <span>Daftar Tunggu Peserta Hari Ini</span>
                    <button onclick="loadQueueTable()" class="text-xs bg-gray-100 p-1.5 rounded text-gray-500 hover:bg-gray-200"><i class="fa-solid fa-sync"></i> Refresh</button>
                </h3>
                <div class="overflow-x-auto max-h-[400px]">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 uppercase tracking-wider border-b">
                                <th class="p-2">No</th>
                                <th class="p-2">Nama</th>
                                <th class="p-2">Jalur</th>
                                <th class="p-2">Status</th>
                                <th class="p-2 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="queue-tbody">
                            <!-- Diisi Realtime via API -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "URL_WEB_APP_ANDA_DISINI";
        let sessionLoket = "";
        let sessionPin = "";

        function loginVerifikator() {
            const loket = document.getElementById('v-loket').value;
            const pin = document.getElementById('v-pin').value;
            
            fetch(`${APPS_SCRIPT_URL}?action=loginVerifikator&loket=${loket}&pin=${pin}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "authorized") {
                    sessionLoket = loket;
                    sessionPin = pin;
                    document.getElementById('auth-panel').classList.add('hidden');
                    document.getElementById('main-panel').classList.remove('hidden');
                    document.getElementById('label-loket').innerText = `Ruang Loket: ${loket} (${data.nama_petugas})`;
                    loadQueueTable();
                } else {
                    alert("PIN atau nomor Ruang salah!");
                }
            });
        }

        function loadQueueTable() {
            fetch(`${APPS_SCRIPT_URL}?action=getQueueList`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('queue-tbody');
                tbody.innerHTML = "";
                data.forEach(row => {
                    let badgeClass = "bg-gray-100 text-gray-600";
                    if (row.status === "Diproses") badgeClass = "bg-amber-100 text-amber-700 animate-pulse";
                    if (row.status === "Selesai") badgeClass = "bg-emerald-100 text-emerald-700";

                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-2 font-bold">${row.no_antrean}</td>
                            <td class="p-2 font-medium">${row.nama}</td>
                            <td class="p-2">${row.jalur}</td>
                            <td class="p-2"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${badgeClass}">${row.status}</span></td>
                            <td class="p-2 text-center">
                                ${row.status !== 'Selesai' ? `<button onclick="validasiAntrean(${row.no_antrean}, '${row.nama}')" class="bg-blue-800 text-white px-2 py-1 rounded text-[10px] font-bold hover:bg-blue-900 transition">Layani</button>` : '-'}
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function validasiAntrean(no, nama) {
            if(!confirm(`Konfirmasi melayani nomor antrean ${no} atas nama ${nama}?`)) return;
            
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "serveQueue",
                    no_antrean: no,
                    loket: sessionLoket,
                    pin: sessionPin
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    document.getElementById('active-num').innerText = String(no).padStart(3, '0');
                    document.getElementById('active-name').innerText = nama;
                    loadQueueTable();
                } else {
                    alert("Gagal memproses validasi berkas.");
                }
            });
        }

        function panggilBerikutnya() {
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "serveNext",
                    loket: sessionLoket,
                    pin: sessionPin
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    document.getElementById('active-num').innerText = String(data.no_antrean).padStart(3, '0');
                    document.getElementById('active-name').innerText = data.nama;
                    loadQueueTable();
                } else {
                    alert("Tidak ada antrean tersisa di daftar tunggu.");
                }
            });
        }
    </script>
</body>
</html>
