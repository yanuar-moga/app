<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Statistik SIVERA</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn .4s ease-out forwards; }
    
    /* Responsive Banner Styles */
    .banner-wrapper { position: relative; overflow: hidden; border-radius: 18px; width: 100%; }
    .banner-animated { 
        width: 100%; 
        height: auto; 
        aspect-ratio: 16 / 5; /* Menjaga proporsi tetap nyaman di HP maupun Desktop */
        object-fit: cover; 
        display: block;
    }
    
    .card-stat { transition: .25s; }
    .card-stat:hover { transform: translateY(-3px); }
  </style>
</head>

<body class="bg-zinc-100 text-zinc-800 font-sans min-h-screen">

  <header class="bg-blue-900 border-b-4 border-amber-400 p-4 shadow-lg sticky top-0 z-40">
    <div class="container mx-auto max-w-5xl flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-white p-1 rounded-full shadow-md"><img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" alt="Logo" class="w-10 h-10 object-contain"></div>
        <div>
          <h1 class="text-white font-black text-sm uppercase">SMP NEGERI 1 MOGA</h1>
          <a href="https://smpn1moga.sch.id" class="text-amber-400 text-[10px] font-bold uppercase hover:underline"><i class="fa-solid fa-earth-asia"></i> smpn1moga.sch.id</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto max-w-5xl p-4">
    <div class="space-y-5 animate-fade-in">
      
      <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow border border-zinc-200">
        <div>
          <h2 class="text-xs font-black text-blue-950 uppercase">Dashboard SIVERA V 1.3</h2>
          <p id="infoWaktu" class="text-[9px] text-zinc-500 font-bold mt-1 uppercase">Memuat waktu...</p>
        </div>
        <button onclick="muatData(true)" class="bg-blue-50 text-blue-900 text-[10px] font-black px-3 py-2 rounded-xl hover:bg-blue-100 uppercase flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i> Perbarui
        </button>
      </div>

      <div class="banner-wrapper shadow-lg border-2 border-amber-400">
        <a href="https://yanuar-moga.github.io/app/sivera1.3v2/" target="_blank">
          <img src="https://yanuar-moga.github.io/app/sivera1.3v2/assets/SIVERA.png" alt="Banner SIVERA" class="banner-animated">
        </a>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="card-stat bg-white p-4 rounded-xl shadow border-l-4 border-blue-900"><span class="text-[9px] font-black text-zinc-400 uppercase">Total Antrean</span><p id="totalAntrean" class="text-xl font-black text-blue-900">0</p></div>
        <div class="card-stat bg-white p-4 rounded-xl shadow border-l-4 border-emerald-600"><span class="text-[9px] font-black text-zinc-400 uppercase">Sudah Verif</span><p id="totalVerif" class="text-xl font-black text-emerald-600">0</p></div>
        <div class="card-stat bg-white p-4 rounded-xl shadow border-l-4 border-amber-500"><span class="text-[9px] font-black text-zinc-400 uppercase">Belum Verif</span><p id="totalBelum" class="text-xl font-black text-amber-500">0</p></div>
        <div class="card-stat bg-white p-4 rounded-xl shadow border-l-4 border-red-500"><span class="text-[9px] font-black text-zinc-400 uppercase">Ditunda</span><p id="totalTunda" class="text-xl font-black text-red-500">0</p></div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow border border-zinc-200">
        <h3 class="text-xs font-black text-blue-900 uppercase mb-3 border-b pb-2">5 Pendaftar Terbaru</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-[11px] text-left">
            <thead>
              <tr class="text-zinc-400 uppercase font-black text-[10px]">
                <th class="pb-2">Nama</th>
                <th class="pb-2 text-center">Tgl. Tiket</th>
                <th class="pb-2 text-center">No. Antrean</th>
              </tr>
            </thead>
            <tbody id="tabelData" class="divide-y divide-zinc-100"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyIXkRXa88M0xbhBApaeJDMa7QuiSZj0L_Byjl_y-8CAd4IYXxwBabDJSkjMLrBEqWK/exec";

    window.addEventListener("DOMContentLoaded", () => muatData());

    function muatData(isManual = false) {
      if (isManual) document.getElementById("refreshIcon").classList.add("fa-spin");

      fetch(`${API_URL}?action=getDashboardStats`)
        .then(res => res.json())
        .then(data => {
          if (isManual) document.getElementById("refreshIcon").classList.remove("fa-spin");

          document.getElementById("totalAntrean").innerText = data.totalAntrean || 0;
          document.getElementById("totalVerif").innerText = data.totalVerif || 0;
          document.getElementById("totalBelum").innerText = data.totalBelum || 0;
          document.getElementById("totalTunda").innerText = data.totalTunda || 0;
          document.getElementById("infoWaktu").innerText = `Update Terakhir : ${data.lastVerif || '-'}`;

          document.getElementById("tabelData").innerHTML = (data.terbaru || [])
            .map(row => `
              <tr class="hover:bg-zinc-50">
                <td class="py-3 font-bold text-zinc-800 uppercase">${row.nama || "-"}</td>
                <td class="py-3 text-center text-zinc-500 font-mono">${row.tanggalTiket || "-"}</td>
                <td class="py-3 text-center"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded font-black text-[10px]">${row.noAntrean || "-"}</span></td>
              </tr>
            `).join("");
        })
        .catch(() => { if(isManual) document.getElementById("refreshIcon").classList.remove("fa-spin"); });
    }
  </script>
</body>
</html>
