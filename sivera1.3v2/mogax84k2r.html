<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Verifikasi Antrean - SIVERA V 1.3</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn { 
        from { opacity: 0; transform: translateY(12px); } 
        to { opacity: 1; transform: translateY(0); } 
    }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    
    /* Animasi Ticker Roll dari Bawah ke Atas */
    .ticker-item {
      opacity: 0;
      transform: translateY(100%);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-in-out;
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ticker-item.active {
      opacity: 1;
      transform: translateY(0);
    }
    .ticker-item.exit {
      opacity: 0;
      transform: translateY(-100%);
    }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-800 font-sans min-h-screen flex flex-col justify-between select-none">

  <header class="bg-blue-900 border-b-4 border-amber-400 p-4 shadow-md">
    <div class="container mx-auto max-w-md flex items-center gap-3.5 px-1">
      <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" alt="Logo" class="w-14 h-14 object-contain shrink-0 bg-white p-1 rounded-full shadow-sm">
      <div class="leading-tight">
        <h1 class="text-sm font-black text-white tracking-wide uppercase">SMP Negeri 1 Moga</h1>
        <p class="text-[10px] text-zinc-200 font-bold">Jl. Simpang Tiga Banyumudal, Kec. Moga</p>
        <a href="https://smpn1moga.sch.id" target="_blank" class="text-[10px] text-amber-400 font-black hover:underline hover:text-amber-300">smpn1moga.sch.id</a>
      </div>
    </div>
  </header>

  <main class="container mx-auto p-4 flex-grow max-w-md flex flex-col justify-center">
    <div id="broadcastBox" class="hidden bg-amber-50 border-2 border-amber-400 p-4 rounded-xl mb-3 shadow-sm flex items-start gap-3 animate-fade-in">
      <img src="https://yanuar-moga.github.io/app/sivera1.3/assets/info.png" alt="Info" class="w-8 h-8 object-contain mt-0.5 shrink-0">
      <div>
        <h4 class="font-black text-xs text-blue-950 uppercase tracking-wider">Pengumuman:</h4>
        <p id="broadcastText" class="text-xs text-zinc-700 mt-0.5 leading-relaxed"></p>
      </div>
    </div>

    <div class="bg-blue-900 text-white px-4 rounded-xl mb-4 border border-blue-950 shadow-md relative h-12 animate-fade-in flex items-center justify-center overflow-hidden">
      <div id="tickerContainer" class="relative w-full h-full text-[11px] font-bold text-center tracking-wide">
        <div class="ticker-item active text-zinc-300 italic">Memuat informasi...</div>
      </div>
    </div>

    <div id="customAlert" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-xs w-full p-5 text-center shadow-2xl border-t-8 border-blue-900">
        <div id="alertIcon" class="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 shadow-md"></div>
        <h3 id="alertTitle" class="text-sm font-black text-blue-900 uppercase"></h3>
        <p id="alertMessage" class="text-xs text-zinc-600 mt-2 mb-4 leading-relaxed"></p>
        <button onclick="closeAlert()" class="w-full bg-blue-900 text-amber-400 font-black text-xs py-2.5 rounded-xl transition uppercase">OK</button>
      </div>
    </div>

    <div id="formSection" class="bg-white rounded-2xl p-5 shadow-xl border border-zinc-200 animate-fade-in">
      <h2 class="text-center text-base font-black text-blue-900 uppercase mb-5">Formulir Antrean</h2>
      <form id="formDaftar" onsubmit="submitForm(event)" class="space-y-4">
        <input type="text" id="nama" required placeholder="Nama Lengkap" class="w-full bg-zinc-50 border p-3 text-sm rounded-xl">
        <input type="number" id="nisn" required placeholder="NISN" class="w-full bg-zinc-50 border p-3 text-sm rounded-xl">
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center justify-center gap-2 border p-3 rounded-xl bg-zinc-50"><input type="radio" name="jk" value="L" required> Laki-laki</label>
          <label class="flex items-center justify-center gap-2 border p-3 rounded-xl bg-zinc-50"><input type="radio" name="jk" value="P" required> Perempuan</label>
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-blue-900 text-amber-400 p-3.5 rounded-xl font-black text-xs uppercase shadow-md">Ambil Nomor Antrean</button>
      </form>
    </div>

    <div id="ticketSection" class="hidden space-y-4 animate-fade-in">
      <div id="ticketCard" class="bg-blue-950 rounded-2xl shadow-2xl p-5 border-2 border-blue-900 text-white">
        <div class="text-center mb-5">
            <span class="text-[10px] uppercase tracking-widest text-blue-300">Nomor Antrean</span>
            <div id="t_no" class="text-5xl font-black text-amber-400 my-2">000</div>
        </div>
        <div class="space-y-2 text-xs">
            <div class="flex justify-between"><span>Nama:</span><span id="t_nama" class="font-bold"></span></div>
            <div class="flex justify-between"><span>NISN:</span><span id="t_nisn" class="font-bold"></span></div>
            <div class="flex justify-between"><span>Jadwal:</span><span id="t_tgl" class="font-bold text-amber-400"></span></div>
        </div>
      </div>
      <button onclick="keluarKeIndex()" class="w-full bg-zinc-700 text-white p-3 rounded-xl font-black text-xs uppercase">Kembali</button>
    </div>
  </main>

  <script>
    // GANTI URL INI DENGAN URL DEPLOYMENT BARU ANDA
    var API_URL = "https://script.google.com/macros/s/AKfycbyIXkRXa88M0xbhBApaeJDMa7QuiSZj0L_Byjl_y-8CAd4IYXxwBabDJSkjMLrBEqWK/exec";
    var currentIndex = 0;

    function startTickerEngine(tickers) {
      var container = document.getElementById('tickerContainer');
      container.innerHTML = tickers.map(t => `<div class="ticker-item text-zinc-100">${t}</div>`).join('');
      var items = container.querySelectorAll('.ticker-item');
      items[0].classList.add('active');
      setInterval(() => {
        items[currentIndex].classList.remove('active');
        items[currentIndex].classList.add('exit');
        currentIndex = (currentIndex + 1) % items.length;
        items[currentIndex].classList.add('active');
        setTimeout(() => { items[(currentIndex - 1 + items.length) % items.length].classList.remove('exit'); }, 600);
      }, 4000);
    }

    // Logic fetch broadcast, ticker, dan form tetap sama seperti sebelumnya...
    window.onload = function() {
      fetch(API_URL + "?action=getTickers")
        .then(res => res.json())
        .then(data => startTickerEngine(data.tickers || ["Selamat Datang di SIVERA v1.3"]));
    };

    function submitForm(e) {
        e.preventDefault();
        // ... (Logika submitForm sesuai kode yang Anda miliki)
    }

    function closeAlert() { document.getElementById('customAlert').classList.add('hidden'); }
    function keluarKeIndex() { location.reload(); }
  </script>
</body>
</html>
