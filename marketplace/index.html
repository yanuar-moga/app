<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearUp Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: #f4f4f4;
}

/* BANNER */
.banner {
  width: 100%;
  height: 300px;
  overflow: hidden;
}

.banner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* WRAPPER */
.wrapper {
  padding: 50px 8%;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px;
}

/* CARD */
.card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  transition: 0.3s ease;
  display: flex;
  flex-direction: column;
  position: relative;
}

.card:hover {
  transform: translateY(-6px);
}

.badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: #ff3c00;
  color: white;
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 20px;
  font-weight: 600;
}

.wishlist {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 18px;
  cursor: pointer;
  background: white;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  box-shadow: 0 5px 10px rgba(0,0,0,0.1);
  transition: 0.2s;
}

.wishlist.active {
  color: red;
}

.card-image {
  aspect-ratio: 1/1;
  overflow: hidden;
  background: #eee;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-content {
  padding: 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card h3 {
  font-size: 16px;
  margin-bottom: 8px;
}

.card p {
  font-size: 13px;
  color: #666;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.readmore {
  margin-top: 8px;
  font-size: 13px;
  font-weight: 500;
  color: #ff4d00;
  cursor: pointer;
}

.price {
  font-weight: 600;
  margin-top: 12px;
}

/* MODAL */
.modal {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: flex-end;
}

.modal-content {
  background: white;
  width: 100%;
  max-width: 500px;
  border-radius: 25px 25px 0 0;
  padding: 25px;
  animation: slideUp 0.3s ease;
  position: relative;
  max-height: 90%;
  overflow-y: auto;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.drag-bar {
  width: 40px;
  height: 5px;
  background: #ccc;
  border-radius: 10px;
  margin: 0 auto 15px auto;
}

.modal-content h2 {
  margin-bottom: 10px;
}

.modal-content p {
  font-size: 14px;
  color: #555;
  margin-bottom: 15px;
}

.buy-btn {
  width: 100%;
  padding: 12px;
  background: #ff3c00;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}

.buy-btn:hover {
  opacity: 0.9;
}

/* RESPONSIVE */
@media(max-width: 1000px){
  .container { grid-template-columns: repeat(3, 1fr); }
}

@media(max-width: 768px){
  .container { grid-template-columns: repeat(2, 1fr); }
}

@media(max-width: 500px){
  .container { grid-template-columns: repeat(1, 1fr); }
}
</style>
</head>
<body>

<div class="banner">
  <img src="assets/banner.png" alt="Banner Toko">
</div>

<div class="wrapper">
  <div class="container" id="productContainer"></div>
</div>

<div class="modal" id="productModal">
  <div class="modal-content" id="modalContent">
    <div class="drag-bar"></div>
    <h2 id="modalTitle"></h2>
    <p id="modalDescription"></p>
    <div class="price" id="modalPrice"></div>
    <br>
    <button class="buy-btn">🛒 Beli Sekarang</button>
  </div>
</div>

<script>
const sheetID = "1qy8UisHsVDTKiV72DUv6ZIkWKyKqQccH4N3l9mElpxU";
const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

fetch(url)
.then(res => res.text())
.then(data => {
  const json = JSON.parse(data.substr(47).slice(0, -2));
  const rows = json.table.rows;
  const container = document.getElementById("productContainer");

  rows.forEach((row, index) => {
    const id = row.c[0]?.v;
    const nama = row.c[1]?.v;
    const deskripsi = row.c[2]?.v;
    const harga = row.c[3]?.v;

    const badgeText = index % 2 === 0 ? "🔥 Best Seller" : "🔥 Promo";

    const card = `
      <div class="card">
        <div class="badge">${badgeText}</div>
        <div class="wishlist" onclick="toggleWishlist(this)">❤️</div>
        <div class="card-image">
          <img src="assets/produk${id}.png" alt="${nama}">
        </div>
        <div class="card-content">
          <h3>${nama}</h3>
          <p>${deskripsi}</p>
          <div class="readmore" onclick="openModal('${nama}', \`${deskripsi}\`, '${harga}')">Read More</div>
          <div class="price">Rp ${Number(harga).toLocaleString('id-ID')}</div>
        </div>
      </div>
    `;
    container.innerHTML += card;
  });
});

function toggleWishlist(el) {
  el.classList.toggle("active");
}

function openModal(title, description, price) {
  document.getElementById("modalTitle").innerText = title;
  document.getElementById("modalDescription").innerText = description;
  document.getElementById("modalPrice").innerText = "Rp " + Number(price).toLocaleString('id-ID');
  document.getElementById("productModal").style.display = "flex";
}

const modal = document.getElementById("productModal");
const modalContent = document.getElementById("modalContent");

let startY = 0;
modalContent.addEventListener("touchstart", e => {
  startY = e.touches[0].clientY;
});

modalContent.addEventListener("touchmove", e => {
  let moveY = e.touches[0].clientY;
  if(moveY - startY > 100){
    modal.style.display = "none";
  }
});

modal.addEventListener("click", e => {
  if(e.target === modal){
    modal.style.display = "none";
  }
});
</script>

</body>
</html>
