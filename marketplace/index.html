<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearUp Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: #f4f4f4;
}

/* HEADER */
.header {
  text-align: center;
  padding: 20px;
  background: #111;
  color: white;
}

.header h1 {
  font-weight: 600;
  letter-spacing: 1px;
}

/* BANNER */
.banner {
  width: 100%;
  height: 300px;
  overflow: hidden;
}

.banner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* CONTENT WRAPPER */
.wrapper {
  padding: 50px 8%;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px;
}

/* CARD */
.card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  transition: 0.3s ease;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.card:hover {
  transform: translateY(-6px);
}

.card-image {
  aspect-ratio: 1/1;
  overflow: hidden;
  background: #eee;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-content {
  padding: 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card h3 {
  font-size: 16px;
  margin-bottom: 8px;
  min-height: 45px;
}

.card p {
  font-size: 13px;
  color: #666;
  min-height: 60px;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.price {
  font-weight: 600;
  margin-top: auto;
  color: #000;
}

/* RESPONSIVE */
@media(max-width: 1000px){
  .container {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media(max-width: 768px){
  .container {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width: 500px){
  .container {
    grid-template-columns: repeat(1, 1fr);
  }
}
</style>
</head>
<body>

<div class="header">
  <h1>GearUp Store</h1>
</div>

<div class="banner">
  <img src="assets/banner.png" alt="Banner Toko">
</div>

<div class="wrapper">
  <div class="container" id="productContainer"></div>
</div>

<script>

const sheetID = "1qy8UisHsVDTKiV72DUv6ZIkWKyKqQccH4N3l9mElpxU";
const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

fetch(url)
  .then(res => res.text())
  .then(data => {
    const json = JSON.parse(data.substr(47).slice(0, -2));
    const rows = json.table.rows;
    const container = document.getElementById("productContainer");

    rows.forEach(row => {
      const id = row.c[0]?.v;
      const nama = row.c[1]?.v;
      const deskripsi = row.c[2]?.v;
      const harga = row.c[3]?.v;

      const card = `
        <div class="card">
          <div class="card-image">
            <img src="assets/produk${id}.png" alt="${nama}">
          </div>
          <div class="card-content">
            <h3>${nama}</h3>
            <p>${deskripsi}</p>
            <div class="price">Rp ${Number(harga).toLocaleString('id-ID')}</div>
          </div>
        </div>
      `;

      container.innerHTML += card;
    });
  });

</script>

</body>
</html>
