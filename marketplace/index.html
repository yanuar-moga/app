<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 40px;
}

h2 {
  margin-bottom: 30px;
}

.container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px;
}

.card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  transition: 0.3s ease;
}

.card:hover {
  transform: translateY(-6px);
}

.card-image {
  aspect-ratio: 1/1;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-content {
  padding: 18px;
}

.card h3 {
  font-size: 16px;
  margin-bottom: 8px;
}

.card p {
  font-size: 13px;
  color: #666;
  min-height: 40px;
}

.price {
  font-weight: 600;
  margin-top: 10px;
}

@media(max-width: 900px){
  .container {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width: 500px){
  .container {
    grid-template-columns: repeat(1, 1fr);
  }
}
</style>
</head>
<body>

<h2>Katalog Produk</h2>
<div class="container" id="productContainer"></div>

<script>

const sheetID = "1qy8UisHsVDTKiV72DUv6ZIkWKyKqQccH4N3l9mElpxU";
const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

fetch(url)
  .then(res => res.text())
  .then(data => {
    const json = JSON.parse(data.substr(47).slice(0, -2));
    const rows = json.table.rows;
    const container = document.getElementById("productContainer");

    rows.forEach(row => {
      const id = row.c[0]?.v;
      const nama = row.c[1]?.v;
      const deskripsi = row.c[2]?.v;
      const harga = row.c[3]?.v;

      const card = `
        <div class="card">
          <div class="card-image">
            <img src="assets/produk${id}.jpg" alt="${nama}">
          </div>
          <div class="card-content">
            <h3>${nama}</h3>
            <p>${deskripsi}</p>
            <div class="price">Rp ${Number(harga).toLocaleString('id-ID')}</div>
          </div>
        </div>
      `;

      container.innerHTML += card;
    });
  });

</script>

</body>
</html>
