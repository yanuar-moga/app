<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #f8f8f8;
  padding: 40px;
}

h1 {
  text-align: center;
  margin-bottom: 40px;
  font-weight: 600;
}

.container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px;
}

.card {
  background: #ffffff;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  transition: 0.3s ease;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.08);
}

.card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
}

.card-content {
  padding: 18px;
}

.card h3 {
  font-size: 16px;
  margin-bottom: 8px;
  font-weight: 500;
}

.card p {
  font-size: 13px;
  color: #666;
  margin-bottom: 12px;
}

.price {
  font-weight: 600;
  font-size: 15px;
  color: #000;
}

/* Responsive */
@media(max-width: 1200px) {
  .container {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media(max-width: 768px) {
  .container {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width: 480px) {
  .container {
    grid-template-columns: repeat(1, 1fr);
  }
}
</style>
</head>

<body>

<h1>Katalog Produk</h1>

<div class="container">

  <!-- 16 PRODUCT CARDS -->

  <!-- COPY CARD INI UNTUK TAMBAH PRODUK -->
  <div class="card">
    <img src="https://via.placeholder.com/500" alt="Produk">
    <div class="card-content">
      <h3>Nama Produk</h3>
      <p>Deskripsi singkat produk di sini.</p>
      <div class="price">Rp 199.000</div>
    </div>
  </div>

  <!-- Duplicate 15x -->
  <!-- Kamu bisa copy card di atas sampai total 16 -->

</div>

</body>
</html>
